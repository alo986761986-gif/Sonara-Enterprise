<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SONARA Creative AI Platform</title>
  <desc id="desc">Professional SONARA boot splash with sonic S emblem</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#071c42"/>
      <stop offset="0.42" stop-color="#030916"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="blue" x1="530" y1="145" x2="1035" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b4dff"/>
      <stop offset="0.42" stop-color="#009dff"/>
      <stop offset="0.78" stop-color="#19e8ff"/>
      <stop offset="1" stop-color="#4ff8ff"/>
