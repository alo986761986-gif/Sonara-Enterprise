name: Diagnose SONARA 68 Percent Stall

on:
  push:
    paths:
      - '.github/workflows/verify-kaggle-live-v17.yml'
      - '.github/kaggle-live-v17-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Load current production T4 endpoints
        shell: bash
        run: |
          set -euo pipefail
          f='.github/kaggle-workers-trigger'
          GPU0="$(sed -n 's/^GPU0=//p' "$f" | tail -n1 | tr -d '\r')"
          GPU1="$(sed -n 's/^GPU1=//p' "$f" | tail -n1 | tr -d '\r')"
          test -n "$GPU0"
          test -n "$GPU1"
          echo "GPU0=${GPU0%/}" >> "$GITHUB_ENV"
          echo "GPU1=${GPU1%/}" >> "$GITHUB_ENV"

      - name: Inspect full worker health and model inventory
        shell: bash
        run: |
          set -euo pipefail
          for pair in "gpu0:$GPU0" "gpu1:$GPU1"; do
            name="${pair%%:*}"
            url="${pair#*:}"
            echo "===== ${name} HEALTH ====="
            curl -fsS --connect-timeout 10 --max-time 30 "$url/health" | tee "/tmp/${name}-health.json"
            echo
            echo "===== ${name} MODELS ====="
            curl -fsS --connect-timeout 10 --max-time 30 "$url/v1/models" | tee "/tmp/${name}-models.json" || true
            echo
          done

      - name: Run full ACE-Step render probe on both T4 workers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.json <<'JSON'
          {
            "prompt":"deep house, 122 BPM, dark warm bass, professional club mix, instrumental",
            "lyrics":"",
            "model":"acestep-v15-turbo",
            "audio_duration":10,
            "inference_steps":4,
            "thinking":true,
            "use_format":true,
            "use_cot_metas":false,
            "use_cot_caption":true,
            "use_cot_language":true,
            "constrained_decoding":true,
            "allow_lm_batch":false,
            "lm_model_path":"acestep-5Hz-lm-0.6B",
            "lm_backend":"pt"
          }
          JSON

          probe_worker() {
            local name="$1"
            local url="$2"
            echo "===== ${name} SUBMIT ====="
            curl -fsS --connect-timeout 10 --max-time 120 \
              -H 'Content-Type: application/json' \
              -X POST "$url/release_task" \
              --data-binary @/tmp/probe.json > "/tmp/${name}-submit.json"
            cat "/tmp/${name}-submit.json"
            echo
            local task_id
            task_id="$(jq -r '.data.task_id // empty' "/tmp/${name}-submit.json")"
            test -n "$task_id"
            echo "${name} TASK_ID=${task_id}"

            for attempt in $(seq 1 48); do
              curl -fsS --connect-timeout 10 --max-time 30 \
                -H 'Content-Type: application/json' \
                -X POST "$url/query_result" \
                --data "{\"task_id_list\":[\"${task_id}\"]}" > "/tmp/${name}-query.json" || true
              echo "===== ${name} POLL ${attempt}/48 ====="
              cat "/tmp/${name}-query.json" 2>/dev/null || true
              echo
              status="$(jq -r '.data[0].status // empty' "/tmp/${name}-query.json" 2>/dev/null || true)"
              if [[ "$status" == "1" ]]; then
                echo "${name}_FULL_RENDER=SUCCESS"
                return 0
              fi
              if [[ -n "$status" && "$status" != "0" ]]; then
                echo "${name}_FULL_RENDER=FAILED status=${status}" >&2
                return 1
              fi
              sleep 5
            done
            echo "${name}_FULL_RENDER=STUCK_STATUS_0" >&2
            return 1
          }

          failed=0
          probe_worker gpu0 "$GPU0" || failed=1
          probe_worker gpu1 "$GPU1" || failed=1
          exit "$failed"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo 'SONARA 68% diagnostic completed.'
          for name in gpu0 gpu1; do
            echo "===== ${name} LAST QUERY ====="
            cat "/tmp/${name}-query.json" 2>/dev/null || true
            echo
          done
