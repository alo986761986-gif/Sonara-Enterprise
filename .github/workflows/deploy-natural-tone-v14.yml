name: Verify SONARA Natural Tone V15 Silk

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-natural-tone-v14.py"
      - "scripts/patch-natural-tone-v14-edge.py"
      - "cloudflare/sonara-natural-tone-v14.test.mjs"
      - ".github/workflows/deploy-natural-tone-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-natural-tone-v15-silk-verification
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify current Natural Tone production contract
        run: |
          python scripts/patch-natural-tone-v14.py
          python scripts/patch-natural-tone-v14-edge.py

      - name: Validate V15 Silk and Natural Instruments A/B
        run: |
          node --check cloudflare/sonara-engine-v15-authoritative-prompt.mjs
          node --check cloudflare/sonara-molab-xl-router.mjs
          node --check cloudflare/sonara-real-music-v2-edge.mjs
          node --check cloudflare/sonara-instrument-realism-v3.mjs
          node cloudflare/sonara-natural-tone-v14.test.mjs
          node cloudflare/sonara-r2-generation-profile.test.mjs
          node cloudflare/sonara-quality-ab-diversity-v8.test.mjs
          grep -Fq "const NATURAL_TONE_PROFILE = 'sonara-natural-tone-v15-silk';" cloudflare/sonara-real-music-v2-edge.mjs
          grep -Fq "const NATURAL_TONE_PROFILE = 'sonara-natural-tone-v15-silk';" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "sonara-natural-instruments-ab-v1" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "cheap one-note drum pulse" cloudflare/sonara-molab-xl-router.mjs
          ! grep -Fq "dcwMode: 'double'" cloudflare/sonara-real-music-v2-edge.mjs
          ! grep -Fq "dcwHighScaler: 0.06" cloudflare/sonara-real-music-v2-edge.mjs

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Revalidate production source after build
        run: |
          node cloudflare/sonara-natural-tone-v14.test.mjs
          node cloudflare/sonara-r2-generation-profile.test.mjs
          node cloudflare/sonara-quality-ab-diversity-v8.test.mjs
          grep -Fq "sonara-natural-tone-v15-silk" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "sonara-natural-instruments-ab-v1" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "dcw_mode: 'low'" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "dcw_scaler: 0.02" cloudflare/sonara-molab-xl-router.mjs
          grep -Fq "dcw_high_scaler: 0.0" cloudflare/sonara-molab-xl-router.mjs
