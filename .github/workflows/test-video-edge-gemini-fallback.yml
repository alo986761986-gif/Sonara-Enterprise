name: Test Video Edge Gemini Fallback

on:
  push:
    branches:
      - fix/video-edge-gemini-fallback-20260828
    paths:
      - "cloudflare/sonara-video-api-recovery.mjs"
      - "cloudflare/sonara-video-api-recovery.test.mjs"
      - "cloudflare/sonara-web-v15-router.mjs"
      - ".github/workflows/test-video-edge-gemini-fallback.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test isolated Gemini edge fallback
        run: node cloudflare/sonara-video-api-recovery.test.mjs
      - name: Verify router passes Worker bindings
        run: |
          grep -q "recoverVideoApi(request, { env, ctx })" cloudflare/sonara-web-v15-router.mjs
          grep -q "veo-3.1-fast-generate-preview" cloudflare/sonara-video-api-recovery.mjs
          grep -q "cloudflare-video-json-v2" cloudflare/sonara-video-api-recovery.mjs
      - name: Verify existing music engine remains v16
        run: |
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs
