name: SONARA rescue homepage root via Cloudflare redirect rule
on:
  push:
    branches: [fix/sonara-black-screen-main-safe-20261109]
    paths: [.github/sonara-root-routing-recovery-trigger]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Set exact-home redirect only and validate live
        run: |
          python3 - <<'PY'
          import os,sys,json,time,urllib.request,urllib.error
          status={'success':False,'worker_untouched':True,'remix_untouched':True,'redirect_rule_created':False}
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          def output(s):
              status['stage']=s
              with open('.github/sonara-root-routing-result.json','w') as f:json.dump(status,f,indent=2)
              print('SONARA_ROOT_ROUTING='+json.dumps(status),flush=True)
          if not token:
              output('CF_TOKEN_MISSING');sys.exit(1)
          def cf(url,method='GET',payload=None):
              b=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+url,method=method,data=b,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:return json.load(resp)
              except urllib.error.HTTPError as e:
                  return {'http':e.code,'error':'Cloudflare HTTP'}
              except Exception as e:return {'error':type(e).__name__}
          zones=cf('/zones?name=sonaraenterprise.com&per_page=10')
          z=next((v for v in zones.get('result',[]) if v.get('name')=='sonaraenterprise.com'),None)
          if not z:output('ZONE_NOT_FOUND');sys.exit(1)
          base='/zones/'+z['id']
          phase=base+'/rulesets/phases/http_request_dynamic_redirect/entrypoint'
          current=cf(phase)
          if current.get('http') not in (None,404) or current.get('error'):output('CLOUDFLARE_RULESET_READ_ERROR');sys.exit(1)
          ruleset=current.get('result')
          desc='SONARA fix black screen root to verified refresh entry'
          expression='(http.host in {"sonaraenterprise.com" "www.sonaraenterprise.com"} and http.request.uri.path eq "/" and http.request.uri.query eq "")'
          rule={'description':desc,'expression':expression,'action':'redirect','enabled':True,'action_parameters':{'from_value':{'status_code':302,'target_url':{'value':'https://sonaraenterprise.com/?refresh=20261109'},'preserve_query_string':False}}}
          if isinstance(ruleset,dict):
              rules=ruleset.get('rules',[])
              if any(v.get('description')==desc for v in rules):
                  status['redirect_rule_created']=True
                  output('RULE_ALREADY_PRESENT')
              elif any(v.get('expression')==expression for v in rules):
                  output('CONFLICTING_ROOT_RULE_PRESENT');sys.exit(1)
              else:
                  response=cf(base+'/rulesets/'+ruleset['id']+'/rules','POST',rule)
                  if response.get('success') is not True:
                      status['cloudflare_status']=response.get('http')
                      output('RULE_ADD_FAILED');sys.exit(1)
                  status['redirect_rule_created']=True
                  output('RULE_ADD_ACCEPTED')
          else:
              payload={'name':'SONARA root homepage rescue','kind':'zone','phase':'http_request_dynamic_redirect','rules':[rule]}
              response=cf(base+'/rulesets','POST',payload)
              if response.get('success') is not True:
                  status['cloudflare_status']=response.get('http')
                  output('RULESET_CREATION_FAILED');sys.exit(1)
              status['redirect_rule_created']=True
              output('RULESET_CREATED')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect)
          tested=[]
          for host in ('sonaraenterprise.com','www.sonaraenterprise.com'):
              found=False
              for _ in range(6):
                  req=urllib.request.Request('https://'+host+'/',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  try:
                      with opener.open(req,timeout=15) as res:
                          code=res.status
                          location=res.headers.get('location','')
                  except urllib.error.HTTPError as err:
                      code=err.code;location=err.headers.get('location','')
                  except Exception:
                      code=0;location=''
                  if code==302 and location=='https://sonaraenterprise.com/?refresh=20261109':
                      found=True;break
                  time.sleep(2)
              tested.append({'host':host,'redirect_302':found})
          status['verified_hosts']=tested
          status['success']=all(x['redirect_302'] for x in tested)
          output('VERIFIED' if status['success'] else 'RULE_ACCEPTED_NOT_YET_VISIBLE')
          if not status['success']:sys.exit(1)
          PY
      - name: Save result to branch without secrets
        if: always()
        run: |
          python3 - <<'PY'
          import os,base64,json,urllib.request
          path='.github/sonara-root-routing-result.json'
          if not os.path.exists(path):raise SystemExit(0)
          p={'message':'ops: record Cloudflare root routing recovery result','branch':os.environ['GITHUB_REF_NAME'],'content':base64.b64encode(open(path,'rb').read()).decode()}
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path
          r=urllib.request.Request(u,method='PUT',data=json.dumps(p).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(r,timeout=25) as res:print('SONARA_RESULT_SAVED='+str(res.status))
          except Exception as e:print('SONARA_RESULT_SAVE_ERROR='+type(e).__name__)
          PY
