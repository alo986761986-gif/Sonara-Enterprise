name: Validate SONARA Open Music Engines

on:
  pull_request:
    paths:
      - 'cloudflare/sonara-multi-engine-r2.mjs'
      - 'cloudflare/sonara-multi-engine-r2.test.mjs'
      - 'cloudflare/sonara-gateway-verifier.mjs'
      - 'cloudflare/sonara-gateway-multi-engine.test.mjs'
      - 'cloudflare/sonara-real-music-v3-edge.mjs'
      - 'cloudflare/sonara-ab-player-visibility-edge.mjs'
      - 'cloudflare/sonara-web-v15-router.mjs'
      - 'cloudflare/sonara-creator-open-model-route.mjs'
      - 'cloudflare/sonara-creator-open-model-route.test.mjs'
      - 'cloudflare/sonara-native-open-model-entry.mjs'
      - 'cloudflare/sonara-native-open-model-entry.test.mjs'
      - 'molab/sonara_heartmula_style.py'
      - 'molab/test_sonara_heartmula_style.py'
      - 'cloudflare/sonara-relay-gateway-entry.mjs'
      - 'molab/sonara_multi_engine_agent.py'
      - 'molab/install_sonara_multi_engine.py'
      - 'src/components/generator/**'
      - 'api/billing/**'
      - '.github/workflows/validate-sonara-multi-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate isolated model gateway code
        run: |
          node --check cloudflare/sonara-multi-engine-r2.mjs
          node --check cloudflare/sonara-real-music-v3-edge.mjs
          node --check cloudflare/sonara-ab-player-visibility-edge.mjs
          node --check cloudflare/sonara-web-v15-router.mjs
          node --check cloudflare/sonara-native-open-model-entry.mjs
          node --check cloudflare/sonara-relay-gateway-entry.mjs
          node --test cloudflare/sonara-multi-engine-r2.test.mjs cloudflare/sonara-gateway-multi-engine.test.mjs cloudflare/sonara-creator-open-model-route.test.mjs cloudflare/sonara-native-open-model-entry.test.mjs
      - name: Validate MoLab Python agents
        run: |
          python -m py_compile molab/sonara_multi_engine_agent.py molab/install_sonara_multi_engine.py molab/sonara_heartmula_wav_wrapper.py molab/sonara_multi_gateway_diagnose.py molab/sonara_heartmula_style.py
          python -m unittest discover -s molab -p 'test_sonara_heartmula_style.py' -v
      - name: Build SONARA production UI
        run: |
          npm install
          npm run build
