name: Deploy SONARA YuE Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/yue-production-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: sonara-yue-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_INTERNAL_PROXY_SECRET: ${{ secrets.SONARA_INTERNAL_PROXY_SECRET }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate YuE production chain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-yue-primary-edge.mjs' wrangler.jsonc
          grep -q 'SONARA_YUE_WORKER_URL' wrangler.jsonc
          node --check cloudflare/sonara-yue-router.mjs
          node --check cloudflare/sonara-yue-primary-edge.mjs

          YUE_URL='https://yue.sonaraenterprise.com'
          : >/tmp/yue-health.json
          ready=0
          for attempt in $(seq 1 24); do
            status="$(curl -sS --max-time 15 -o /tmp/yue-health.json -w '%{http_code}' "${YUE_URL}/health" || true)"
            echo "YuE health attempt ${attempt}/24 HTTP=${status}"
            if [ "${status}" = "200" ] && grep -q 'SONARA YuE RTX PRO 6000' /tmp/yue-health.json; then
              ready=1
              cat /tmp/yue-health.json
              break
            fi
            sleep 5
          done
          test "${ready}" = "1"

      - name: Probe YuE POST without starting generation
        shell: bash
        run: |
          set -euo pipefail
          YUE_URL='https://yue.sonaraenterprise.com'
          status="$(curl -sS --max-time 20 -o /tmp/yue-post-probe.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary '{' \
            "${YUE_URL}/release_task" || true)"
          echo "YuE /release_task malformed-JSON probe HTTP=${status}"
          cat /tmp/yue-post-probe.json || true
          test "${status}" = "400"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy current SONARA worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://api.sonaraenterprise.com/api/health?yue=production' >/tmp/sonara-health.json

          YUE_URL='https://yue.sonaraenterprise.com'
          ready=0
          for attempt in $(seq 1 12); do
            status="$(curl -sS --max-time 15 -o /tmp/yue-health-after.json -w '%{http_code}' "${YUE_URL}/health" || true)"
            echo "YuE post-deploy health attempt ${attempt}/12 HTTP=${status}"
            if [ "${status}" = "200" ] && grep -q 'SONARA YuE RTX PRO 6000' /tmp/yue-health-after.json; then
              ready=1
              cat /tmp/yue-health-after.json
              break
            fi
            sleep 5
          done
          test "${ready}" = "1"
          echo 'SONARA production endpoint and YuE GPU worker are both online.'
