name: Deploy SONARA YuE Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/yue-production-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: sonara-yue-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate YuE production chain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-billing-edge-router.mjs' wrangler.jsonc
          grep -q 'sonara-musical-family-router.mjs' cloudflare/sonara-billing-edge-router.mjs
          grep -q 'SONARA_YUE_WORKER_URL' wrangler.jsonc
          grep -q 'sonara-yue-router.mjs' cloudflare/sonara-music-taxonomy-lock-router.mjs
          node --check cloudflare/sonara-yue-router.mjs
          curl -fsS --max-time 20 'https://regarded-connector-resulting-cartridges.trycloudflare.com/health' >/tmp/yue-health.json
          cat /tmp/yue-health.json
          grep -q 'SONARA YuE RTX PRO 6000' /tmp/yue-health.json

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy current SONARA worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://api.sonaraenterprise.com/api/health?yue=production' >/tmp/sonara-health.json
          curl -fsS --max-time 20 'https://regarded-connector-resulting-cartridges.trycloudflare.com/health' >/tmp/yue-health-after.json
          cat /tmp/yue-health-after.json
          grep -q 'SONARA YuE RTX PRO 6000' /tmp/yue-health-after.json
          echo 'SONARA production endpoint and YuE GPU worker are both online.'
