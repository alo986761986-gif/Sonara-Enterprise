name: Deploy SONARA Studio Real Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/studio/SonaraStudio.tsx"
      - "src/components/studio/StudioSectionControl.tsx"
      - "src/components/studio/SonaraSessions2Timeline.tsx"
      - "src/components/studio/studioRealEngine.ts"
      - "scripts/activate-studio-real-engine-v2.cjs"
      - "scripts/activate-studio-video-v1.cjs"
      - "scripts/activate-studio-key-control.cjs"
      - "scripts/activate-studio-sessions-native.cjs"
      - "scripts/build-dispatch.cjs"
      - "public/sonara-studio-pitch-key-dsp-v6.js"
      - "cloudflare/sonara-studio-pitch-key-upload-bridge.mjs"
      - "cloudflare/sonara-studio-key-pitch-guard.mjs"
      - "cloudflare/sonara-studio-native-pitch-bridge.mjs"
      - "wrangler.jsonc"
      - "index.html"
      - ".github/workflows/deploy-sonara-studio-real-engine.yml"

permissions:
  contents: read

concurrency:
  group: sonara-studio-real-engine-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build deploy and verify Studio Real Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate Studio DSP Pitch Key V6 source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/activate-studio-real-engine-v2.cjs
          node --check scripts/activate-studio-video-v1.cjs
          node --check scripts/activate-studio-key-control.cjs
          node --check public/sonara-studio-pitch-key-dsp-v6.js
          node --check cloudflare/sonara-studio-pitch-key-upload-bridge.mjs
          grep -Fq 'parseMidiBlob' src/components/studio/studioRealEngine.ts
          grep -Fq 'saveStudioAsset' src/components/studio/studioRealEngine.ts
          grep -Fq 'loadStudioAsset' src/components/studio/studioRealEngine.ts
          grep -Fq 'sonara-studio-pitch-key-dsp-v6.js?v=6' index.html
          grep -Fq 'sonara-studio-video-v1' index.html
          grep -Fq 'sonara-studio-real-engine-v2' index.html
          grep -Fq '__sonaraStudioPitchKeyDspV6' public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq 'type="number"' public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq "controlMarkup('Pitch brano'" public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq "controlMarkup('Pitch voce'" public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq "controlMarkup('Formanti / timbro'" public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq 'encodeWav' public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq 'new Worker' public/sonara-studio-pitch-key-dsp-v6.js
          grep -Fq 'SONARA_PITCH_KEY_LOCAL_DSP_ONLY' cloudflare/sonara-studio-pitch-key-upload-bridge.mjs
          if grep -Fq "url.pathname = '/api/studio/repair'" cloudflare/sonara-studio-pitch-key-upload-bridge.mjs; then echo 'FAIL generative repair forwarding still present' >&2; exit 1; fi
          if grep -Fq 'sonara-studio-pitch-key-safe-v5.js?v=5' index.html; then echo 'FAIL legacy Pitch Key V5 still loaded' >&2; exit 1; fi

      - name: Build production app with real Studio engine
        run: npm run build

      - name: Guard transformed Studio bundle
        shell: bash
        run: |
          set -euo pipefail
          check() {
            label="$1"
            pattern="$2"
            file="$3"
            if grep -Fq "$pattern" "$file"; then
              echo "PASS ${label}"
            else
              echo "FAIL ${label}: '${pattern}' not found in ${file}" >&2
              exit 1
            fi
          }
          check midi-note-data 'midiNotes' src/components/studio/SonaraStudio.tsx
          check midi-parser-wiring 'parseMidiFile' src/components/studio/SonaraStudio.tsx
          check midi-scheduler 'scheduleMidiAt' src/components/studio/SonaraStudio.tsx
          check live-eq 'graph.low.gain.value' src/components/studio/SonaraStudio.tsx
          check live-compressor 'graph.compressor.threshold.value' src/components/studio/SonaraStudio.tsx
          check live-reverb 'graph.wet.gain.value' src/components/studio/SonaraStudio.tsx
          check live-automation 'automatedVolume' src/components/studio/SonaraStudio.tsx
          check persistent-project 'sonara.studio.project.v6' src/components/studio/SonaraStudio.tsx
          check restore-assets 'loadStudioAsset' src/components/studio/SonaraStudio.tsx
          check persist-assets 'saveStudioAsset' src/components/studio/SonaraStudio.tsx
          check video-state 'SONARA_STUDIO_VIDEO_V1' src/components/studio/SonaraStudio.tsx
          check video-import 'importVideo' src/components/studio/SonaraStudio.tsx
          check video-preview 'data-sonara-video-sync="true"' src/components/studio/SonaraStudio.tsx
          check video-persistence 'sonara.studio.video.v1' src/components/studio/SonaraStudio.tsx
          check video-nav 'SONARA_STUDIO_VIDEO_NAV_V1' src/components/studio/StudioSectionControl.tsx
          check video-trigger "triggerImport('video')" src/components/studio/StudioSectionControl.tsx
          check key-control-marker 'SONARA_STUDIO_KEY_CONTROL_V1' src/components/studio/StudioSectionControl.tsx
          check key-storage 'STUDIO_KEY_STORAGE' src/components/studio/StudioSectionControl.tsx
          check key-wiring 'keySignature={keySignature}' src/components/studio/StudioSectionControl.tsx
          check dist-real-engine 'sonara-studio-real-engine-v2' dist/index.html
          check dist-video-engine 'sonara-studio-video-v1' dist/index.html
          check dist-pitch-script 'sonara-studio-pitch-key-dsp-v6.js?v=6' dist/index.html
          if [[ -f dist/sonara-studio-pitch-key-dsp-v6.js ]]; then echo 'PASS pitch-dsp-v6-file'; else echo 'FAIL pitch-dsp-v6-file' >&2; exit 1; fi
          check pitch-dsp-v6-marker '__sonaraStudioPitchKeyDspV6' dist/sonara-studio-pitch-key-dsp-v6.js
          check pitch-dsp-worker 'new Worker' dist/sonara-studio-pitch-key-dsp-v6.js
          check pitch-wav-encoder 'encodeWav' dist/sonara-studio-pitch-key-dsp-v6.js
          check pitch-number-inputs 'type="number"' dist/sonara-studio-pitch-key-dsp-v6.js
          check pitch-original-file-label 'FILE ORIGINALE' dist/sonara-studio-pitch-key-dsp-v6.js
          if grep -Fq 'sonara-studio-pitch-key-safe-v5.js?v=5' dist/index.html; then echo 'FAIL legacy Pitch Key V5 in dist' >&2; exit 1; fi
          echo "Studio Real Engine + local DSP-only Pitch & Key V6 verified."

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy Studio Real Engine and assets
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Studio DSP Pitch Key V6 publicly
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?studio-real=${GITHUB_SHA}-${attempt}" || true)"
            script="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/sonara-studio-pitch-key-dsp-v6.js?v=6&verify=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${page}" | grep -Fq 'sonara-studio-real-engine-v2' \
              && printf '%s' "${page}" | grep -Fq 'sonara-studio-video-v1' \
              && printf '%s' "${page}" | grep -Fq 'sonara-studio-pitch-key-dsp-v6.js?v=6' \
              && ! printf '%s' "${page}" | grep -Fq 'sonara-studio-pitch-key-safe-v5.js?v=5' \
              && printf '%s' "${script}" | grep -Fq '__sonaraStudioPitchKeyDspV6' \
              && printf '%s' "${script}" | grep -Fq 'type="number"' \
              && printf '%s' "${script}" | grep -Fq 'encodeWav' \
              && printf '%s' "${script}" | grep -Fq 'new Worker'; then
              echo "SONARA Studio local DSP-only Pitch & Key V6 is live."
              exit 0
            fi
            echo "Waiting for Studio V6 propagation (${attempt}/30)."
            sleep 4
          done
          echo "Studio V6 public verification failed." >&2
          exit 1
