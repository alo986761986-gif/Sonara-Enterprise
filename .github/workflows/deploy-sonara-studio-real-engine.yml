name: Deploy SONARA Studio Real Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/studio/SonaraStudio.tsx"
      - "src/components/studio/StudioSectionControl.tsx"
      - "src/components/studio/SonaraSessions2Timeline.tsx"
      - "src/components/studio/studioRealEngine.ts"
      - "scripts/activate-studio-real-engine-v2.cjs"
      - "scripts/activate-studio-key-control.cjs"
      - "scripts/activate-studio-sessions-native.cjs"
      - "scripts/build-dispatch.cjs"
      - "public/sonara-studio-pitch-key-v2.js"
      - "cloudflare/sonara-studio-key-pitch-guard.mjs"
      - "cloudflare/sonara-studio-native-pitch-bridge.mjs"
      - "wrangler.jsonc"
      - "index.html"
      - ".github/workflows/deploy-sonara-studio-real-engine.yml"

permissions:
  contents: read

concurrency:
  group: sonara-studio-real-engine-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build deploy and verify Studio Real Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validate Studio real engine source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/activate-studio-real-engine-v2.cjs
          node --check scripts/activate-studio-key-control.cjs
          node --check public/sonara-studio-pitch-key-v2.js
          grep -q 'parseMidiBlob' src/components/studio/studioRealEngine.ts
          grep -q 'saveStudioAsset' src/components/studio/studioRealEngine.ts
          grep -q 'loadStudioAsset' src/components/studio/studioRealEngine.ts
          grep -q 'sonara-studio-pitch-key-v2.js?v=2' index.html
          grep -q 'sonara-studio-real-engine-v2' index.html

      - name: Build production app with real Studio engine
        run: npm run build

      - name: Guard transformed Studio bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SONARA_STUDIO_REAL_ENGINE_V2' src/components/studio/SonaraStudio.tsx
          grep -q 'midiNotes' src/components/studio/SonaraStudio.tsx
          grep -q 'parseMidiFile' src/components/studio/SonaraStudio.tsx
          grep -q 'scheduleMidiAt' src/components/studio/SonaraStudio.tsx
          grep -q 'graph.low.gain.value = track.low' src/components/studio/SonaraStudio.tsx
          grep -q 'graph.compressor.threshold.value' src/components/studio/SonaraStudio.tsx
          grep -q 'graph.wet.gain.value' src/components/studio/SonaraStudio.tsx
          grep -q 'automatedVolume' src/components/studio/SonaraStudio.tsx
          grep -q 'sonara.studio.project.v6' src/components/studio/SonaraStudio.tsx
          grep -q 'loadStudioAsset' src/components/studio/SonaraStudio.tsx
          grep -q 'saveStudioAsset' src/components/studio/SonaraStudio.tsx
          grep -q 'SONARA_STUDIO_KEY_CONTROL_V1' src/components/studio/StudioSectionControl.tsx
          grep -q 'STUDIO_KEY_STORAGE' src/components/studio/StudioSectionControl.tsx
          grep -q 'keySignature={keySignature}' src/components/studio/StudioSectionControl.tsx
          grep -q 'sonara-studio-real-engine-v2' dist/index.html
          grep -q 'sonara-studio-pitch-key-v2.js?v=2' dist/index.html
          test -f dist/sonara-studio-pitch-key-v2.js
          grep -q '__sonaraStudioPitchKeyStaticV2' dist/sonara-studio-pitch-key-v2.js
          echo "Studio Real Engine functional code verified in transformed production source."

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy Studio Real Engine and assets
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Studio Real Engine publicly
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?studio-real=${GITHUB_SHA}-${attempt}" || true)"
            script="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/sonara-studio-pitch-key-v2.js?v=2&verify=${GITHUB_SHA}-${attempt}" || true)"
            capabilities="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/studio/pitch-key/capabilities?verify=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${page}" | grep -q 'sonara-studio-real-engine-v2' \
              && printf '%s' "${page}" | grep -q 'sonara-studio-pitch-key-v2.js?v=2' \
              && printf '%s' "${page}" | grep -q 'sonara-studio-v2.0-production' \
              && printf '%s' "${script}" | grep -q '__sonaraStudioPitchKeyStaticV2' \
              && printf '%s' "${capabilities}" | grep -q 'sonara-studio-key-pitch-1'; then
              echo "SONARA Studio Real Engine is live: real bundle, visible Pitch & Key UI and server API verified."
              exit 0
            fi
            echo "Waiting for Studio Real Engine propagation (${attempt}/30)."
            sleep 4
          done
          echo "Studio Real Engine public verification failed." >&2
          exit 1
