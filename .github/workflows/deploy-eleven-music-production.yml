name: Deploy SONARA Eleven Music Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/eleven-music-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-eleven-music-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Eleven Music primary edge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate Eleven Music primary routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-yue-primary-edge.mjs' wrangler.jsonc
          grep -q 'sonara-eleven-music-v2-primary' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'ELEVEN_JOB_PATH' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'api/eleven-music/job' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'SONARA_MUSIC_PROVIDER' 'api/billing/[...path].ts'
          grep -q 'eleven_music' 'api/billing/[...path].ts'
          node --check cloudflare/sonara-yue-primary-edge.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public Eleven Music primary edge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?eleven=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${headers}" | grep -qi 'x-sonara-music-primary: sonara-eleven-music-v2-primary'; then
              echo "SONARA Eleven Music v2 primary edge verified."
              exit 0
            fi
            echo "Eleven Music edge propagation pending (${attempt}/20)."
            sleep 4
          done
          echo "Eleven Music primary edge verification failed." >&2
          exit 1
