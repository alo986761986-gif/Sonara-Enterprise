name: SONARA Studio Zero503 Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sonara-studio-zero503-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: node --test cloudflare/sonara-quality-director-v2.test.mjs
      - run: node --test cloudflare/sonara-studio-v2-contract.test.mjs
      - run: |
          node --check cloudflare/sonara-studio-ai-router.mjs
          node --check scripts/sonara-real-music-e2e.mjs
          grep -q "state.operation === 'stems' ? \[\]" cloudflare/sonara-studio-ai-router.mjs
          grep -q 'Worker exceeded resources during polling' scripts/sonara-real-music-e2e.mjs
      - run: npm run build
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
            test -n "${account_id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"
          fi
      - name: Deploy production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Verify public Studio
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status_json="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/studio/release-status?zero503=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${status_json}" | grep -q 'sonara-studio-v2.0-production' && printf '%s' "${status_json}" | grep -q '"maxStems":12'; then
              echo "Studio zero-503 build is live."
              exit 0
            fi
            sleep 4
          done
          exit 1
