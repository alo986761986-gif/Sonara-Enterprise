name: Check Modal Connectivity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/modal-connectivity-check-trigger"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cloudflare to Modal connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Modal model catalog through production Worker
        shell: bash
        run: |
          http_status="$(curl -sS --max-time 60 \
            -w '%{http_code}' \
            https://api.sonaraenterprise.com/api/diagnostics/modal-connectivity \
            -o /tmp/modal-diagnostic.json || true)"
          echo "Diagnostic HTTP status: ${http_status}"
          cat /tmp/modal-diagnostic.json || true
          echo
          HTTP_STATUS="${http_status}" node - <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.HTTP_STATUS || 0);
          const raw = fs.existsSync('/tmp/modal-diagnostic.json') ? fs.readFileSync('/tmp/modal-diagnostic.json', 'utf8') : '';
          let result = {};
          try { result = raw ? JSON.parse(raw) : {}; } catch {
            console.error(`Diagnostic returned invalid JSON (HTTP ${status}).`);
            process.exit(1);
          }
          console.log(JSON.stringify(result, null, 2));
          if (status !== 200 || !result.ok) {
            console.error(`Modal connectivity failed: ${result.error || `HTTP ${status}`}`);
            process.exit(1);
          }
          const models = Array.isArray(result.models) ? result.models : [];
          if (!models.includes('acestep-v15-xl-turbo')) {
            console.error(`XL-Turbo missing. Available models: ${models.join(', ')}`);
            process.exit(1);
          }
          console.log('Cloudflare -> Modal -> ACE-Step XL-Turbo connectivity verified.');
          NODE
