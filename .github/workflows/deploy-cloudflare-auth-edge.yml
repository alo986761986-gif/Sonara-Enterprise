name: Deploy SONARA Auth Edge Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-auth-edge-trigger'

permissions:
  contents: read

concurrency:
  group: sonara-cloudflare-auth-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate native SONARA auth
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SONARA_AUTH' wrangler.jsonc
          grep -q 'SonaraAuthStore' wrangler.jsonc
          grep -q '"directory": "./dist"' wrangler.jsonc
          grep -q 'sonara-native-auth-v1' cloudflare/sonara-ab-player-visibility-edge.mjs
          grep -q 'handleSonaraNativeAuth' cloudflare/sonara-ab-player-visibility-edge.mjs
          grep -q 'loginSonara' src/components/auth/BootAuth.tsx
          grep -q 'registerSonara' src/components/auth/BootAuth.tsx
          node --check cloudflare/sonara-native-auth.mjs
          node --check cloudflare/sonara-ab-player-visibility-edge.mjs

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build SONARA frontend
        run: npx vite build

      - name: Validate Cloudflare frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          grep -R -q '/api/sonara-auth/login' dist/assets
          grep -R -q '/api/sonara-auth/register' dist/assets
          printf 'server.cjs\n' > dist/.assetsignore

      - name: Deploy SONARA Worker and frontend assets
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify native auth after propagation
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..20}; do
            http_code="$(curl -sS --max-time 20 -o /tmp/sonara-auth-health.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/sonara-auth/health?propagation=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "${http_code}" == "200" ]] && node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/sonara-auth-health.json','utf8'));
          if (data.ok !== true || data.service !== 'sonara-native-auth-v1') process.exit(1);
          console.log('SONARA_NATIVE_AUTH_HEALTH=ok');
          NODE
            then
              ready=1
              break
            fi
            echo "Native auth propagation pending (${attempt}/20), HTTP=${http_code}."
            sleep 4
          done
          test "${ready}" = "1"

      - name: Verify frontend is native-auth build
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..20}; do
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://sonaraenterprise.com/?native-auth=${GITHUB_SHA}-${attempt}" \
              -o /tmp/sonara-index.html || true
            asset="$(grep -oE 'src="[^"]*/assets/index-[^"]+\.js"' /tmp/sonara-index.html 2>/dev/null | head -n1 | sed -E 's/^src="|"$//g' || true)"
            if [[ -n "${asset}" ]]; then
              if [[ "${asset}" == http* ]]; then asset_url="${asset}"; else asset_url="https://sonaraenterprise.com${asset}"; fi
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
                "${asset_url}?native-auth=${GITHUB_SHA}-${attempt}" \
                -o /tmp/sonara-native-bundle.js; then
                if grep -q '/api/sonara-auth/login' /tmp/sonara-native-bundle.js \
                  && grep -q '/api/sonara-auth/register' /tmp/sonara-native-bundle.js \
                  && grep -q 'SONARA Email Auth Ready' /tmp/sonara-native-bundle.js; then
                  echo 'SONARA_NATIVE_AUTH_FRONTEND=ok'
                  ready=1
                  break
                fi
              fi
            fi
            echo "Frontend native-auth propagation pending (${attempt}/20)."
            sleep 4
          done
          test "${ready}" = "1"

      - name: Verify real registration login and session
        shell: bash
        run: |
          set -euo pipefail
          TEST_EMAIL='sonara-native-auth-probe@example.invalid'
          TEST_PASSWORD='Sonara-Native-Auth-Probe-2026!'
          rm -f /tmp/sonara-cookie.txt

          register_code="$(curl -sS --max-time 30 -o /tmp/sonara-register.json -w '%{http_code}' \
            -c /tmp/sonara-cookie.txt -b /tmp/sonara-cookie.txt \
            -H 'Content-Type: application/json' -H 'Origin: https://sonaraenterprise.com' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"password\":\"${TEST_PASSWORD}\"}" \
            'https://sonaraenterprise.com/api/sonara-auth/register')"

          if [[ "${register_code}" != "201" && "${register_code}" != "409" ]]; then
            cat /tmp/sonara-register.json
            exit 1
          fi

          rm -f /tmp/sonara-cookie.txt
          curl -fsS --max-time 30 \
            -c /tmp/sonara-cookie.txt -b /tmp/sonara-cookie.txt \
            -H 'Content-Type: application/json' -H 'Origin: https://sonaraenterprise.com' \
            --data "{\"email\":\"${TEST_EMAIL}\",\"password\":\"${TEST_PASSWORD}\"}" \
            'https://sonaraenterprise.com/api/sonara-auth/login' > /tmp/sonara-login.json

          curl -fsS --max-time 20 \
            -c /tmp/sonara-cookie.txt -b /tmp/sonara-cookie.txt \
            'https://sonaraenterprise.com/api/sonara-auth/session' > /tmp/sonara-session.json

          node - <<'NODE'
          const fs = require('fs');
          const login = JSON.parse(fs.readFileSync('/tmp/sonara-login.json','utf8'));
          const session = JSON.parse(fs.readFileSync('/tmp/sonara-session.json','utf8'));
          if (login.ok !== true || !login.user?.uid) process.exit(1);
          if (session.ok !== true || session.authenticated !== true || !session.user?.uid) process.exit(1);
          console.log('SONARA_NATIVE_AUTH_REGISTER_LOGIN_SESSION=ok');
          NODE

          curl -fsS --max-time 20 \
            -c /tmp/sonara-cookie.txt -b /tmp/sonara-cookie.txt \
            -H 'Content-Type: application/json' -H 'Origin: https://sonaraenterprise.com' \
            --data '{}' \
            'https://sonaraenterprise.com/api/sonara-auth/logout' > /tmp/sonara-logout.json

      - name: Verify unauthenticated session endpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sonara-cookie.txt
          curl -fsS --max-time 20 -c /tmp/sonara-cookie.txt -b /tmp/sonara-cookie.txt \
            'https://sonaraenterprise.com/api/sonara-auth/session' > /tmp/sonara-session.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/sonara-session.json','utf8'));
          if (data.ok !== true || data.authenticated !== false) process.exit(1);
          console.log('SONARA_NATIVE_AUTH_SESSION=ok');
          NODE
