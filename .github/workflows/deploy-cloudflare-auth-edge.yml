name: Deploy SONARA Auth Edge Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-auth-edge-trigger'

permissions:
  contents: read

concurrency:
  group: sonara-cloudflare-auth-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate auth recovery edge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-ab-player-visibility-edge.mjs' wrangler.jsonc
          grep -q 'sonara-auth-email-password-only-v3' cloudflare/sonara-ab-player-visibility-edge.mjs
          grep -q 'sonara-firebase-public-config-edge-v1' cloudflare/sonara-firebase-public-config-edge.mjs
          grep -q 'handleFirebasePublicConfigEdge' cloudflare/sonara-ab-player-visibility-edge.mjs
          node --check cloudflare/sonara-firebase-public-config-edge.mjs
          node --check cloudflare/sonara-ab-player-visibility-edge.mjs

      - name: Deploy current SONARA Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Firebase public web config after propagation
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..15}; do
            http_code="$(curl -sS --max-time 30 -o /tmp/firebase-public-status.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/__sonara_internal/firebase-public-config-status?propagation=${GITHUB_SHA}-${attempt}" || true)"
            if node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/firebase-public-status.json', 'utf8');
          let data;
          try { data = JSON.parse(raw); } catch { process.exit(2); }
          const attempts = Array.isArray(data.attempts) ? data.attempts.map(x => `${x.host}:${x.http}:${x.reason}`).join('|') : 'none';
          console.log(`SONARA_FIREBASE_PUBLIC_STATUS=${data.ok === true ? 'ok' : 'failed'} source=${data.source || 'none'} probe=${data.probe || 'none'} attempts=${attempts}`);
          if (data.ok !== true || data.probe !== 'firebase_auth_accepted') process.exit(1);
          NODE
            then
              test "${http_code}" = "200"
              ready=1
              break
            fi
            echo "Firebase public config edge not ready (${attempt}/15), HTTP=${http_code}."
            sleep 4
          done
          test "${ready}" = "1"

      - name: Verify public auth edge and bundle rewrite
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            html_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?auth-edge=${GITHUB_SHA}-${attempt}" || true)"
            html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?auth-edge=${GITHUB_SHA}-${attempt}" || true)"
            asset="$(printf '%s' "${html}" | grep -oE 'src="[^"]+/assets/index-[^"]+\.js"' | head -n1 | sed -E 's/^src="|"$//g' || true)"
            if [[ -n "${asset}" ]]; then
              if [[ "${asset}" == http* ]]; then asset_url="${asset}"; else asset_url="https://sonaraenterprise.com${asset}"; fi
              asset_headers="$(curl -sS -D - -o /dev/null --max-time 45 -H 'Cache-Control: no-cache' "${asset_url}?auth-edge=${GITHUB_SHA}-${attempt}" || true)"
            else
              asset_headers=''
            fi
            if printf '%s' "${html_headers}" | grep -qi 'x-sonara-auth-edge: sonara-auth-email-password-only-v3' \
              && printf '%s' "${asset_headers}" | grep -qi 'x-sonara-firebase-public-config: sonara-firebase-public-config-edge-v1' \
              && printf '%s' "${asset_headers}" | grep -qi 'x-sonara-firebase-public-status: firebase_auth_accepted'; then
              echo 'SONARA email/password Firebase recovery is live on public domain.'
              exit 0
            fi
            echo "Bundle rewrite propagation pending (${attempt}/15)."
            sleep 4
          done
          echo 'SONARA Firebase recovery headers not observed on public domain.' >&2
          exit 1
