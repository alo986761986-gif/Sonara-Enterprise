name: SONARA Add Hip-Hop Rap Freestyle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sonara-add-hiphop-freestyle-0905.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Add Freestyle genre and subgenres
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          taxonomy = Path('src/data/worldMusicGenres.ts')
          text = taxonomy.read_text(encoding='utf-8')
          marker = "{ name: 'Freestyle', subgenres: ['Classic Hip-Hop Freestyle'"
          if marker not in text:
              old = "      { name: 'Global Rap', subgenres: ['Grime', 'Afro Trap', 'French Rap', 'Italian Rap', 'German Rap', 'Spanish Rap', 'Korean Hip-Hop', 'Japanese Hip-Hop', 'Arabic Hip-Hop', 'Brazilian Rap'] }\n"
              new = "      { name: 'Global Rap', subgenres: ['Grime', 'Afro Trap', 'French Rap', 'Italian Rap', 'German Rap', 'Spanish Rap', 'Korean Hip-Hop', 'Japanese Hip-Hop', 'Arabic Hip-Hop', 'Brazilian Rap'] },\n      { name: 'Freestyle', subgenres: ['Classic Hip-Hop Freestyle', 'Off-the-Dome Freestyle', 'Battle Freestyle', 'Cypher Freestyle', 'Boom Bap Freestyle', 'Trap Freestyle', 'Drill Freestyle', 'Melodic Freestyle', 'Conscious Freestyle', 'Storytelling Freestyle', 'Double-Time Freestyle', 'Acapella Freestyle'] }\n"
              if old not in text:
                  raise SystemExit('HIP_HOP_GLOBAL_RAP_ANCHOR_NOT_FOUND')
              taxonomy.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('FREESTYLE_TAXONOMY=ADDED')
          else:
              print('FREESTYLE_TAXONOMY=ALREADY_PRESENT')

          test = Path('src/musicStyleIntelligence.professional.test.ts')
          test_text = test.read_text(encoding='utf-8')
          old_comment = "// normalization intentionally deduplicates that single legacy duplicate, leaving 719\n// real selectable taxonomy paths without removing any unique musical style.\nassert.equal(subgenreCount, 719, 'all 719 exact selectable musical styles must remain available after Jazz Fusion deduplication');"
          new_comment = "// normalization intentionally deduplicates that single legacy duplicate, leaving 719\n// legacy selectable taxonomy paths. Hip-Hop / Rap Freestyle adds 12 authentic\n// selectable freestyle paths, for a current canonical total of 731.\nassert.equal(subgenreCount, 731, 'all 731 exact selectable musical styles must remain available, including 12 Hip-Hop Rap Freestyle paths');"
          if old_comment in test_text:
              test.write_text(test_text.replace(old_comment, new_comment, 1), encoding='utf-8')
              print('TAXONOMY_COUNT_TEST=UPDATED_731')
          elif "assert.equal(subgenreCount, 731" in test_text:
              print('TAXONOMY_COUNT_TEST=ALREADY_731')
          else:
              raise SystemExit('TAXONOMY_COUNT_ASSERTION_NOT_FOUND')

          verify = taxonomy.read_text(encoding='utf-8')
          required = [
              "family: 'Hip-Hop / Rap'",
              "name: 'Freestyle'",
              "'Classic Hip-Hop Freestyle'",
              "'Off-the-Dome Freestyle'",
              "'Battle Freestyle'",
              "'Cypher Freestyle'",
              "'Boom Bap Freestyle'",
              "'Trap Freestyle'",
              "'Drill Freestyle'",
              "'Melodic Freestyle'",
              "'Conscious Freestyle'",
              "'Storytelling Freestyle'",
              "'Double-Time Freestyle'",
              "'Acapella Freestyle'",
          ]
          missing = [item for item in required if item not in verify]
          if missing:
              raise SystemExit('FREESTYLE_VERIFY_MISSING=' + ','.join(missing))
          print('FREESTYLE_SUBGENRES=12')
          print('FREESTYLE_VERIFY=OK')
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Commit taxonomy upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sonara-add-hiphop-freestyle-0905.yml
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/worldMusicGenres.ts src/musicStyleIntelligence.professional.test.ts .github/workflows/sonara-add-hiphop-freestyle-0905.yml
          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT"
            exit 0
          fi
          git commit -m "feat: add Freestyle genre and 12 subgenres to Hip-Hop Rap"
          git push origin HEAD:main
