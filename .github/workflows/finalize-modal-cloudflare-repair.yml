name: Finalize Modal Cloudflare Repair - v17 Safe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/finalize-modal-cloudflare-trigger"

permissions:
  contents: read

jobs:
  repair:
    name: Refresh Modal auth without replacing SONARA v17
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      MODAL_ENDPOINT_URL: https://gptalo986--sonara-acestep-serve-acestep.modal.run

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Normalize Modal API credentials safely
        shell: bash
        run: |
          python - <<'PY' > /tmp/modal-api-pair
          import os, re
          values = [os.environ.get('RAW_MODAL_TOKEN_ID',''), os.environ.get('RAW_MODAL_TOKEN_SECRET','')]
          def extract(prefix):
              pattern = re.compile(re.escape(prefix) + r'[A-Za-z0-9_-]+')
              for value in values:
                  match = pattern.search((value or '').strip())
                  if match:
                      return match.group(0)
              return ''
          token_id = extract('ak-')
          token_secret = extract('as-')
          if not token_id or not token_secret:
              raise SystemExit('Modal API token pair not found.')
          print(token_id)
          print(token_secret)
          PY
          mapfile -t pair < /tmp/modal-api-pair
          echo "::add-mask::${pair[0]}"
          echo "::add-mask::${pair[1]}"
          echo "MODAL_TOKEN_ID=${pair[0]}" >> "${GITHUB_ENV}"
          echo "MODAL_TOKEN_SECRET=${pair[1]}" >> "${GITHUB_ENV}"
          rm -f /tmp/modal-api-pair

      - name: Resolve Cloudflare account ID
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then exit 1; fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const body = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(body.result) ? body.result.find(x => x?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.4,<2'

      - name: Create fresh Modal proxy token
        shell: bash
        run: |
          modal token info >/dev/null
          modal workspace proxy-tokens create --json > /tmp/modal-proxy.json
          node - <<'NODE' > /tmp/modal-proxy-pair
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/modal-proxy.json', 'utf8'));
          const strings = [];
          const visit = value => {
            if (typeof value === 'string') strings.push(value.trim());
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(payload);
          const id = strings.find(v => /^wk-[A-Za-z0-9_-]+$/.test(v));
          const secret = strings.find(v => /^ws-[A-Za-z0-9_-]+$/.test(v));
          if (!id || !secret) process.exit(2);
          process.stdout.write(`${id}\n${secret}\n`);
          NODE
          mapfile -t proxy < /tmp/modal-proxy-pair
          echo "::add-mask::${proxy[0]}"
          echo "::add-mask::${proxy[1]}"
          echo "FRESH_MODAL_PROXY_ID=${proxy[0]}" >> "${GITHUB_ENV}"
          echo "FRESH_MODAL_PROXY_SECRET=${proxy[1]}" >> "${GITHUB_ENV}"
          modal workspace proxy-tokens allow "${proxy[0]}" main >/dev/null 2>&1 || true
          rm -f /tmp/modal-proxy.json /tmp/modal-proxy-pair

      - name: Validate fresh proxy token directly against Modal
        shell: bash
        run: |
          status="$(curl -sS --location --max-time 900 -w '%{http_code}' -H "Modal-Key: ${FRESH_MODAL_PROXY_ID}" -H "Modal-Secret: ${FRESH_MODAL_PROXY_SECRET}" -H "Accept: application/json" -o /tmp/modal-models.json "${MODAL_ENDPOINT_URL}/v1/models" || true)"
          test "${status}" = "200"
          node - <<'NODE'
          const fs = require('fs');
          JSON.parse(fs.readFileSync('/tmp/modal-models.json', 'utf8'));
          NODE
          rm -f /tmp/modal-models.json

      - name: Synchronize Modal endpoint and proxy auth to Cloudflare
        shell: bash
        run: |
          printf '%s' "${MODAL_ENDPOINT_URL}" | npx --yes wrangler@latest secret put ACESTEP_API_URL --config wrangler.jsonc >/dev/null
          printf '%s' "${FRESH_MODAL_PROXY_ID}" | npx --yes wrangler@latest secret put MODAL_PROXY_KEY --config wrangler.jsonc >/dev/null
          printf '%s' "${FRESH_MODAL_PROXY_SECRET}" | npx --yes wrangler@latest secret put MODAL_PROXY_SECRET --config wrangler.jsonc >/dev/null

      - name: Guard against legacy worker deployment
        shell: bash
        run: |
          if grep -q "wrangler@latest deploy" .github/workflows/finalize-modal-cloudflare-repair.yml; then
            echo "Legacy Worker deployment is forbidden in Modal auth repair." >&2
            exit 1
          fi
          grep -q 'cloudflare/sonara-web-v15-router.mjs' wrangler.jsonc
          echo "Modal repair is credential-only; production audio code stays on authoritative v17."

      - name: Verify authoritative v17 health remains active
        shell: bash
        run: |
          response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?finalize-guard=${GITHUB_SHA}")"
          HEALTH="${response}" node - <<'NODE'
          const h = JSON.parse(process.env.HEALTH || '{}');
          const expected = {
            universalGenreLock: 'v15-authoritative-full-prompt',
            authoritativePromptLock: 'v15-authoritative-full-prompt',
            selectedSubgenreAuthoritative: true,
            kaggleProfile: 'kaggle-t4x2-extreme-fidelity-v16',
            kaggleInferenceSteps: 12,
            kaggleGuidanceScale: 1.15,
            kaggleThinking: true,
            kaggleInferMethod: 'adaptive-ode-sde',
            resultDecoder: 'recursive-v17',
            progressHeartbeat: true
          };
          for (const [key, value] of Object.entries(expected)) {
            if (h[key] !== value) {
              console.error(`v17 guard failed: ${key}=${JSON.stringify(h[key])}`);
              process.exit(1);
            }
          }
          console.log('Authoritative SONARA v17 preserved.');
          NODE
