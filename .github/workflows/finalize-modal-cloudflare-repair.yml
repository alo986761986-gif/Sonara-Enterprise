name: Finalize Modal Cloudflare Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/finalize-modal-cloudflare-trigger"

permissions:
  contents: read

jobs:
  repair:
    name: Refresh Modal proxy auth and deploy Sonara v9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      MODAL_ENDPOINT_URL: https://gptalo986--sonara-acestep-serve-acestep.modal.run

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Normalize Modal API credentials safely
        shell: bash
        run: |
          python - <<'PY' > /tmp/modal-api-pair
          import os, re
          values = [os.environ.get('RAW_MODAL_TOKEN_ID',''), os.environ.get('RAW_MODAL_TOKEN_SECRET','')]
          def extract(prefix):
              pattern = re.compile(re.escape(prefix) + r'[A-Za-z0-9_-]+')
              for value in values:
                  match = pattern.search((value or '').strip())
                  if match:
                      return match.group(0)
              return ''
          token_id = extract('ak-')
          token_secret = extract('as-')
          if not token_id or not token_secret:
              raise SystemExit('Modal API token pair not found.')
          print(token_id)
          print(token_secret)
          PY
          mapfile -t pair < /tmp/modal-api-pair
          echo "::add-mask::${pair[0]}"
          echo "::add-mask::${pair[1]}"
          echo "MODAL_TOKEN_ID=${pair[0]}" >> "${GITHUB_ENV}"
          echo "MODAL_TOKEN_SECRET=${pair[1]}" >> "${GITHUB_ENV}"
          rm -f /tmp/modal-api-pair
          echo "Modal API credentials ready."

      - name: Resolve Cloudflare account ID
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          try {
            const body = JSON.parse(process.env.CF_RESPONSE || '{}');
            const zone = Array.isArray(body.result) ? body.result.find(x => x?.name === 'sonaraenterprise.com') : null;
            process.stdout.write(String(zone?.account?.id || ''));
          } catch { process.stdout.write(''); }
          NODE
            )"
          fi
          if [[ -z "${account_id}" ]]; then
            echo "Unable to resolve Cloudflare account ID." >&2
            exit 1
          fi
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"
          echo "Cloudflare account ready."

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.4,<2'

      - name: Create fresh Modal proxy token
        shell: bash
        run: |
          modal token info >/dev/null
          modal workspace proxy-tokens create --json > /tmp/modal-proxy.json
          node - <<'NODE' > /tmp/modal-proxy-pair
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/modal-proxy.json', 'utf8'));
          const strings = [];
          const visit = value => {
            if (typeof value === 'string') strings.push(value.trim());
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(payload);
          const id = strings.find(v => /^wk-[A-Za-z0-9_-]+$/.test(v));
          const secret = strings.find(v => /^ws-[A-Za-z0-9_-]+$/.test(v));
          if (!id || !secret) process.exit(2);
          process.stdout.write(`${id}\n${secret}\n`);
          NODE
          mapfile -t proxy < /tmp/modal-proxy-pair
          echo "::add-mask::${proxy[0]}"
          echo "::add-mask::${proxy[1]}"
          echo "FRESH_MODAL_PROXY_ID=${proxy[0]}" >> "${GITHUB_ENV}"
          echo "FRESH_MODAL_PROXY_SECRET=${proxy[1]}" >> "${GITHUB_ENV}"
          modal workspace proxy-tokens allow "${proxy[0]}" main >/dev/null 2>&1 || true
          rm -f /tmp/modal-proxy.json /tmp/modal-proxy-pair
          echo "Fresh Modal proxy token created."

      - name: Validate fresh proxy token directly against Modal
        shell: bash
        run: |
          status="$(curl -sS --max-time 240 -w '%{http_code}' \
            -H "Modal-Key: ${FRESH_MODAL_PROXY_ID}" \
            -H "Modal-Secret: ${FRESH_MODAL_PROXY_SECRET}" \
            -H "Accept: application/json" \
            -o /tmp/modal-models.json \
            "${MODAL_ENDPOINT_URL}/v1/models" || true)"
          echo "Direct Modal readiness HTTP: ${status}"
          if [[ "${status}" != "200" ]]; then
            echo "Fresh Modal proxy authentication/readiness failed." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/modal-models.json', 'utf8');
          JSON.parse(raw);
          console.log(`Modal readiness returned valid JSON (${raw.length} bytes).`);
          NODE
          rm -f /tmp/modal-models.json

      - name: Synchronize new Modal endpoint and proxy auth to Cloudflare
        shell: bash
        run: |
          printf '%s' "${MODAL_ENDPOINT_URL}" | npx --yes wrangler@latest secret put ACESTEP_API_URL --config wrangler.jsonc >/dev/null
          printf '%s' "${FRESH_MODAL_PROXY_ID}" | npx --yes wrangler@latest secret put MODAL_PROXY_KEY --config wrangler.jsonc >/dev/null
          printf '%s' "${FRESH_MODAL_PROXY_SECRET}" | npx --yes wrangler@latest secret put MODAL_PROXY_SECRET --config wrangler.jsonc >/dev/null
          echo "Cloudflare Modal endpoint and proxy credentials updated."

      - name: Validate current Sonara production source
        shell: bash
        run: |
          grep -q 'cloudflare/sonara-web-dj-proxy.mjs' wrangler.jsonc
          grep -q 'READINESS_TIMEOUT_MS = 180_000' cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q '/api/engine/ready' cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q 'ACESTEP_API_URL' cloudflare/sonara-engine-v9-dual-fast.mjs
          echo "Current Sonara production source verified."

      - name: Deploy Sonara production Worker to Cloudflare
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Cloudflare to Modal production readiness
        shell: bash
        run: |
          status="$(curl -sS --max-time 210 -w '%{http_code}' \
            -o /tmp/sonara-engine-ready.json \
            https://api.sonaraenterprise.com/api/engine/ready || true)"
          echo "SONARA engine readiness HTTP: ${status}"
          cat /tmp/sonara-engine-ready.json || true
          echo
          STATUS="${status}" node - <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS || 0);
          const body = JSON.parse(fs.readFileSync('/tmp/sonara-engine-ready.json', 'utf8'));
          if (status !== 200 || body.ready !== true || body.model !== 'acestep-v15-xl-turbo') {
            console.error(`Production readiness failed: HTTP ${status}, ${body.error || 'not ready'}`);
            process.exit(1);
          }
          console.log('Cloudflare -> Modal -> ACE-Step production readiness verified.');
          NODE

      - name: Verify final v9 health profile
        shell: bash
        run: |
          curl -fsS --max-time 30 https://api.sonaraenterprise.com/api/health -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (h.dualFast !== true || h.dualFastProfile !== 'single-job-native-batch-v9') process.exit(1);
          if (h.dualFastReadinessTimeoutMs !== 180000 || h.dualFastSubmitTimeoutMs !== 120000) process.exit(1);
          console.log('Final Sonara v9 profile verified.');
          NODE
