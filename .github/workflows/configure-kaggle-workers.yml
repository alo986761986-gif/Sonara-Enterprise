name: Configure SONARA Kaggle Workers

on:
  push:
    branches:
      - main
    paths:
      - ".github/kaggle-workers-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-kaggle-worker-config
  cancel-in-progress: true

jobs:
  configure:
    name: Verify Kaggle endpoints and update Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load current Kaggle worker URLs
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/kaggle-workers-trigger"
          test -f "${trigger}"
          gpu0="$(sed -n 's/^GPU0=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          gpu1="$(sed -n 's/^GPU1=//p' "${trigger}" | tail -n 1 | tr -d '\r')"

          validate_url() {
            local name="$1"
            local url="$2"
            if [[ ! "${url}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]; then
              echo "Invalid ${name} URL in ${trigger}: ${url}" >&2
              exit 1
            fi
          }
          validate_url "GPU0" "${gpu0}"
          validate_url "GPU1" "${gpu1}"
          gpu0="${gpu0%/}"
          gpu1="${gpu1%/}"
          echo "KAGGLE_GPU0_URL=${gpu0}" >> "${GITHUB_ENV}"
          echo "KAGGLE_GPU1_URL=${gpu1}" >> "${GITHUB_ENV}"
          echo "GPU0 reserved for ACE-Step music; GPU1 reserved for WAN Video AI."

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find((item) => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify GPU0 ACE-Step music health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if response="$(curl -fsS --connect-timeout 10 --max-time 20 "${KAGGLE_GPU0_URL}/health" 2>/dev/null)"; then
              if printf '%s' "${response}" | grep -Eqi '"status"[[:space:]]*:[[:space:]]*"(ok|ready|healthy|online|success)"|"code"[[:space:]]*:[[:space:]]*200'; then
                echo "GPU0 ACE-Step healthy: ${KAGGLE_GPU0_URL}"
                exit 0
              fi
            fi
            echo "GPU0 music not ready (${attempt}/24)."
            sleep 5
          done
          echo "GPU0 ACE-Step endpoint is not healthy." >&2
          exit 1

      - name: Bind GPU0 to ACE-Step music immediately
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${KAGGLE_GPU0_URL}" | npx --yes wrangler@latest secret put ACESTEP_WORKER_URLS --config wrangler.jsonc
          echo "Cloudflare music binding updated independently from Video AI."

      - name: Verify SONARA production music uses GPU0
        shell: bash
        run: |
          set -euo pipefail
          expected="${KAGGLE_GPU0_URL}"
          for attempt in {1..18}; do
            if response="$(curl -fsS --max-time 30 https://api.sonaraenterprise.com/api/health 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/sonara-health.json
              if EXPECTED_KAGGLE_URL="${expected}" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/sonara-health.json', 'utf8'));
          const workers = Array.isArray(health.aceStepWorkers) ? health.aceStepWorkers : [];
          const expected = String(process.env.EXPECTED_KAGGLE_URL || '').replace(/\/$/, '');
          const matched = workers.some((item) => item?.kind === 'kaggle' && String(item?.baseUrl || '').replace(/\/$/, '') === expected);
          process.exit(matched ? 0 : 1);
          NODE
              then
                echo "Music production sees GPU0."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Music production did not report GPU0." >&2
          exit 1

      - name: Verify GPU1 WAN Video AI health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if response="$(curl -fsS --connect-timeout 10 --max-time 20 "${KAGGLE_GPU1_URL}/health" 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/wan-health.json
              if node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/wan-health.json', 'utf8'));
          const ok = String(h.status || '').toLowerCase() === 'ok' && String(h.provider || '').includes('wan');
          console.log(JSON.stringify(h));
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo "GPU1 WAN Video AI healthy: ${KAGGLE_GPU1_URL}"
                exit 0
              fi
            fi
            echo "GPU1 WAN not ready (${attempt}/36)."
            sleep 5
          done
          echo "GPU1 is not running the SONARA WAN Video worker. Music remains bound to GPU0." >&2
          exit 1

      - name: Bind GPU1 to zero-cost WAN video
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${KAGGLE_GPU1_URL}" | npx --yes wrangler@latest secret put SONARA_VIDEO_WORKER_URL --config wrangler.jsonc
          printf '%s' "true" | npx --yes wrangler@latest secret put SONARA_ZERO_COST_VIDEO --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ENABLE_GEMINI_VIDEO --config wrangler.jsonc
          echo "Cloudflare video configured: GPU1=zero-cost WAN, Gemini video disabled."

      - name: Verify zero-cost WAN edge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/edge-health?wan=${GITHUB_SHA}-${attempt}" 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/video-health.json
              if node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/video-health.json', 'utf8'));
          const ok = h.valid === true && h.provider === 'kaggle-wan21' && h.zeroCost === true && h.geminiEnabled === false && h.googleBillingRequired === false;
          console.log(JSON.stringify(h));
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo "SONARA zero-cost WAN Video AI verified."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "SONARA zero-cost WAN edge did not become healthy." >&2
          exit 1
