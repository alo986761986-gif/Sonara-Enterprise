name: Configure SONARA Kaggle Workers

on:
  push:
    branches:
      - main
    paths:
      - ".github/kaggle-workers-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-kaggle-worker-config
  cancel-in-progress: true

jobs:
  configure:
    name: Verify Kaggle endpoint and update Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load current Kaggle worker URLs
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/kaggle-workers-trigger"
          if [[ ! -f "${trigger}" ]]; then
            echo "Missing ${trigger}." >&2
            exit 1
          fi

          gpu0="$(sed -n 's/^GPU0=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          gpu1="$(sed -n 's/^GPU1=//p' "${trigger}" | tail -n 1 | tr -d '\r')"

          validate_url() {
            local name="$1"
            local url="$2"
            [[ -z "${url}" ]] && return 0
            if [[ ! "${url}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]; then
              echo "Invalid ${name} URL in ${trigger}: ${url}" >&2
              exit 1
            fi
          }

          validate_url "GPU0" "${gpu0}"
          validate_url "GPU1" "${gpu1}"

          gpu0="${gpu0%/}"
          gpu1="${gpu1%/}"

          if [[ -z "${gpu0}" ]]; then
            echo "GPU0 endpoint is required." >&2
            exit 1
          fi

          echo "KAGGLE_GPU0_URL=${gpu0}" >> "${GITHUB_ENV}"
          echo "KAGGLE_GPU1_URL=${gpu1}" >> "${GITHUB_ENV}"
          echo "Loaded current Kaggle endpoint(s) from ${trigger}."

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find((item) => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          if [[ -z "${account_id}" ]]; then
            echo "Unable to resolve Cloudflare account ID." >&2
            exit 1
          fi
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify Kaggle public health
        shell: bash
        run: |
          set -euo pipefail
          urls=("${KAGGLE_GPU0_URL}")
          if [[ -n "${KAGGLE_GPU1_URL}" ]]; then
            urls+=("${KAGGLE_GPU1_URL}")
          fi

          index=0
          for url in "${urls[@]}"; do
            name="GPU${index}"
            ready=0
            for attempt in {1..24}; do
              if response="$(curl -fsS --connect-timeout 10 --max-time 20 "${url}/health" 2>/dev/null)"; then
                echo "${name} health response: ${response}"
                if printf '%s' "${response}" | grep -Eqi '"status"[[:space:]]*:[[:space:]]*"(ok|ready|healthy|online|success)"|"code"[[:space:]]*:[[:space:]]*200'; then
                  echo "${name} healthy: ${url}"
                  ready=1
                  break
                fi
              fi
              echo "${name} not reachable yet (${attempt}/24); retrying..."
              sleep 5
            done
            if [[ "${ready}" != "1" ]]; then
              echo "${name} Kaggle endpoint did not become healthy: ${url}" >&2
              exit 1
            fi
            index=$((index + 1))
          done

      - name: Update deployed Worker Kaggle endpoints
        shell: bash
        run: |
          set -euo pipefail
          workers="${KAGGLE_GPU0_URL}"
          if [[ -n "${KAGGLE_GPU1_URL}" ]]; then
            workers="${workers},${KAGGLE_GPU1_URL}"
          fi
          printf '%s' "${workers}" | npx --yes wrangler@latest secret put ACESTEP_WORKER_URLS --config wrangler.jsonc
          echo "SONARA Kaggle worker endpoints updated: ${workers}"

      - name: Verify SONARA production sees Kaggle
        shell: bash
        run: |
          set -euo pipefail
          expected="${KAGGLE_GPU0_URL}"
          for attempt in {1..18}; do
            if response="$(curl -fsS --max-time 30 https://api.sonaraenterprise.com/api/health 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/sonara-health.json
              if EXPECTED_KAGGLE_URL="${expected}" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/sonara-health.json', 'utf8'));
          const workers = Array.isArray(health.aceStepWorkers) ? health.aceStepWorkers : [];
          const expected = String(process.env.EXPECTED_KAGGLE_URL || '').replace(/\/$/, '');
          const kaggle = workers.filter((item) => item?.kind === 'kaggle');
          const matched = kaggle.some((item) => String(item?.baseUrl || '').replace(/\/$/, '') === expected);
          console.log(JSON.stringify({
            status: health.status,
            aceStepWorkerCount: health.aceStepWorkerCount,
            aceStepWorkers: workers,
            expectedKaggleUrl: expected,
            expectedEndpointReady: matched
          }, null, 2));
          process.exit(matched ? 0 : 1);
          NODE
              then
                echo "SONARA production is using the current Kaggle endpoint."
                exit 0
              fi
            fi
            echo "Production health not updated yet (${attempt}/18)."
            sleep 5
          done
          echo "SONARA production did not report the current Kaggle endpoint." >&2
          exit 1
