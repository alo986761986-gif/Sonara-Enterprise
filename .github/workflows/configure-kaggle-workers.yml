name: Configure SONARA Kaggle Workers

on:
  push:
    branches: [main]
    paths:
      - ".github/kaggle-workers-trigger"
      - ".github/workflows/configure-kaggle-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-kaggle-worker-config
  cancel-in-progress: true

jobs:
  configure:
    name: Verify dual T4 music endpoints and update Cloudflare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load dual music worker URLs
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/kaggle-workers-trigger"
          gpu0="$(sed -n 's/^GPU0=//p' "$trigger" | tail -n 1 | tr -d '\r')"
          gpu1="$(sed -n 's/^GPU1=//p' "$trigger" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "$trigger" | tail -n 1 | tr -d '\r')"
          action="$(sed -n 's/^ACTION=//p' "$trigger" | tail -n 1 | tr -d '\r')"
          [[ "$gpu0" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]
          [[ "$gpu1" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]
          [[ "$mode" == "MUSIC_DUAL_T4" ]]
          [[ "$action" == "dual-t4-music-v20-video-suspended" ]]
          echo "KAGGLE_GPU0_URL=${gpu0%/}" >> "$GITHUB_ENV"
          echo "KAGGLE_GPU1_URL=${gpu1%/}" >> "$GITHUB_ENV"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          account_id="$CLOUDFLARE_ACCOUNT_ID"
          if [[ -z "$account_id" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="$zone_response" node -e "const p=JSON.parse(process.env.CF_RESPONSE||'{}'); const z=(p.result||[]).find(x=>x&&x.name==='sonaraenterprise.com'); process.stdout.write(String(z?.account?.id||''));")"
          fi
          test -n "$account_id"
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Verify GPU0 ACE-Step music
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if response="$(curl -fsS --connect-timeout 10 --max-time 20 "$KAGGLE_GPU0_URL/health" 2>/dev/null)"; then
              if HEALTH="$response" node -e "const h=JSON.parse(process.env.HEALTH); const d=h.data||h; const t=JSON.stringify(d); const ok=d.models_initialized===true&&d.llm_initialized===true&&/acestep-v15-turbo/i.test(String(d.loaded_model||t))&&/0\\.6B/i.test(String(d.loaded_lm_model||t)); process.exit(ok?0:1);"; then
                echo "GPU0 ACE-Step + 5Hz LM healthy"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Verify GPU1 ACE-Step music
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if response="$(curl -fsS --connect-timeout 10 --max-time 20 "$KAGGLE_GPU1_URL/health" 2>/dev/null)"; then
              if HEALTH="$response" node -e "const h=JSON.parse(process.env.HEALTH); const d=h.data||h; const t=JSON.stringify(d); const ok=d.models_initialized===true&&d.llm_initialized===true&&/acestep-v15-turbo/i.test(String(d.loaded_model||t))&&/0\\.6B/i.test(String(d.loaded_lm_model||t)); process.exit(ok?0:1);"; then
                echo "GPU1 ACE-Step + 5Hz LM healthy"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Bind both T4 GPUs to ACE-Step music
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KAGGLE_GPU0_URL,$KAGGLE_GPU1_URL" | npx --yes wrangler@latest secret put ACESTEP_WORKER_URLS --config wrangler.jsonc
          printf '%s' "" | npx --yes wrangler@latest secret put SONARA_VIDEO_WORKER_URL --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ZERO_COST_VIDEO --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ENABLE_GEMINI_VIDEO --config wrangler.jsonc

      - name: Deploy latest Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production dual music health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?dual=${GITHUB_SHA}-${attempt}" 2>/dev/null)"; then
              if HEALTH="$response" node -e "const h=JSON.parse(process.env.HEALTH); const w=Array.isArray(h.aceStepWorkers)?h.aceStepWorkers:[]; const c=Number(h.aceStepWorkerCount||w.length||0); console.log(JSON.stringify({aceStepWorkerCount:c,aceStepWorkers:w,realPromptVersion:h.realPromptVersion})); process.exit(c>=2&&h.realPromptEngine===true&&h.realPromptVersion==='v20-5hz-lm-authoritative'?0:1);"; then
                echo "SONARA production verified: dual T4 ACE-Step music active"
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
