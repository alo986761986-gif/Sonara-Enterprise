name: Deploy SONARA MoLab Router Offline Safe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-molab-router-offline-safe-0904.yml"
      - "scripts/patch-quality-speed-v10.py"
      - "scripts/patch-molab-530-recovery.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-molab-router-offline-safe
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish router code without rebinding dead MoLab URL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply QUALITY V10 and HTTP 530 recovery
        run: |
          python3 scripts/patch-quality-speed-v10.py
          python3 scripts/patch-molab-530-recovery.py
          node --check cloudflare/sonara-molab-xl-router.mjs

      - name: Install dependencies
        run: npm install

      - name: Build SONARA
        run: npm run build

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy router code and keep existing secret
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public API responds as JSON
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 20 -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?offline-safe=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "${code}" =~ ^2 ]] && jq -e . /tmp/ready.json >/dev/null 2>&1; then
              cat /tmp/ready.json
              echo "SONARA_ROUTER_OFFLINE_SAFE_DEPLOYED=true"
              exit 0
            fi
            sleep 4
          done
          echo "Public API verification failed" >&2
          exit 1
