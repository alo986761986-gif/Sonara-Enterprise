name: Check Cloudflare Video Secrets

on:
  push:
    branches:
      - ops/check-cloudflare-gemini-secret-20260828
    paths:
      - ".github/workflows/check-cloudflare-video-secrets.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"
      - name: List Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --config wrangler.jsonc | tee /tmp/secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/secrets.json', 'utf8');
          console.log('SONARA_SECRET_NAME_CHECK_START');
          for (const name of ['GEMINI_API_KEY','FIREBASE_STORAGE_BUCKET','VITE_FIREBASE_STORAGE_BUCKET','FIREBASE_SERVICE_ACCOUNT_JSON','VITE_FIREBASE_API_KEY','SONARA_FIREBASE_API_KEY']) {
            console.log(`${name}=${raw.includes(name) ? 'PRESENT' : 'ABSENT'}`);
          }
          console.log('SONARA_SECRET_NAME_CHECK_END');
          NODE
