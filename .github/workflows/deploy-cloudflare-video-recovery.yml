name: Deploy SONARA Video AI T4 Only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-video-recovery.yml"
      - "cloudflare/sonara-video-api-recovery.mjs"
      - "cloudflare/sonara-video-api-recovery.test.mjs"
      - "cloudflare/sonara-web-v15-router.mjs"
      - "cloudflare/sonara-engine-v17-lm-composer.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-video-t4-only-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy T4-only Video AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate T4-only Video AI router
        run: node cloudflare/sonara-video-api-recovery.test.mjs

      - name: Verify T4-only routing markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "cloudflare-video-json-v4-t4-only" cloudflare/sonara-video-api-recovery.mjs
          grep -q "kaggle-wan21" cloudflare/sonara-video-api-recovery.mjs
          grep -q "routeMode: 'kaggle-t4-only'" cloudflare/sonara-video-api-recovery.mjs
          grep -q "googleBillingRequired: false" cloudflare/sonara-video-api-recovery.mjs
          grep -q "geminiEnabled: false" cloudflare/sonara-video-api-recovery.mjs
          grep -q "recoverVideoApi(request, { env, ctx })" cloudflare/sonara-web-v15-router.mjs
          if grep -q "startGeminiEdge" cloudflare/sonara-video-api-recovery.mjs; then
            echo "Gemini startup path still present in public router." >&2
            exit 1
          fi
          echo "Video AI router is Kaggle T4/WAN only."

      - name: Validate music engine remains unchanged
        run: |
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public WAN T4 edge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/edge-health?t4=${GITHUB_SHA}-${attempt}" 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/video-edge-health.json
              if node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/video-edge-health.json','utf8'));
          const ok = h.valid === true && h.provider === 'kaggle-wan21' && h.zeroCost === true && h.googleBillingRequired === false && h.geminiEnabled === false && h.vertexEnabled === false && h.routeMode === 'kaggle-t4-only';
          console.log(JSON.stringify(h));
          process.exit(ok ? 0 : 1);
          NODE
              then
                echo "Public Video AI verified: Kaggle WAN T4 only, Google disabled."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public T4-only Video AI edge did not become healthy." >&2
          exit 1

      - name: Verify production music health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 https://api.sonaraenterprise.com/api/health)"
          printf '%s' "${response}" > /tmp/music-health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/music-health.json', 'utf8'));
          const workers = Array.isArray(health.aceStepWorkers) ? health.aceStepWorkers : [];
          if (!(Number(health.aceStepWorkerCount || workers.length) > 0 && workers.some(item => item?.kind === 'kaggle'))) {
            throw new Error(`Kaggle ACE-Step worker unavailable: ${JSON.stringify(health)}`);
          }
          console.log('Music Kaggle ACE-Step remains healthy.');
          NODE
