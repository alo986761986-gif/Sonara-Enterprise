name: Deploy SONARA Video AI 502 Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-video-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-video-recovery-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Video AI recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate isolated Video AI recovery
        run: node cloudflare/sonara-video-api-recovery.test.mjs

      - name: Verify Video AI routing only
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sonara-video-api-recovery.mjs" cloudflare/sonara-web-v15-router.mjs
          grep -q "isVideoApiRequest" cloudflare/sonara-web-v15-router.mjs
          grep -q "VIDEO_UPSTREAM_RETRYABLE" cloudflare/sonara-video-api-recovery.mjs
          grep -q "cloudflare-video-json-v1" cloudflare/sonara-video-api-recovery.mjs
          grep -q "sonara-engine-v15-authoritative-prompt.mjs" cloudflare/sonara-web-v15-router.mjs
          echo "Video AI edge recovery isolated from music generation."

      - name: Validate existing music engine remains v16
        run: |
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public Video AI returns JSON
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            code="$(curl -sS -o /tmp/video-status.json -D /tmp/video-status.headers -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/status?edge_check=${GITHUB_SHA}-${attempt}" || true)"
            type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' /tmp/video-status.headers | tail -n1 | tr -d '\r')"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-sonara-video-recovery:/{print $2}' /tmp/video-status.headers | tail -n1 | tr -d '\r')"
            if [[ "${type}" == application/json* ]] && [[ "${marker}" == "cloudflare-video-json-v1" ]]; then
              node -e "JSON.parse(require('fs').readFileSync('/tmp/video-status.json','utf8'));"
              echo "Public Video AI edge verified: HTTP ${code}, JSON response, recovery marker present."
              exit 0
            fi
            echo "Video AI edge not ready (${attempt}/15): HTTP=${code} type=${type} marker=${marker}"
            sleep 4
          done
          echo "Public Video AI edge recovery did not become ready." >&2
          exit 1

      - name: Verify v16 music health unchanged
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 20 https://api.sonaraenterprise.com/api/health)"
          printf '%s' "${response}" > /tmp/music-health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/music-health.json', 'utf8'));
          const expected = {
            universalGenreLock: 'v15-authoritative-full-prompt',
            professionalPromptPreserved: true,
            selectedSubgenreAuthoritative: true,
            kaggleProfile: 'kaggle-t4x2-extreme-fidelity-v16',
            kaggleInferenceSteps: 12,
            kaggleThinking: true
          };
          for (const [key, value] of Object.entries(expected)) {
            if (health[key] !== value) throw new Error(`Music engine changed: ${key}=${JSON.stringify(health[key])}`);
          }
          console.log('Music engine v16 unchanged after Video AI recovery deploy.');
          NODE
