name: Deploy SONARA Dual T4 Music (Video AI suspended)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-video-recovery.yml"
      - "cloudflare/sonara-web-v15-router.mjs"
      - "cloudflare/sonara-engine-v15-authoritative-prompt.mjs"
      - "cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs"
      - "cloudflare/extreme-fidelity-v16.test.mjs"
      - "scripts/activate-extreme-fidelity-v16.cjs"
      - "cloudflare/sonara-engine-v17-lm-composer.mjs"
      - "cloudflare/sonara-engine-v18-fast-hq.mjs"
      - "cloudflare/sonara-engine-v19-resilient-dual.mjs"
      - "cloudflare/sonara-web-generator-stability.mjs"
      - "scripts/kaggle-sonara-music-v20-dual-t4.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-dual-t4-music-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dual T4 music and suspend Video AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify Video AI is suspended for dual music
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function videoSuspendedResponse" cloudflare/sonara-web-v15-router.mjs
          grep -q "GPU_T4_REALLOCATED_TO_MUSIC" cloudflare/sonara-web-v15-router.mjs
          grep -q "suspended-for-dual-t4-music" cloudflare/sonara-web-v15-router.mjs
          if grep -q "recoverVideoApi(request, { env, ctx })" cloudflare/sonara-web-v15-router.mjs; then
            echo "Public router still sends Video AI traffic to the GPU worker." >&2
            exit 1
          fi
          echo "Video AI public generation is suspended while both T4s serve music."

      - name: Validate Real Prompt v21 music engine
        run: |
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs
          grep -q "dual-t4-max-speed-v21" cloudflare/sonara-engine-v19-resilient-dual.mjs
          grep -q "thinking: true" cloudflare/sonara-engine-v19-resilient-dual.mjs
          grep -q "constrained_decoding: true" cloudflare/sonara-engine-v19-resilient-dual.mjs
          grep -q "if (pool.length >= 2)" cloudflare/sonara-engine-v19-resilient-dual.mjs
          grep -q "Promise.all" cloudflare/sonara-engine-v19-resilient-dual.mjs
          echo "Real Prompt v21 dual-worker parallel path verified."

      - name: Build production app
        run: npm run build

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify Video AI suspension is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            code="$(curl -sS --max-time 30 -o /tmp/video-suspended.json -w '%{http_code}' -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/edge-health?suspended=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "${code}" == "503" ]] && node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/video-suspended.json','utf8'));
          const ok = h.suspended === true && h.status === 'SUSPENDED' && h.reason === 'GPU_T4_REALLOCATED_TO_MUSIC' && h.musicMode === 'dual-t4-parallel';
          console.log(JSON.stringify(h));
          process.exit(ok ? 0 : 1);
          NODE
            then
              echo "Video AI suspension verified in production."
              exit 0
            fi
            sleep 5
          done
          echo "Video AI suspension did not become visible in production." >&2
          exit 1

      - name: Verify production music health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?music=${GITHUB_SHA}")"
          printf '%s' "${response}" > /tmp/music-health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/music-health.json', 'utf8'));
          const workers = Array.isArray(health.aceStepWorkers) ? health.aceStepWorkers : [];
          const count = Number(health.aceStepWorkerCount || workers.length || 0);
          if (!(count > 0 && workers.some(item => item?.kind === 'kaggle'))) {
            throw new Error(`Kaggle ACE-Step worker unavailable: ${JSON.stringify(health)}`);
          }
          if (!(health.stableDual === true
            && health.stableDualProfile === 'dual-t4-studio-max-8step-v25'
            && health.sonaraMusicV17 === true
            && health.audioQualityJudge === 'sonara-quality-gate-v2'
            && health.sonaraNextStudio?.version === 'sonara-studio-v2.0-production')) {
            throw new Error(`SONARA official dual T4 / Studio chain not active: ${JSON.stringify(health)}`);
          }
          console.log(JSON.stringify({status: health.status, aceStepWorkerCount: count, aceStepWorkers: workers, stableDualProfile: health.stableDualProfile, audioQualityJudge: health.audioQualityJudge, studioVersion: health.sonaraNextStudio?.version}));
          console.log('Music remains healthy with both Kaggle T4 workers, Quality Gate v2 and Studio 2.0 active.');
          NODE