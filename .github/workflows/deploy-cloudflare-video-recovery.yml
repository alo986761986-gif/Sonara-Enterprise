name: Deploy SONARA Zero Cost Video AI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-video-recovery.yml"
      - "cloudflare/sonara-video-api-recovery.mjs"
      - "cloudflare/sonara-video-api-recovery.test.mjs"
      - "cloudflare/sonara-web-v15-router.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-video-zero-cost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy zero-cost WAN Video AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate zero-cost Video AI router
        run: node cloudflare/sonara-video-api-recovery.test.mjs

      - name: Assert zero-cost isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q "cloudflare-video-json-v3" cloudflare/sonara-video-api-recovery.mjs
          grep -q "SONARA_ZERO_COST_VIDEO" cloudflare/sonara-video-api-recovery.mjs
          grep -q "SONARA_VIDEO_WORKER_URL" cloudflare/sonara-video-api-recovery.mjs
          grep -q "SONARA_ENABLE_GEMINI_VIDEO" cloudflare/sonara-video-api-recovery.mjs
          grep -q "recoverVideoApi(request, { env, ctx })" cloudflare/sonara-web-v15-router.mjs
          echo "Video AI zero-cost routing is isolated from music and Google video is opt-in only."

      - name: Validate existing music source unchanged
        run: |
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs

      - name: Require live WAN binding before deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --config wrangler.jsonc > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/worker-secrets.json', 'utf8');
          for (const name of ['SONARA_VIDEO_WORKER_URL','SONARA_ZERO_COST_VIDEO','SONARA_ENABLE_GEMINI_VIDEO']) {
            if (!raw.includes(name)) throw new Error(`Missing Cloudflare binding ${name}; run Configure SONARA Kaggle Workers after WAN GPU1 is ready.`);
          }
          NODE

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public v3 marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            code="$(curl -sS -o /tmp/video-status.json -D /tmp/video-status.headers -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/status?edge_check=${GITHUB_SHA}-${attempt}" || true)"
            type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' /tmp/video-status.headers | tail -n1 | tr -d '\r')"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-sonara-video-recovery:/{print $2}' /tmp/video-status.headers | tail -n1 | tr -d '\r')"
            if [[ "${type}" == application/json* ]] && [[ "${marker}" == "cloudflare-video-json-v3" ]]; then
              node -e "JSON.parse(require('fs').readFileSync('/tmp/video-status.json','utf8'));"
              echo "Public zero-cost Video AI v3 marker verified."
              exit 0
            fi
            echo "v3 edge not ready (${attempt}/15): HTTP=${code} marker=${marker}"
            sleep 4
          done
          exit 1

      - name: Verify live zero-cost WAN provider
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/edge-health?deploy=${GITHUB_SHA}")"
          printf '%s' "${response}" > /tmp/video-edge-health.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/video-edge-health.json', 'utf8'));
          if (h.valid !== true) throw new Error(`WAN edge invalid: ${JSON.stringify(h)}`);
          if (h.provider !== 'kaggle-wan21') throw new Error(`Unexpected provider ${h.provider}`);
          if (h.zeroCost !== true || h.googleBillingRequired !== false || h.geminiEnabled !== false) {
            throw new Error(`Cost guard invalid: ${JSON.stringify(h)}`);
          }
          console.log('SONARA Video AI is live on zero-cost Kaggle WAN; Gemini video is disabled.');
          NODE
