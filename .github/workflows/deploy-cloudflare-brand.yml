name: Deploy SONARA Brand to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sonara-brand-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-brand-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SONARA YuE V10.4 edge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate SONARA V10.4 routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-yue-primary-edge.mjs' wrangler.jsonc
          grep -q 'sonara-yue-v10.4-dual-fidelity-primary' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'candidateCount: quality ? 1 : 2' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'sonaraCreatorPromptAuthoritative' cloudflare/sonara-yue-primary-edge.mjs
          grep -q 'sonara-yue-v10.4-dual-fidelity-routing' cloudflare/sonara-yue-router.mjs
          grep -q 'return Math.round(clamp(body.candidateCount ?? body.candidate_count, 2, 1, 2))' cloudflare/sonara-yue-router.mjs
          grep -q 'prompt: creatorPrompt(body)' cloudflare/sonara-yue-router.mjs
          grep -q 'Brano A pronto' cloudflare/sonara-yue-router.mjs
          grep -q 'sonara-yue-dual-fidelity-v3' cloudflare/sonara-instant-speed-router.mjs
          ! grep -q 'sonara-instant-dual-v1' cloudflare/sonara-instant-speed-router.mjs
          ! grep -q 'd16pair_' cloudflare/sonara-instant-speed-router.mjs
          grep -q "./sonara-world-style-production-router.mjs" cloudflare/sonara-studio-max-router.mjs
          grep -q "./sonara-production-router.mjs" cloudflare/sonara-world-style-production-router.mjs
          grep -q "./sonara-onboarding-router.mjs" cloudflare/sonara-production-router.mjs
          grep -q "./sonara-world-tempo-router.mjs" cloudflare/sonara-production-router.mjs
          grep -q "./sonara-brand-router.mjs" cloudflare/sonara-world-tempo-router.mjs
          grep -q 'sonara-brand-icon.svg' cloudflare/sonara-brand-router.mjs
          grep -q 'sonara-brand-icon.svg' index.html
          npx --yes tsx src/musicStyleIntelligence.world.test.ts
          node --check cloudflare/sonara-yue-primary-edge.mjs
          node --check cloudflare/sonara-yue-router.mjs
          node --check cloudflare/sonara-instant-speed-router.mjs
          node --check cloudflare/sonara-studio-max-router.mjs
          node --check cloudflare/sonara-world-style-production-router.mjs
          node --check cloudflare/sonara-production-router.mjs
          node --check cloudflare/sonara-world-tempo-router.mjs
          node --check cloudflare/sonara-brand-router.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public SONARA V10.4 Dual Fidelity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            icon_code="$(curl -L -sS -o /tmp/sonara-icon -w '%{http_code}' --max-time 20 "https://sonaraenterprise.com/sonara-brand-icon.svg?v104=${GITHUB_SHA}-${attempt}" || true)"
            site_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?v104=${GITHUB_SHA}-${attempt}" || true)"
            site_html="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?v104=${GITHUB_SHA}-${attempt}" || true)"
            tempo_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/tempo-profile?family=Electronic%20%2F%20Dance&genre=House&subgenre=Deep%20House&prompt=Deep%20House%20124%20BPM" || true)"
            if [[ "${icon_code}" == "200" ]] \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-speed-profile: sonara-yue-dual-fidelity-v3' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-yue-primary: sonara-yue-v10.4-dual-fidelity-primary' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-yue-profile: sonara-yue-v10.4-dual-fidelity-routing' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-brand: sonic-s-v5' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-header-brand: enterprise-logo-v5' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-tempo-taxonomy: sonara-world-tempo-v1' \
              && ! printf '%s' "${site_html}" | grep -q 'sonara-instant-dual-v1' \
              && printf '%s' "${site_html}" | grep -q 'sonara-header-brand-v5' \
              && printf '%s' "${tempo_headers}" | grep -qi 'x-sonara-tempo-taxonomy: sonara-world-tempo-v1'; then
              echo "SONARA YuE V10.4 Dual Fidelity production verified."
              exit 0
            fi
            echo "SONARA V10.4 propagation pending (${attempt}/15)."
            sleep 4
          done
          echo "SONARA V10.4 public production verification failed." >&2
          exit 1
