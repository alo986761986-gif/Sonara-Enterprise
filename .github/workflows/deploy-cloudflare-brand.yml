name: Deploy SONARA Brand to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sonara-brand-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-brand-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SONARA brand edge wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate SONARA production routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-instant-speed-router.mjs' wrangler.jsonc
          grep -q 'sonara-yue-turbo-single-v2' cloudflare/sonara-instant-speed-router.mjs
          grep -q './sonara-studio-max-router.mjs' cloudflare/sonara-instant-speed-router.mjs
          ! grep -q 'sonara-instant-dual-v1' cloudflare/sonara-instant-speed-router.mjs
          ! grep -q 'd16pair_' cloudflare/sonara-instant-speed-router.mjs
          grep -q "./sonara-world-style-production-router.mjs" cloudflare/sonara-studio-max-router.mjs
          grep -q 'sonara-studio-max-v1' src/sonaraStudioMaxIntelligence.ts
          grep -q '/api/studio-max-profile' cloudflare/sonara-studio-max-router.mjs
          grep -q "./sonara-production-router.mjs" cloudflare/sonara-world-style-production-router.mjs
          grep -q 'sonara-world-style-v1' cloudflare/sonara-world-style-production-router.mjs
          grep -q "./sonara-onboarding-router.mjs" cloudflare/sonara-production-router.mjs
          grep -q "./sonara-world-tempo-router.mjs" cloudflare/sonara-production-router.mjs
          grep -q 'sonara-job-recovery-v1' cloudflare/sonara-production-router.mjs
          grep -q "./sonara-brand-router.mjs" cloudflare/sonara-world-tempo-router.mjs
          grep -q 'sonara-world-tempo-v1' cloudflare/sonara-world-tempo-router.mjs
          grep -q "./sonara-brand-router.mjs" cloudflare/sonara-onboarding-router.mjs
          grep -q 'sonara-onboarding-guide-v1' cloudflare/sonara-onboarding-router.mjs
          grep -q 'sonara-brand-icon.svg' cloudflare/sonara-brand-router.mjs
          grep -q 'sonara-header-brand-v5' cloudflare/sonara-brand-router.mjs
          grep -q 'sonara-brand-icon.svg' index.html
          grep -q 'sonara-brand-boot.svg' src/components/brand/SonaraBrandControl.tsx
          npx --yes tsx src/musicStyleIntelligence.world.test.ts
          node --check cloudflare/sonara-instant-speed-router.mjs
          node --check cloudflare/sonara-studio-max-router.mjs
          node --check cloudflare/sonara-world-style-production-router.mjs
          node --check cloudflare/sonara-production-router.mjs
          node --check cloudflare/sonara-world-tempo-router.mjs
          node --check cloudflare/sonara-brand-router.mjs
          node --check cloudflare/sonara-onboarding-router.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public SONARA Turbo single production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            icon_code="$(curl -L -sS -o /tmp/sonara-icon -w '%{http_code}' --max-time 20 "https://sonaraenterprise.com/sonara-brand-icon.svg?brand=${GITHUB_SHA}-${attempt}" || true)"
            site_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?brand=${GITHUB_SHA}-${attempt}" || true)"
            site_html="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?brand=${GITHUB_SHA}-${attempt}" || true)"
            studio_probe="$(curl -sS -i --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/studio-max-profile?duration=480&bpm=126&key=F%23%20minor&genre=House&subgenre=Tech%20House&mood=Dark&lyrics=Test&vocalLanguage=it" || true)"
            tempo_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/tempo-profile?family=Electronic%20%2F%20Dance&genre=Drum%20%26%20Bass&subgenre=Jungle&prompt=Jungle%20170%20BPM" || true)"
            tempo_body="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/tempo-profile?family=Electronic%20%2F%20Dance&genre=Drum%20%26%20Bass&subgenre=Jungle&prompt=Jungle%20170%20BPM" || true)"
            if [[ "${icon_code}" == "200" ]] \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-speed-profile: sonara-yue-turbo-single-v2' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-yue-primary: sonara-yue-v10-turbo-primary' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-yue-profile: sonara-yue-v10-profile-routing' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-brand: sonic-s-v5' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-header-brand: enterprise-logo-v5' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-guide: creator-onboarding-v1' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-tempo-taxonomy: sonara-world-tempo-v1' \
              && ! printf '%s' "${site_html}" | grep -q 'sonara-instant-dual-v1' \
              && printf '%s' "${site_html}" | grep -q 'sonara-header-brand-v5' \
              && printf '%s' "${site_html}" | grep -q 'sonara-onboarding-guide-v1' \
              && printf '%s' "${studio_probe}" | grep -qi 'x-sonara-speed-profile: sonara-yue-turbo-single-v2' \
              && printf '%s' "${tempo_headers}" | grep -qi 'x-sonara-tempo-taxonomy: sonara-world-tempo-v1' \
              && printf '%s' "${tempo_body}" | grep -q '"bpm":170'; then
              echo "SONARA Turbo single, YuE routing and production edge verified."
              exit 0
            fi
            echo "SONARA Turbo single propagation pending (${attempt}/15)."
            sleep 4
          done
          echo "SONARA Turbo single public production verification failed." >&2
          exit 1
