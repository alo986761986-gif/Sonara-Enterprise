name: Verify Live Sonara Taxonomy Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/verify-live-taxonomy-trigger"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live frontend bundle hotfix
        shell: bash
        run: |
          set -euo pipefail
          asset='/assets/index-BecCyPfS.js'
          echo "SONARA_LIVE_BUNDLE=$asset"
          curl -fsS --max-time 30 -D /tmp/bundle-headers.txt "https://sonaraenterprise.com${asset}" -o /tmp/bundle.js
          cat /tmp/bundle-headers.txt
          grep -qi '^x-sonara-taxonomy-hotfix: neapolitan-urban-v1' /tmp/bundle-headers.txt
          grep -q '__SONARA_NEAPOLITAN_URBAN_HOTFIX__' /tmp/bundle.js
          grep -q 'Rap Napoletano' /tmp/bundle.js
          grep -q 'Hip-Hop Napoletano' /tmp/bundle.js
          grep -q 'Trap Napoletano' /tmp/bundle.js
          echo 'SONARA_LIVE_TAXONOMY_HOTFIX=VERIFIED'

      - name: Verify engine health remains intact
        shell: bash
        run: |
          curl -fsS --max-time 20 https://api.sonaraenterprise.com/api/health -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (data.dualFast !== true) throw new Error('Dual-fast engine health regression');
          console.log('SONARA_ENGINE_HEALTH=VERIFIED');
          NODE
