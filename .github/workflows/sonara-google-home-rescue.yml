name: SONARA - Cloudflare Google root rescue
on:
  push:
    branches: [fix/sonara-black-screen-main-safe-20261109]
    paths: [.github/sonara-google-root-rescue-trigger]
permissions: {contents: write}
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Add only exact-root 302 redirect after verifying healthy asset
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,os,sys,re
          result={'success':False,'worker_unmodified':True,'gpu_unmodified':True}
          def finish(state,rc=1):
              result['stage']=state
              with open('.github/sonara-google-root-rescue-result.json','w') as f:json.dump(result,f,indent=2)
              print('SONARA_ROOT_RESCUE='+json.dumps(result),flush=True)
              sys.exit(rc)
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          if not token:finish('CF_TOKEN_MISSING')
          url='https://sonaraenterprise.com/?refresh=20261109'
          try:
              with urllib.request.urlopen(url,timeout=20) as r:
                  html=r.read(50000).decode('utf8','replace')
                  if r.status!=200 or len(html)>20000 or 'id="root"' not in html:finish('CLEAN_HOME_NOT_VERIFIED')
              asset=re.search(r'/assets/index-[a-zA-Z0-9_-]+\.js',html)
              if not asset:finish('CLEAN_JS_NOT_FOUND')
              with urllib.request.urlopen('https://sonaraenterprise.com'+asset.group(),timeout=20) as r:
                  if r.status!=200 or 'javascript' not in r.headers.get('content-type','').lower():finish('CLEAN_JS_NOT_VERIFIED')
              result['healthy_asset_verified']=True
          except Exception as error:finish('HEALTHY_VARIANT_HTTP_FAILED_'+type(error).__name__)
          api='https://api.cloudflare.com/client/v4'
          def cf(path,method='GET',body=None):
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'}
              req=urllib.request.Request(api+path,headers=headers,method=method,data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=24) as r:return json.load(r)
              except urllib.error.HTTPError as error:return {'http':error.code}
              except Exception as error:return {'error':type(error).__name__}
          zones=cf('/zones?name=sonaraenterprise.com&per_page=10')
          zone=next((z for z in zones.get('result',[]) if z.get('name')=='sonaraenterprise.com'),None)
          if not zone:finish('CF_ZONE_LOOKUP_FAILED')
          prefix='/zones/'+zone['id']
          current=cf(prefix+'/rulesets/phases/http_request_dynamic_redirect/entrypoint')
          if current.get('http') not in (None,404) or current.get('error'):finish('CF_RULESET_READ_FAILED')
          existing=current.get('result')
          desc='SONARA exact Google-home rescue 2026-11-09'
          expr='(http.host in {"sonaraenterprise.com" "www.sonaraenterprise.com"} and http.request.uri.path eq "/" and http.request.uri.query eq "")'
          rule={'description':desc,'expression':expr,'action':'redirect','action_parameters':{'from_value':{'status_code':302,'target_url':{'value':url},'preserve_query_string':False}},'enabled':True}
          if isinstance(existing,dict):
              rules=existing.get('rules',[])
              if any(r.get('description')==desc for r in rules):finish('RULE_ALREADY_CREATED',0)
              if any(r.get('expression')==expr for r in rules):finish('CONFLICTING_RULE_EXISTS')
              response=cf(prefix+'/rulesets/'+existing['id']+'/rules','POST',rule)
              result['mode']='append_rule'
          else:
              response=cf(prefix+'/rulesets','POST',{'name':'SONARA homepage rescue','kind':'zone','phase':'http_request_dynamic_redirect','rules':[rule]})
              result['mode']='create_ruleset'
          if not response.get('success'):
              result['cloudflare_http']=response.get('http')
              finish('CF_REDIRECT_WRITE_FAILED')
          result['success']=True
          finish('CLOUDFLARE_ROOT_REDIRECT_CREATED',0)
          PY
      - name: Save outcome for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,base64,json,urllib.request
          p='.github/sonara-google-root-rescue-result.json'
          if not os.path.exists(p):raise SystemExit(0)
          repo=os.environ['GITHUB_REPOSITORY'];branch=os.environ['GITHUB_REF_NAME']
          payload={'message':'ops: record exact-root Cloudflare redirect outcome','branch':branch,'content':base64.b64encode(open(p,'rb').read()).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/contents/'+p,method='PUT',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:print('SONARA_RESCUE_REPORT_HTTP='+str(r.status))
          except Exception as e:print('SONARA_RESCUE_REPORT_ERROR='+type(e).__name__)
          PY
