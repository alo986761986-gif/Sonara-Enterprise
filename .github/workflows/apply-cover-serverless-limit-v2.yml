name: Apply Cover Serverless Limit V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-cover-serverless-limit-v2.py"
      - ".github/workflows/apply-cover-serverless-limit-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cover-serverless-limit-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate cover endpoint into existing function
        run: python scripts/patch-cover-serverless-limit-v2.py
      - name: Install dependencies
        run: npm install
      - name: Build production
        run: npm run build
      - name: Guard serverless-limit cover integration
        run: |
          test ! -f api/music-cover/generate.ts
          grep -Fq "'/api/eleven-music/cover'" src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'OPENAI_IMAGES_URL' src/server/musicCoverApi.ts
          grep -Fq "action === 'cover'" 'api/eleven-music/[...path].ts'
          grep -Fq 'SCARICA COVER' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'RIGENERA COPERTINA' src/components/generator/ElevenMusicGenerationControl.tsx
      - name: Publish source migration
        run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A api/music-cover src/server/musicCoverApi.ts 'api/eleven-music/[...path].ts' src/components/generator/ElevenMusicGenerationControl.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(cover): reuse existing music serverless function"
          git push origin main
