name: Deploy Modal SONARA Video RTX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modal/sonara_video_wan22.py"
      - ".github/video-rtx-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: modal-sonara-video-rtx
  cancel-in-progress: false

jobs:
  deploy-and-smoke-test:
    name: Wan 2.2 A14B on RTX PRO 6000
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TEST_PROMPT: >-
        Ultra-cinematic premium music video at night on a rain-soaked Mediterranean rooftop,
        a futuristic performer in a tailored black coat overlooking a luminous city, realistic skin
        and fabric, wet reflections, volumetric atmosphere, slow controlled dolly-in, subtle natural
        body movement, shallow depth of field, anamorphic lens character, physically accurate shadows,
        high-end commercial color grading, coherent motion, rich detail, no text, no logos.

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Video RTX source
        run: python -m py_compile modal/sonara_video_wan22.py

      - name: Normalize and auto-extract Modal deployment credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          def clean(value: str) -> str:
              value = (value or "").strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                  value = value[1:-1].strip()
              return value

          raw_id = clean(os.environ.get("MODAL_TOKEN_ID", ""))
          raw_secret = clean(os.environ.get("MODAL_TOKEN_SECRET", ""))

          for name in ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET"):
              prefix = f"{name}="
              if raw_id.startswith(prefix):
                  raw_id = raw_id[len(prefix):].strip()
              if raw_secret.startswith(prefix):
                  raw_secret = raw_secret[len(prefix):].strip()

          def extract(prefix: str, *values: str) -> str:
              pattern = re.compile(re.escape(prefix) + r"[A-Za-z0-9_-]+")
              for value in values:
                  if value.startswith(prefix):
                      return value
                  match = pattern.search(value)
                  if match:
                      return match.group(0)
              return ""

          token_id = extract("ak-", raw_id, raw_secret) or raw_id
          token_secret = extract("as-", raw_secret, raw_id) or raw_secret

          for value in (token_id, token_secret):
              if value:
                  print(f"::add-mask::{value}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODAL_TOKEN_ID={token_id}\n")
              handle.write(f"MODAL_TOKEN_SECRET={token_secret}\n")
          PY

      - name: Diagnose Modal credential families safely
        shell: bash
        run: |
          python - <<'PY'
          import os
          checks = (
              ("MODAL_TOKEN_ID", "ak-", "wk-"),
              ("MODAL_TOKEN_SECRET", "as-", "ws-"),
          )
          for name, api_prefix, proxy_prefix in checks:
              value = os.environ.get(name, "").strip()
              if not value:
                  family = "missing"
              elif value.startswith(api_prefix):
                  family = "api"
              elif value.startswith(proxy_prefix):
                  family = "proxy"
              else:
                  family = "other"
              print(f"{name}: family={family}, length={len(value)}")
          PY

      - name: Verify Modal credentials
        shell: bash
        run: |
          if [[ -z "${MODAL_TOKEN_ID}" || -z "${MODAL_TOKEN_SECRET}" ]]; then
            echo "MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are required." >&2
            exit 1
          fi
          if [[ "${MODAL_TOKEN_ID}" != ak-* ]]; then
            echo "MODAL_TOKEN_ID must contain a Modal API token ID beginning with ak-." >&2
            exit 1
          fi
          if [[ "${MODAL_TOKEN_SECRET}" != as-* ]]; then
            echo "MODAL_TOKEN_SECRET must contain the matching Modal API token secret beginning with as-." >&2
            exit 1
          fi
          echo "Modal API credentials verified."

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.4,<2"

      - name: Prepare official Wan 2.2 A14B model
        run: modal run modal/sonara_video_wan22.py::prepare_models

      - name: Deploy SONARA Video RTX engine
        run: modal deploy --strategy=rolling modal/sonara_video_wan22.py

      - name: Generate 720p RTX smoke-test video
        shell: bash
        run: |
          modal run modal/sonara_video_wan22.py::generate_video \
            --prompt "${TEST_PROMPT}" \
            --width 1280 \
            --height 720 \
            --frames 81 \
            --seed 260830 \
            --steps 40 \
            --write-result sonara-video-rtx-wan22-test.mp4

      - name: Validate generated MP4
        shell: bash
        run: |
          test -s sonara-video-rtx-wan22-test.mp4
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json sonara-video-rtx-wan22-test.mp4

      - name: Upload RTX test video
        uses: actions/upload-artifact@v4
        with:
          name: sonara-video-rtx-wan22-test
          path: sonara-video-rtx-wan22-test.mp4
          if-no-files-found: error
          retention-days: 7
