name: Deploy SONARA Music Director V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/sonara-music-director-v3-entry.mjs"
      - "cloudflare/sonara-music-director-v3-ultra-guard.mjs"
      - "cloudflare/sonara-studio-transient-poll-guard.mjs"
      - "cloudflare/sonara-native-auth-main.mjs"
      - "cloudflare/sonara-next-studio-edge.mjs"
      - "cloudflare/sonara-quality-director-v2.mjs"
      - "cloudflare/sonara-quality-gated-router.mjs"
      - "cloudflare/sonara-studio-ai-router.mjs"
      - "cloudflare/sonara-molab-xl-router.mjs"
      - "engine/director_ai.py"
      - "engine/dsp_engine.py"
      - "engine/inference.py"
      - "src/services/promptDirector.ts"
      - "src/components/generator/GenerationProfileControl.tsx"
      - "src/main.tsx"
      - "scripts/activate-ace-step-production.cjs"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-sonara-music-director-v3.yml"

permissions:
  contents: read

concurrency:
  group: sonara-music-director-v3-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      WORKER_ORIGIN: https://sonara-enterprise.alo986761986.workers.dev

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Validate Music Director V3 syntax
        run: |
          node --check cloudflare/sonara-music-director-v3-entry.mjs
          node --check cloudflare/sonara-music-director-v3-ultra-guard.mjs
          node --check cloudflare/sonara-studio-transient-poll-guard.mjs
          node --check cloudflare/sonara-quality-director-v2.mjs
          node --check cloudflare/sonara-next-studio-edge.mjs
          node --check cloudflare/sonara-studio-ai-router.mjs
          node --check cloudflare/sonara-molab-xl-router.mjs
          node --check scripts/activate-ace-step-production.cjs
          python -m py_compile engine/director_ai.py engine/dsp_engine.py engine/inference.py

      - name: Guard real-audio DirectorAI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'composed_final_prompt' engine/director_ai.py
          grep -q 'measured_from_real_audio' engine/director_ai.py
          grep -q 'requires a real generated WAV' engine/director_ai.py
          ! grep -q 'random.uniform' engine/director_ai.py
          ! grep -q 'overall_score.*9.55' engine/director_ai.py

      - name: Validate existing quality contracts
        run: |
          node --test cloudflare/sonara-quality-director-v2.test.mjs
          node --test cloudflare/sonara-studio-v2-contract.test.mjs
          npx tsx src/services/promptDirector.test.ts

      - name: Guard native generation profile UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q "GenerationProfileControl" src/main.tsx
          grep -q "sonara-generation-profile-v3" src/components/generator/GenerationProfileControl.tsx
          grep -q "generationProfileV3" src/components/generator/GenerationProfileControl.tsx
          grep -q "'fast'" src/components/generator/GenerationProfileControl.tsx
          grep -q "'quality'" src/components/generator/GenerationProfileControl.tsx
          grep -q "'ultra'" src/components/generator/GenerationProfileControl.tsx
          grep -q "String('ace_step_xl').trim().toLowerCase()" scripts/activate-ace-step-production.cjs

      - name: Build production app
        run: npm run build

      - name: Guard built native profile markers
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "sonara-generation-profile-v3" dist/assets
          grep -R -q "react-native-ui" dist/assets
          grep -R -q "92+ RELEASE TARGET" dist/assets

      - name: Guard Music Director V3 production contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sonara-music-director-v3" cloudflare/sonara-music-director-v3-entry.mjs
          grep -q "internalBatches: 2" cloudflare/sonara-music-director-v3-entry.mjs
          grep -q "automaticQualityRepair" cloudflare/sonara-music-director-v3-entry.mjs
          grep -q "visibleCandidateTarget: 2" cloudflare/sonara-music-director-v3-entry.mjs
          grep -q "sonara-ultra-quality-guard-1" cloudflare/sonara-music-director-v3-ultra-guard.mjs
          grep -q "MAX_EXTRA_REPAIRS = 2" cloudflare/sonara-music-director-v3-ultra-guard.mjs
          grep -q "TARGET_SCORE = 92" cloudflare/sonara-music-director-v3-ultra-guard.mjs
          grep -q "sonara-studio-transient-poll-guard-1" cloudflare/sonara-studio-transient-poll-guard.mjs
          grep -q "MAX_TRANSIENT_POLLS = 4" cloudflare/sonara-studio-transient-poll-guard.mjs
          grep -q "isTransientQueryFailure" cloudflare/sonara-studio-transient-poll-guard.mjs
          grep -q "sonara-studio-transient-poll-guard.mjs" wrangler.jsonc
          grep -q "sonara-engine-quality-2.0" cloudflare/sonara-quality-director-v2.mjs
          grep -q "acestep-v15-xl-base" cloudflare/sonara-studio-ai-router.mjs

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy Music Director V3 and web assets
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify deployed Worker contract
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in {1..12}; do
            payload="$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "${WORKER_ORIGIN}/api/music/director/capabilities?release=${GITHUB_SHA}-${attempt}" || true)"
            if [[ "${payload}" == *"sonara-music-director-v3"* \
              && "${payload}" == *'"internalCandidates":4'* \
              && "${payload}" == *'"automaticQualityRepair":true'* ]]; then
              verified=1
              echo "Direct Worker Music Director V3 contract verified."
              break
            fi
            echo "Waiting for direct Worker propagation (${attempt}/12)."
            sleep 3
          done
          if [[ ${verified} -ne 1 ]]; then
            echo "Direct Worker Music Director V3 verification failed." >&2
            exit 1
          fi

      - name: Verify native profile bundle on Worker
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${WORKER_ORIGIN}/?release=${GITHUB_SHA}")"
          mapfile -t assets < <(grep -oE 'src="[^"]+\.js"' <<<"${html}" | sed -E 's/^src="|"$//g' | sort -u)
          found=0
          for asset in "${assets[@]}"; do
            if [[ "${asset}" == http* ]]; then url="${asset}"; else url="${WORKER_ORIGIN}${asset}"; fi
            bundle="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${url}" || true)"
            if [[ "${bundle}" == *"sonara-generation-profile-v3"* \
              && "${bundle}" == *"react-native-ui"* \
              && "${bundle}" == *"92+ RELEASE TARGET"* ]]; then
              found=1
              echo "Native FAST / QUALITY / ULTRA profile bundle verified on Worker assets."
              break
            fi
          done
          if [[ ${found} -ne 1 ]]; then
            echo "Native generation profile markers missing from deployed Worker assets." >&2
            exit 1
          fi

      - name: Check public production propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            html="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?release=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${html}" ]]; then
              echo "Public SONARA domain is responding after deploy."
              exit 0
            fi
            echo "Public domain propagation still pending (${attempt}/6)."
            sleep 3
          done
          echo "Public-domain probe timed out from this runner; direct Worker contract and assets were verified successfully."
          exit 0
