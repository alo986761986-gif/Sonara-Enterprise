name: Configure SONARA Dual T4 Music

on:
  push:
    branches:
      - main
    paths:
      - ".github/kaggle-dual-music-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-dual-t4-music-config
  cancel-in-progress: true

jobs:
  configure:
    name: Bind two ACE-Step T4 workers to SONARA Music
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Load dual music endpoints
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/kaggle-dual-music-trigger"
          test -f "${trigger}"
          gpu0="$(sed -n 's/^GPU0=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          gpu1="$(sed -n 's/^GPU1=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          [[ "${gpu0}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]
          [[ "${gpu1}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]
          test "${mode}" = "MUSIC_DUAL_T4"
          echo "KAGGLE_GPU0_URL=${gpu0%/}" >> "${GITHUB_ENV}"
          echo "KAGGLE_GPU1_URL=${gpu1%/}" >> "${GITHUB_ENV}"

      - name: Verify both ACE-Step workers
        shell: bash
        run: |
          set -euo pipefail
          verify_worker() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 12); do
              response="$(curl -fsS --connect-timeout 10 --max-time 20 "${url}/health" || true)"
              if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '
                (.code == 200 or ((.data.status // .status // "") | ascii_downcase) == "ok") and
                ((.data.models_initialized // .models_initialized // false) == true) and
                ((.data.llm_initialized // .llm_initialized // false) == true) and
                ((.data.loaded_model // .loaded_model // "") | contains("acestep-v15-turbo")) and
                ((.data.loaded_lm_model // .loaded_lm_model // "") | contains("0.6B"))
              ' >/dev/null 2>&1; then
                echo "${name} healthy: ${url}"
                return 0
              fi
              echo "${name} health attempt ${attempt}/12 failed"
              sleep 5
            done
            echo "${name} is not a healthy SONARA ACE-Step worker: ${url}" >&2
            return 1
          }
          verify_worker gpu0 "${KAGGLE_GPU0_URL}"
          verify_worker gpu1 "${KAGGLE_GPU1_URL}"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Bind both T4 workers to music router
        shell: bash
        run: |
          set -euo pipefail
          workers="${KAGGLE_GPU0_URL},${KAGGLE_GPU1_URL}"
          printf '%s' "${workers}" | npx --yes wrangler@latest secret put ACESTEP_WORKER_URLS --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ZERO_COST_VIDEO --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ENABLE_GEMINI_VIDEO --config wrangler.jsonc

      - name: Deploy dual-T4 music router
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production dual T4 routing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?dual=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '((.aceStepWorkerCount // (.aceStepWorkers | length) // 0) | tonumber) >= 2' >/dev/null 2>&1; then
              printf '%s\n' "${response}" | jq '{status, aceStepWorkerCount, aceStepWorkers, realPromptEngine, realPromptLmThinking}'
              echo "Dual T4 Music verified in production."
              exit 0
            fi
            echo "Production dual-worker verification attempt ${attempt}/12 failed"
            sleep 5
          done
          echo "Production did not report two ACE-Step music workers." >&2
          exit 1
