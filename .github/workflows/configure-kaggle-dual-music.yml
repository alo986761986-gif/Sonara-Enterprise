name: Configure SONARA Dual T4 Music

on:
  push:
    branches:
      - main
    paths:
      - ".github/kaggle-dual-music-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-dual-t4-music-config
  cancel-in-progress: true

jobs:
  configure:
    name: Bind two ACE-Step T4 workers to SONARA Music
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Load dual music endpoints
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/kaggle-dual-music-trigger"
          test -f "${trigger}"
          gpu0="$(sed -n 's/^GPU0=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          gpu1="$(sed -n 's/^GPU1=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          validate_url() {
            local name="$1"
            local url="$2"
            if [[ ! "${url}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]; then
              echo "Invalid ${name}: ${url}" >&2
              exit 1
            fi
          }
          validate_url GPU0 "${gpu0}"
          validate_url GPU1 "${gpu1}"
          test "${mode}" = "MUSIC_DUAL_T4"
          echo "KAGGLE_GPU0_URL=${gpu0%/}" >> "${GITHUB_ENV}"
          echo "KAGGLE_GPU1_URL=${gpu1%/}" >> "${GITHUB_ENV}"

      - name: Verify both endpoints are ACE-Step + 5Hz LM
        shell: bash
        run: |
          set -euo pipefail
          verify_music() {
            local name="$1"
            local url="$2"
            for attempt in {1..24}; do
              if response="$(curl -fsS --connect-timeout 10 --max-time 20 "${url}/health" 2>/dev/null)"; then
                printf '%s' "${response}" > "/tmp/${name}.json"
                if NAME="${name}" node - <<'NODE'
          const fs = require('fs');
          const name = process.env.NAME;
          const h = JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8'));
          const d = h?.data || h;
          const ok = h?.code === 200 || String(d?.status || '').toLowerCase() === 'ok';
          const ace = d?.models_initialized === true && d?.llm_initialized === true && String(d?.loaded_model || '').includes('acestep-v15-turbo') && String(d?.loaded_lm_model || '').includes('0.6B');
          console.log(JSON.stringify({name, status:d?.status, model:d?.loaded_model, lm:d?.loaded_lm_model}));
          process.exit(ok && ace ? 0 : 1);
NODE
                then
                  echo "${name} ACE-Step + 5Hz LM healthy: ${url}"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "${name} is not a valid SONARA ACE-Step worker: ${url}" >&2
            return 1
          }
          verify_music gpu0 "${KAGGLE_GPU0_URL}"
          verify_music gpu1 "${KAGGLE_GPU1_URL}"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Bind both T4 workers to ACE-Step music
        shell: bash
        run: |
          set -euo pipefail
          workers="${KAGGLE_GPU0_URL},${KAGGLE_GPU1_URL}"
          printf '%s' "${workers}" | npx --yes wrangler@latest secret put ACESTEP_WORKER_URLS --config wrangler.jsonc
          echo "SONARA Music pool configured with two Kaggle T4 workers."

      - name: Suspend Video AI worker binding
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ZERO_COST_VIDEO --config wrangler.jsonc
          printf '%s' "false" | npx --yes wrangler@latest secret put SONARA_ENABLE_GEMINI_VIDEO --config wrangler.jsonc
          echo "Video AI remains suspended while both T4 GPUs serve music."

      - name: Deploy dual-T4 music router
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production sees two Kaggle music workers
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?dual=${GITHUB_SHA}-${attempt}" 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/music-health.json
              if node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/music-health.json','utf8'));
          const workers = Array.isArray(h.aceStepWorkers) ? h.aceStepWorkers : [];
          const count = Number(h.aceStepWorkerCount || workers.length || 0);
          console.log(JSON.stringify({status:h.status, aceStepWorkerCount:count, aceStepWorkers:workers, realPromptEngine:h.realPromptEngine, realPromptLmThinking:h.realPromptLmThinking}));
          process.exit(count >= 2 ? 0 : 1);
NODE
              then
                echo "Dual T4 Music verified in production."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Production did not report two ACE-Step music workers." >&2
          exit 1
