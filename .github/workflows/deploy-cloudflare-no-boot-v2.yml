name: Deploy SONARA No-Boot Edge Hotfix V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sonara-no-boot-v2-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-no-boot-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and remove legacy boot in production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build SONARA production assets
        run: npm run build

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Remove every startup overlay at the edge
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'cloudflare/sonara-brand-router.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const headerNeedle = 'const HEADER_BRAND_SCRIPT = `<script id="sonara-header-brand-v5-safe">';
          const headerReplacement = 'const HEADER_BRAND_SCRIPT = `<style id="sonara-no-boot-edge-v2">[aria-label="SONARA boot animation"],[data-sonara-boot="active"]{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}</style><script id="sonara-header-brand-v5-safe">';
          if (!source.includes(headerNeedle)) throw new Error('header marker missing');
          source = source.replace(headerNeedle, headerReplacement);
          const oldRelease = 'setTimeout(releaseBoot,2700);';
          const newRelease = `const removeLegacyAuthSplash=()=>{const root=document.getElementById('root');if(!root)return;[...root.children].forEach(el=>{if(!(el instanceof HTMLElement))return;const txt=(el.textContent||'').replace(/\\s+/g,' ').trim();if(el.classList.contains('min-h-screen')&&el.classList.contains('items-center')&&el.classList.contains('justify-center')&&txt.includes('SONARA')&&txt.includes('ENTERPRISE')){el.style.setProperty('display','none','important');el.style.setProperty('visibility','hidden','important');el.style.setProperty('pointer-events','none','important');}})};const killStartup=()=>{releaseBoot();removeLegacyAuthSplash();};killStartup();new MutationObserver(killStartup).observe(document.documentElement,{childList:true,subtree:true});[0,16,32,50,100,180,250,500,1000,1500,3000,5000].forEach(ms=>setTimeout(killStartup,ms));`;
          if (!source.includes(oldRelease)) throw new Error('legacy boot release marker missing');
          source = source.replace(oldRelease, newRelease);
          fs.writeFileSync(file, source);
          NODE
          test -d dist
          grep -q 'sonara-no-boot-edge-v2' cloudflare/sonara-brand-router.mjs
          ! grep -q 'setTimeout(releaseBoot,2700)' cloudflare/sonara-brand-router.mjs
          node --check cloudflare/sonara-brand-router.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public no-boot production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            html="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?nobootv2=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${html}" | grep -q 'sonara-no-boot-edge-v2'; then
              echo "SONARA no-boot edge v2 is live."
              exit 0
            fi
            sleep 4
          done
          echo "SONARA no-boot v2 verification failed." >&2
          exit 1
