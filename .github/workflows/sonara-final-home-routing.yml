name: SONARA final root routing recovery - main worker
on:
  push:
    branches: [fix/sonara-black-screen-main-safe-20261109]
    paths: [.github/sonara-final-home-routing-trigger]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Switch only exact root routes from broken shell to sonara-enterprise
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,os,json,sys,re
          result={'success':False,'main_worker_code_unchanged':True,'api_routes_unchanged':True,'gpu_unchanged':True,'routes':[]}
          def report(stage,rc):
            result['stage']=stage
            with open('.github/sonara-final-home-routing-result.json','w') as f:json.dump(result,f,indent=2)
            print('SONARA_FINAL_HOME='+json.dumps(result),flush=True)
            sys.exit(rc)
          token=os.getenv('CF_TOKEN','')
          if not token:report('CLOUDFLARE_TOKEN_MISSING',1)
          def cf(path,method='GET',data=None):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+token,'Accept':'application/json','Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=24) as r:return json.load(r)
            except urllib.error.HTTPError as e:return {'success':False,'http':e.code}
            except Exception as e:return {'success':False,'error':type(e).__name__}
          zone=next((z for z in cf('/zones?name=sonaraenterprise.com&per_page=5').get('result',[]) if z.get('name')=='sonaraenterprise.com'),None)
          if not zone:report('ZONE_MISSING',1)
          prefix='/zones/'+zone['id']+'/workers/routes'
          existing=cf(prefix)
          if not existing.get('success'):report('ROUTES_READ_FAILED',1)
          expected={'sonaraenterprise.com','www.sonaraenterprise.com'}
          for host in expected:
            matches=[r for r in existing.get('result',[]) if r.get('pattern') in (host,host+'/')]
            if len(matches)!=1:report('EXACT_ROUTE_AMBIGUOUS',1)
            r=matches[0]
            if r.get('script') not in ('sonara-enterprise','sonara-remix-pro-contract-v4-shell'):
              result['unknown_script']=str(r.get('script'))[:100]
              report('UNKNOWN_WORKER_REFUSED',1)
            result['routes'].append({'host':host,'id':r.get('id'),'pattern':r.get('pattern'),'previous_script':r.get('script')})
          for route in result['routes']:
            if route['previous_script']=='sonara-enterprise':continue
            response=cf(prefix+'/'+route['id'],'PUT',{'pattern':route['pattern'],'script':'sonara-enterprise'})
            if response.get('success') is not True:
              result['route_failure_http']=response.get('http')
              report('ROUTE_REASSIGNMENT_FAILED',1)
          for row in result['routes']:
            url='https://'+row['host']+'/'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=20) as r:
                html=r.read(50000).decode('utf8','replace')
                code=r.status
              row['http']=code
              row['html_bytes']=len(html)
              row['bundle']=re.search(r'/assets/index-[A-Za-z0-9_-]+\.js',html).group(0) if re.search(r'/assets/index-[A-Za-z0-9_-]+\.js',html) else ''
              row['healthy_html']=code==200 and 1000<len(html)<12000 and row['bundle']=='/assets/index-CVPmYcq7.js'
            except urllib.error.HTTPError as e:row['http']=e.code;row['healthy_html']=False
            except Exception as e:row['error']=type(e).__name__;row['healthy_html']=False
          result['success']=all(r.get('healthy_html') for r in result['routes'])
          report('HEALTHY_MAIN_HOME_RETURNED' if result['success'] else 'ROOT_ROUTE_UPDATED_CHECK_FRONTEND',0 if result['success'] else 1)
          PY
      - name: Save status to GitHub
        if: always()
        run: |
          python3 - <<'PY'
          import json,base64,os,urllib.request
          p='.github/sonara-final-home-routing-result.json'
          if not os.path.isfile(p):raise SystemExit(0)
          payload={'message':'ops: record root home recovery from shell to primary Worker','branch':os.environ['GITHUB_REF_NAME'],'content':base64.b64encode(open(p,'rb').read()).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+p,method='PUT',data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=25) as r:print('SONARA_REPORT_SAVED='+str(r.status))
          except Exception as e:print('SONARA_REPORT_ERROR='+type(e).__name__)
          PY
