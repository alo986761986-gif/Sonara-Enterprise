name: Deploy SONARA Rich Arrangement V13

on:
  push:
    branches:
      - main
    paths:
      - "scripts/patch-rich-arrangement-v13.py"
      - "cloudflare/sonara-rich-arrangement-v13.test.mjs"
      - ".github/workflows/deploy-rich-arrangement-v13.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonara-rich-arrangement-v13-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Activate genre-rich instrumentation and FX without slowing Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply Rich Arrangement V13
        run: python scripts/patch-rich-arrangement-v13.py

      - name: Validate prompt engine, router and multi-genre richness
        run: |
          node --check cloudflare/sonara-engine-v15-authoritative-prompt.mjs
          node --check cloudflare/sonara-molab-xl-router.mjs
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node cloudflare/sonara-rich-arrangement-v13.test.mjs
          node scripts/verify-quality-latency-v14.mjs
          grep -q "sonara-rich-arrangement-v13" cloudflare/sonara-engine-v15-authoritative-prompt.mjs
          grep -q "sonara-rich-arrangement-v13" cloudflare/sonara-molab-xl-router.mjs
          grep -q "FX/SOUND DESIGN" cloudflare/sonara-engine-v15-authoritative-prompt.mjs
          grep -q "sectionDensityIntelligence" cloudflare/sonara-engine-v15-authoritative-prompt.mjs

      - name: Install production dependencies
        run: npm install

      - name: Build production assets
        run: npm run build

      - name: Load and verify current MoLab RTX endpoint
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/molab-xl-trigger"
          url="$(sed -n 's/^SONARA_MOLAB_XL_URL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          model="$(sed -n 's/^MODEL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          [[ "${url}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]] || [ "${url%/}" = "https://molab.sonaraenterprise.com" ]
          test "${model}" = "acestep-v15-xl-turbo"
          test "${mode}" = "MOLAB_XL_ONLY"
          echo "MOLAB_XL_URL=${url%/}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 8); do
            health="$(curl -fsS --connect-timeout 8 --max-time 15 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "${url%/}/health" || true)"
            if [[ -n "${health}" ]] && printf '%s' "${health}" | jq -e '
              def d: (.data // .);
              (((d.status // "") | tostring | ascii_downcase) | IN("ok","ready","healthy","online","success")) and
              ((d.models_initialized // true) == true) and
              (((d.loaded_model // d.default_model // d.model // "acestep-v15-xl-turbo") | tostring) | contains("acestep-v15-xl-turbo"))
            ' >/dev/null 2>&1; then
              echo "MoLab XL-Turbo healthy: ${url%/}"
              exit 0
            fi
            echo "MoLab health attempt ${attempt}/8"
            sleep 4
          done
          echo "MoLab RTX endpoint not ready." >&2
          exit 1

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Bind RTX endpoint and deploy production Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${MOLAB_XL_URL}" | npx --yes wrangler@latest secret put SONARA_MOLAB_XL_URL --config wrangler.jsonc
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify live richness and V14.1 speed contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            response="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?rich=v13-${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '
              .ready == true and
              .profile == "sonara-molab-xl-only-v1" and
              .provider == "molab" and
              .model == "acestep-v15-xl-turbo" and
              .richArrangementProfile == "sonara-rich-arrangement-v13" and
              .fullInstrumentation == true and
              .sectionDensityIntelligence == true and
              .soundEffectsIntelligence == true and
              .humanPerformanceIntelligence == true and
              .qualityInferenceSteps == 2 and
              .fastInferenceSteps == 1 and
              .ultraInferenceSteps == 8 and
              .maxBatchSize == 2 and
              .kaggleEnabled == false
            ' >/dev/null 2>&1; then
              printf '%s\n' "${response}" | jq '{ready, profile, fidelityProfile, richArrangementProfile, fullInstrumentation, sectionDensityIntelligence, soundEffectsIntelligence, humanPerformanceIntelligence, provider, model, realMusicReady, fastInferenceSteps, qualityInferenceSteps, ultraInferenceSteps, maxBatchSize}'
              echo "SONARA Rich Arrangement V13 live with V14.1 Quality speed preserved."
              exit 0
            fi
            echo "Rich V13 production verification ${attempt}/15"
            printf '%s\n' "${response}" | jq -c '{ready, profile, richArrangementProfile, fullInstrumentation, sectionDensityIntelligence, soundEffectsIntelligence, humanPerformanceIntelligence, qualityInferenceSteps, healthError}' 2>/dev/null || true
            sleep 4
          done
          echo "Rich Arrangement V13 did not verify in production." >&2
          exit 1

      - name: Persist patched production source on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sonara-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-engine-v15-authoritative-prompt.mjs cloudflare/sonara-molab-xl-router.mjs
          if git diff --cached --quiet; then
            echo "Production source already persisted."
            exit 0
          fi
          git commit -m "feat: activate rich arrangement v13 in production engine"
          for attempt in 1 2; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" = 2 ]; then
              echo "Could not persist patched source after deployment." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
