name: Apply Music Cover A B V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-music-cover-ab-v1.py"
      - ".github/workflows/apply-music-cover-ab-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-music-cover-ab-v2
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply A B cover integration
        run: python scripts/patch-music-cover-ab-v1.py
      - name: Install dependencies
        run: npm install
      - name: Build production
        run: npm run build
      - name: Guard integrated cover feature
        run: |
          grep -Fq "'/api/music-cover/generate'" src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'GENERA A + B · AUDIO + COVER' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'SCARICA COVER' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'RIGENERA COPERTINA' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'primaryImageUrl' src/services/generatedAssetVault.ts
          grep -Fq 'coverUrl' src/components/player/SonaraProfessionalFixedPlayer.tsx
          grep -Fq 'coverUrl' src/components/player/SonaraUniversalPlayerBridge.tsx
      - name: Publish source changes
        run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/generator/ElevenMusicGenerationControl.tsx src/services/generatedAssetVault.ts src/components/player/SonaraProfessionalFixedPlayer.tsx src/components/player/SonaraUniversalPlayerBridge.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cover): generate A B artwork with music"
          git push origin main
