name: Deploy SONARA No-Boot Edge Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/sonara-no-boot-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-no-boot-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Remove legacy boot and publish landing immediately
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Patch startup overlays out at the edge
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'cloudflare/sonara-brand-router.mjs';
          let source = fs.readFileSync(path, 'utf8');

          const headerNeedle = 'const HEADER_BRAND_SCRIPT = `<script id="sonara-header-brand-v5-safe">';
          const headerReplacement = 'const HEADER_BRAND_SCRIPT = `<style id="sonara-no-boot-edge-v1">[aria-label="SONARA boot animation"],[data-sonara-boot="active"]{display:none!important;opacity:0!important;pointer-events:none!important}</style><script id="sonara-header-brand-v5-safe">';
          if (!source.includes(headerNeedle)) throw new Error('SONARA header brand marker not found');
          source = source.replace(headerNeedle, headerReplacement);

          const delayedRelease = 'setTimeout(releaseBoot,2700);';
          const immediateRelease = `const removeLegacyAuthSplash=()=>{const root=document.getElementById('root');if(!root)return;[...root.children].forEach(el=>{if(!(el instanceof HTMLElement))return;const txt=(el.textContent||'').replace(/\\s+/g,' ').trim();if(el.classList.contains('min-h-screen')&&el.classList.contains('items-center')&&el.classList.contains('justify-center')&&txt.includes('SONARA')&&txt.includes('ENTERPRISE')){el.style.display='none';el.style.pointerEvents='none';}})};const killStartup=()=>{releaseBoot();removeLegacyAuthSplash();};killStartup();new MutationObserver(killStartup).observe(document.documentElement,{childList:true,subtree:true});[0,16,50,100,250,500,1000,1500,3000].forEach(ms=>setTimeout(killStartup,ms));`;
          if (!source.includes(delayedRelease)) throw new Error('Legacy delayed boot release marker not found');
          source = source.replace(delayedRelease, immediateRelease);

          fs.writeFileSync(path, source);
          NODE

          grep -q 'sonara-no-boot-edge-v1' cloudflare/sonara-brand-router.mjs
          ! grep -q 'setTimeout(releaseBoot,2700)' cloudflare/sonara-brand-router.mjs
          node --check cloudflare/sonara-brand-router.mjs

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify live SONARA no-boot edge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            site_html="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?noboot=${GITHUB_SHA}-${attempt}" || true)"
            site_headers="$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?noboot=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${site_html}" | grep -q 'sonara-no-boot-edge-v1' \
              && printf '%s' "${site_headers}" | grep -qi 'x-sonara-brand: sonic-s-v5'; then
              echo "SONARA no-boot edge hotfix is live."
              exit 0
            fi
            echo "SONARA no-boot propagation pending (${attempt}/18)."
            sleep 4
          done
          echo "SONARA no-boot public verification failed." >&2
          exit 1
