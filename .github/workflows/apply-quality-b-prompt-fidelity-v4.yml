name: Apply QUALITY B Prompt Fidelity V5

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-b-prompt-fidelity-v4.py"
      - ".github/workflows/apply-quality-b-prompt-fidelity-v4.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-quality-b-prompt-fidelity-v4.py
      - run: node --check cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: node --check cloudflare/sonara-molab-xl-router.mjs
      - run: grep -Fq 'QUALITY SAME-PROMPT CONTRACT' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'qualitySamePromptPair' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq "clamp(0.74 + controls.weirdness * 0.0006, 0.77, 0.74, 0.80)" cloudflare/sonara-molab-xl-router.mjs
      - run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-quality-ultra-stability-guard.mjs cloudflare/sonara-molab-xl-router.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quality): keep B on the exact same prompt brief"
          git push origin HEAD:main
