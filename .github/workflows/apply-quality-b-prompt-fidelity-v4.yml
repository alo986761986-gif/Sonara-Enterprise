name: Apply QUALITY B Prompt Fidelity V4

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-b-prompt-fidelity-v4.py"
      - ".github/workflows/apply-quality-b-prompt-fidelity-v4.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-quality-b-prompt-fidelity-v4.py
      - run: node --check cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'FINAL PROMPT FIDELITY CONTRACT' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'PROMPT FIDELITY ALWAYS WINS' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-quality-ultra-stability-guard.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quality): make Song B faithful to the exact creator prompt"
          git push origin HEAD:main
