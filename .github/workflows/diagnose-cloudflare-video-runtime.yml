name: Diagnose SONARA Cloudflare Video Runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-cloudflare-video-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Cloudflare Worker secret names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: List Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name sonara-enterprise-web --format json > /tmp/sonara-worker-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/sonara-worker-secrets.json', 'utf8'));
          const names = (Array.isArray(payload) ? payload : [])
            .map(item => String(item?.name || ''))
            .filter(Boolean)
            .sort();
          console.log(`SONARA_CLOUDFLARE_SECRET_COUNT=${names.length}`);
          for (const name of names) console.log(`SONARA_CLOUDFLARE_SECRET_NAME=${name}`);
          NODE
