name: SONARA Remix Pro - Publish New React V3 Design Safely
on:
  push:
    branches: [feature/remix-pro-automatic-random-duration-nov09]
    paths: ['.github/workflows/publish-sonara-remix-pro-v3-design.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sonara-remix-v3-production-ui
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install frontend build dependencies
        run: npm install --no-audit --no-fund
      - name: Build dedicated real React Remix Pro V3 UI and verify duration
        run: |
          npx tsx --test src/components/remix/remixDuration.test.ts
          npx vite build --config vite.remixpro.config.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const js=fs.readFileSync('dist-remix-v3/sonara-remix-v3.js','utf8');
          const css=fs.readFileSync('dist-remix-v3/sonara-remix-v3.css','utf8');
          if(js.length<10000||!js.includes('Due brani.')||!js.includes('Una nuova identità.')||
             !js.includes('sonara-remix-pro-v3')||!js.includes('expectedDurationSec')||
             !css.includes('sonara-pro-v3__hero'))throw Error('New React V3 build missing functionality');
          if(js.match(/<\/script/i)||css.match(/<\/style/i))
            throw Error('Unsafe inline script/style close tag in build');
          console.log('SONARA_V3_STANDALONE_BUILD',JSON.stringify({
            jsBytes:js.length,cssBytes:css.length,correctReactUI:true}));
          NODE
      - name: Prepare staging Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Stage actual React V3 bundle, verify browser and publish with full route rollback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          if(token.length<20)throw Error('Cloudflare token unavailable; no changes');
          const accountEnv=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const base='https://api.cloudflare.com/client/v4';
          const auth={Authorization:'Bearer '+token};
          const must=(condition,msg)=>{if(!condition)throw Error(msg)};
          const api=async (path,method='GET',value)=>{
            const response=await fetch(base+path,{
              method,headers:{...auth,...(value===undefined?{}:{'Content-Type':'application/json'})},
              ...(value===undefined?{}:{body:JSON.stringify(value)}),
              signal:AbortSignal.timeout(25000)
            });
            const body=await response.json().catch(()=>({}));
            must(response.ok&&body.success!==false,
              'Cloudflare '+method+' HTTP '+response.status+' codes '+
              (body.errors||[]).map(x=>x.code).slice(0,3).join(','));
            return body.result;
          };
          const zone=(await api('/zones?name=sonaraenterprise.com&per_page=20'))?.
            find(z=>z.name==='sonaraenterprise.com');
          must(zone,'SONARA zone missing');
          const account=accountEnv||zone.account?.id;
          must(account,'Cloudflare account missing');
          const routesPath='/zones/'+zone.id+'/workers/routes';
          const prodPath='/accounts/'+account+'/workers/scripts/sonara-enterprise/deployments';
          const production=(await api(prodPath)).deployments?.[0]?.versions?.[0]?.version_id;
          must(production,'Live main Worker revision not available');
          const source='sonara-remix-auto-duration-shell-v2';
          const next='sonara-remix-pro-design-v3-shell';
          const patterns=['sonaraenterprise.com','sonaraenterprise.com/studio',
            'sonaraenterprise.com/remix','www.sonaraenterprise.com',
            'www.sonaraenterprise.com/studio','www.sonaraenterprise.com/remix'];
          const current=await api(routesPath);
          const originals=patterns.map(pattern=>current.find(r=>r.pattern===pattern));
          must(originals.every(x=>x&&x.script===source),
            'Some public routes do not point to the expected V2 shell; no changes');
          must(current.some(x=>x.pattern==='sonaraenterprise.com/*'&&x.script==='sonara-enterprise'),
            'SONARA main wildcard Worker route missing');
          const pro=async()=>{
            const response=await fetch('https://api.sonaraenterprise.com/api/sonara-relay/pro-capabilities',{
              signal:AbortSignal.timeout(17000),headers:{'Cache-Control':'no-store'}
            });
            must(response.ok,'Remix Pro capabilities unreachable');
            const cap=await response.json();
            must(cap.available===true&&cap.fusionAvailable===true&&
              cap.expectedAgentRevision==='sonara-remix-pro-r2-agent-v3-dual-reference-fusion',
              'Current Remix Pro V3 engine unavailable');
          };
          await pro();
          const home=await fetch('https://sonaraenterprise.com/',{
            headers:{Accept:'text/html','Cache-Control':'no-store'},
            signal:AbortSignal.timeout(20000)
          });
          const html=await home.text();
          must(home.ok&&home.headers.get('x-sonara-duration-shell')==='auto-v2'&&
            html.length>3000&&html.length<90000,'Unexpected live HTML; no changes');
          const old=/<script\b[^>]*id=["']sonara-remix-auto-duration-v2["'][^>]*>[\s\S]*?<\/script>/gi;
          must([...html.matchAll(old)].length===1,
            'Expected single old V2 script not present');
          const js=fs.readFileSync('dist-remix-v3/sonara-remix-v3.js','utf8');
          const css=fs.readFileSync('dist-remix-v3/sonara-remix-v3.css','utf8');
          const injected='<style id="sonara-remix-pro-v3-styles">'+css+'</style>'+
            '<script type="module" id="sonara-remix-pro-v3-app">'+js+'</script>';
          const patched=html.replace(old,'').replace(/<\/head>/i,injected+'</head>');
          must(patched.includes('sonara-remix-pro-v3-app')&&
            patched.includes('sonara-remix-pro-v3-styles')&&
            !patched.includes('sonara-remix-auto-duration-v2'),'V3 HTML patch mismatch');
          const csp=home.headers.get('content-security-policy')||'';
          const inline=/script-src(?:-elem)?\s+([^;]+)/i.exec(csp)?.[1]||'';
          must(!inline||inline.includes("'unsafe-inline'"),
            'Inline scripts prohibited by current live CSP');
          const headers={
            'content-type':'text/html; charset=UTF-8',
            'cache-control':'no-store, max-age=0',
            'x-content-type-options':'nosniff',
            'x-sonara-remix-pro-ui':'react-v3'
          };
          for(const h of ['content-security-policy','permissions-policy',
            'strict-transport-security','referrer-policy','x-frame-options']){
            const value=home.headers.get(h);
            if(value)headers[h]=value;
          }
          const worker=[
            'const html='+JSON.stringify(patched)+';',
            'const headers='+JSON.stringify(headers)+';',
            'export default {async fetch(req){',
            'const path=new URL(req.url).pathname;',
            "if(req.method!=='GET'&&req.method!=='HEAD')return new Response('Method not allowed',{status:405});",
            "if(!['/','/index.html','/studio','/remix'].includes(path))return new Response('Not found',{status:404});",
            "return new Response(req.method==='HEAD'?null:html,{status:200,headers});",
            '}};'
          ].join('\n');
          const form=new FormData();
          form.set('metadata',new Blob([JSON.stringify({
            main_module:'remix-v3-shell.mjs',compatibility_date:'2026-08-23',
            annotations:{'workers/message':'SONARA isolated real React V3 Remix Pro UI; main backend unchanged'}
          })],{type:'application/json'}),'metadata.json');
          form.set('remix-v3-shell.mjs',
            new Blob([worker],{type:'application/javascript+module'}),'remix-v3-shell.mjs');
          const uploaded=await fetch(base+'/accounts/'+account+'/workers/scripts/'+next,{
            method:'PUT',headers:auth,body:form,signal:AbortSignal.timeout(35000)
          });
          const upload=await uploaded.json().catch(()=>({}));
          must(uploaded.ok&&upload.success!==false,'Isolated V3 Worker staging upload failed HTTP '+
            uploaded.status+' '+JSON.stringify((upload.errors||[]).map(e=>e.code)));
          await api('/accounts/'+account+'/workers/scripts/'+next+'/subdomain',
            'POST',{enabled:true,previews_enabled:false});
          const subdomain=(await api('/accounts/'+account+'/workers/subdomain'))?.subdomain;
          must(/^[a-z0-9-]+$/.test(subdomain||''),'Cloudflare staging subdomain absent');
          const stage='https://'+next+'.'+subdomain+'.workers.dev/';
          let stageValid=false;
          for(let attempt=0;attempt<6;attempt++){
            if(attempt)await new Promise(resolve=>setTimeout(resolve,2100));
            const response=await fetch(stage+'?check='+attempt,{
              headers:{'Cache-Control':'no-store'},signal:AbortSignal.timeout(18000)
            });
            const body=await response.text();
            stageValid=response.ok&&response.headers.get('x-sonara-remix-pro-ui')==='react-v3'&&body===patched;
            console.log('SONARA_V3_STAGE',JSON.stringify({attempt:attempt+1,http:response.status,
              newReact:body.includes('sonara-remix-pro-v3-app'),matched:stageValid}));
            if(stageValid)break;
          }
          must(stageValid,'Staging response differs from built React V3');
          // Test the actual built module by injecting a synthetic legacy mount on
          // the staged public login page. Never sign in, upload, or create music.
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',err=>errors.push(String(err.message||err).slice(0,180)));
            const response=await page.goto(stage,{waitUntil:'domcontentloaded',timeout:35000});
            must(response?.ok(),'Staged V3 homepage failed in Chromium');
            await page.evaluate(()=>{
              const old=document.createElement('div');
              old.className='sonara-remix-pro';
              old.textContent='OLD REMIX PRO LEGACY';
              document.body.appendChild(old);
            });
            await page.waitForSelector('[data-testid="sonara-remix-pro-v3"]',{timeout:12000});
            const state=await page.evaluate(()=>{
              const panel=document.querySelector('[data-testid="sonara-remix-pro-v3"]');
              const old=document.querySelector('.sonara-remix-pro');
              return {
                newHeading:panel?.textContent?.includes('Due brani.'),
                bothUploads:!!panel?.querySelector('[data-testid="sonara-remix-pro-input-a"]')&&
                  !!panel?.querySelector('[data-testid="sonara-remix-pro-input-b"]'),
                automatic:!!panel?.querySelector('[data-testid="sonara-remix-pro-auto-duration"]'),
                noManual:!panel?.querySelector('input[type="range"][min="30"][max="480"]'),
                oldHidden:old?.style.display==='none',
                width:Math.round(panel?.getBoundingClientRect().width||0)
              };
            });
            console.log('SONARA_V3_BROWSER_STAGE',JSON.stringify({state,pageErrors:errors.slice(0,5)}));
            must(state.newHeading&&state.bothUploads&&state.automatic&&state.noManual&&
              state.oldHidden&&state.width>200,
              'Staged browser did not mount usable new React Remix Pro panel');
            await page.close();
          }finally{await browser.close();}
          must((await api(prodPath)).deployments?.[0]?.versions?.[0]?.version_id===production,
            'Main Worker changed during staging');
          const pre=await api(routesPath);
          must(patterns.every((pattern,i)=>pre.some(r=>r.id===originals[i].id&&
            r.pattern===pattern&&r.script===source)),
            'Live routes changed while staging; no changes');
          const changed=[];
          let complete=false;
          try{
            for(const record of originals){
              await api(routesPath+'/'+record.id,'PUT',{pattern:record.pattern,script:next});
              changed.push(record);
            }
            await new Promise(resolve=>setTimeout(resolve,4500));
            for(const url of ['https://sonaraenterprise.com/','https://sonaraenterprise.com/studio',
              'https://sonaraenterprise.com/remix','https://www.sonaraenterprise.com/']){
              let valid=false;
              for(let attempt=0;attempt<5;attempt++){
                const response=await fetch(url,{headers:{Accept:'text/html','Cache-Control':'no-store'},
                  signal:AbortSignal.timeout(18000)});
                const body=await response.text();
                valid=response.ok&&response.headers.get('x-sonara-remix-pro-ui')==='react-v3'&&
                  body.includes('sonara-remix-pro-v3-app')&&
                  !body.includes('sonara-remix-auto-duration-v2');
                console.log('SONARA_V3_LIVE',JSON.stringify({url,attempt:attempt+1,
                  status:response.status,verified:valid}));
                if(valid)break;
                await new Promise(resolve=>setTimeout(resolve,1650));
              }
              must(valid,'V3 new React UI not available at '+url);
            }
            await pro();
            const health=await fetch('https://api.sonaraenterprise.com/api/health',{
              signal:AbortSignal.timeout(17000)
            });
            must(health.ok,'Main SONARA API health not OK');
            must((await api(prodPath)).deployments?.[0]?.versions?.[0].version_id===production,
              'Current V3 backend Worker changed');
            const final=await api(routesPath);
            must(patterns.every((pattern,i)=>final.some(r=>r.id===originals[i].id&&
              r.pattern===pattern&&r.script===next)),'One of six V3 UI routes did not update');
            complete=true;
            console.log('SONARA_V3_UI_RELEASE',JSON.stringify({published:true,
              newReactUI:true,autoDuration:true,routeCount:patterns.length,
              originalBackendPreserved:true,liveRemixProV3:true,
              browserVerified:true}));
          }finally{
            if(!complete){
              for(const record of changed.reverse()){
                await api(routesPath+'/'+record.id,'PUT',{pattern:record.pattern,script:source});
              }
              const after=await api(routesPath);
              must(patterns.every((pattern,i)=>after.some(r=>r.id===originals[i].id&&
                r.script===source)),'CRITICAL: V3 UI rollback incomplete');
              console.log('SONARA_V3_UI_RELEASE',JSON.stringify({rolledBack:true}));
            }
          }
          NODE
