name: Deploy Firebase Storage Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-storage-rules.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_d9jPexmsm0saAlZPAznj0TTy
      VERCEL_PROJECT_ID: prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pull Firebase credentials from SONARA Vercel production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}"
          npm install -g vercel@latest >/dev/null
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_d9jPexmsm0saAlZPAznj0TTy","projectId":"prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ"}' > .vercel/project.json
          vercel env pull /tmp/sonara-production.env --environment=production --yes --token="${VERCEL_TOKEN}" >/dev/null
          set -a
          source /tmp/sonara-production.env
          set +a
          firebase_project_id="${SONARA_FIREBASE_PROJECT_ID:-${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-}}}"
          firebase_service_account="${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
          if [[ -z "${firebase_project_id}" ]]; then
            echo "Firebase project ID missing from Vercel production environment." >&2
            exit 1
          fi
          if [[ -z "${firebase_service_account}" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON missing from Vercel production environment." >&2
            exit 1
          fi
          printf '%s' "${firebase_service_account}" > /tmp/firebase-service-account.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/firebase-service-account.json','utf8')); if(!p.project_id||!p.client_email||!p.private_key) process.exit(1);"
          echo "::add-mask::${firebase_project_id}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json" >> "${GITHUB_ENV}"
          echo "FIREBASE_PROJECT_ID=${firebase_project_id}" >> "${GITHUB_ENV}"
          rm -f /tmp/sonara-production.env

      - name: Validate Storage rules locally
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "match /video-ai-inputs/{uid}/{allPaths=**}" storage.rules
          grep -Fq "request.auth.uid == uid" storage.rules
          grep -Fq "request.resource.contentType.matches('audio/.*')" storage.rules
          grep -Fq '"rules": "storage.rules"' firebase.json

      - name: Deploy Firebase Storage rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only storage --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Cleanup credential files
        if: always()
        run: rm -f /tmp/firebase-service-account.json /tmp/sonara-production.env
