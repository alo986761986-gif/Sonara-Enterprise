name: Smoke SONARA Music V18 Fast HQ

on:
  push:
    paths:
      - '.github/music-v18-smoke-trigger'
      - '.github/workflows/smoke-music-v18.yml'

permissions:
  contents: read

jobs:
  smoke-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ORIGIN: https://api.sonaraenterprise.com
      SONARA_INTERNAL_PROXY_SECRET: ${{ secrets.SONARA_INTERNAL_PROXY_SECRET }}
    steps:
      - name: Submit real V18 generation
        shell: bash
        run: |
          set -euo pipefail
          auth=()
          if [[ -n "${SONARA_INTERNAL_PROXY_SECRET:-}" ]]; then
            auth=(-H "X-Sonara-Internal-Secret: ${SONARA_INTERNAL_PROXY_SECRET}")
          fi
          printf '%s' '{"title":"SONARA V18 Production Smoke","genreFamily":"Electronic","genre":"House","subgenre":"Deep House","mood":"Deep, dark, emotional, hypnotic","prompt":"Professional deep house instrumental, warm analog chords, deep controlled sub bass, tight club kick, subtle percussion, evolving atmospheric textures, polished modern studio mix.","lyrics":"","vocalMode":"instrumental","bpm":122,"durationSec":30,"weirdness":55,"styleInfluence":88,"sonaraFastHq":true,"speedProfile":"fast-hq-single-master","candidateCount":1}' > /tmp/request.json
          http_code="$(curl -sS --max-time 300 -o /tmp/start.json -w '%{http_code}' -H 'Content-Type: application/json' "${auth[@]}" -X POST "$API_ORIGIN/api/engine/generate" --data-binary @/tmp/request.json || true)"
          echo "V18 submit HTTP ${http_code}"
          cat /tmp/start.json || true
          echo
          if [[ "$http_code" != '202' && "$http_code" != '200' ]]; then exit 1; fi
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/start.json','utf8'));if(!r.jobId)throw new Error('No V18 jobId');if(r.sonaraMusicV18!==true)throw new Error('V18 marker missing');if(r.metadata?.stateTransport!=='job-id-direct-task')throw new Error('Stateless transport missing');console.log('SONARA_V18_JOB_ID='+r.jobId)" >> "$GITHUB_ENV"

      - name: Poll V18 until completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            code="$(curl -sS --max-time 45 -o /tmp/job.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$API_ORIGIN/api/music/job/$SONARA_V18_JOB_ID?attempt=$attempt" || true)"
            echo "--- attempt ${attempt} HTTP ${code} ---"
            cat /tmp/job.json 2>/dev/null || true
            echo
            if [[ "$code" == '200' ]]; then
              status="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/job.json','utf8'));process.stdout.write(String(r.status||''))" 2>/dev/null || true)"
              if [[ "$status" == 'COMPLETED' ]]; then
                node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/job.json','utf8'));if(!r.audioUrl)throw new Error('COMPLETED without audioUrl');if(r.sonaraMusicV18!==true)throw new Error('V18 marker lost');console.log('V18 COMPLETED with audio: '+r.audioUrl)"
                exit 0
              fi
              if [[ "$status" == 'FAILED' ]]; then exit 1; fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for V18.' >&2
          exit 1
