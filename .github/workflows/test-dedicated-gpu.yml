name: Validate SONARA Dedicated GPU

on:
  push:
    branches:
      - feature/sonara-dedicated-rtxpro6000-20261022
  pull_request:
    paths:
      - "cloudflare/**"
      - "api/billing/**"
      - "scripts/sonara-dedicated-secure-gateway.py"
      - "scripts/test-sonara-dedicated-secure-gateway.py"
      - "deploy/dedicated-gpu/**"
      - "wrangler.jsonc"
      - ".github/workflows/test-dedicated-gpu.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Authenticated generation / signed audio / infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Python gateway API tests
        run: |
          python -m py_compile scripts/sonara-dedicated-secure-gateway.py
          python scripts/test-sonara-dedicated-secure-gateway.py -v

      - name: Worker generation and HMAC audio tests
        run: |
          node --check cloudflare/sonara-molab-xl-router.mjs
          node --check cloudflare/sonara-yue-router.mjs
          node --check cloudflare/sonara-real-music-v3-edge.mjs
          node --test cloudflare/sonara-dedicated-gpu.test.mjs

      - name: Infrastructure and fail-closed routing contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/dedicated-gpu/bootstrap.sh
          bash -n deploy/dedicated-gpu/check-cutover.sh
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const worker = fs.readFileSync('cloudflare/sonara-molab-xl-router.mjs', 'utf8');
          const billing = fs.readFileSync('api/billing/[...path].ts', 'utf8');
          const job = fs.readFileSync('api/billing/job.ts', 'utf8');
          const wrangler = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const compose = fs.readFileSync('deploy/dedicated-gpu/docker-compose.yml','utf8');
          assert.equal(wrangler.vars.SONARA_DEDICATED_GPU_ONLY, 'true');
          assert(worker.includes('env.SONARA_DEDICATED_GPU_URL'));
          assert(worker.includes('verifySignedAudioUrl(url, env)'));
          assert(!worker.includes('env.SONARA_MOLAB_XL_URL'));
          assert(billing.includes('DEDICATED_GPU_PROXY_NOT_CONFIGURED'));
          assert(billing.includes("provider: 'dedicated_gpu'"));
          assert(job.includes('gpu_'));
          assert(compose.includes('127.0.0.1:8001:8001'));
          assert(compose.includes('acestep-v15-xl-turbo'));
          assert(compose.includes('acestep-5Hz-lm-4B'));
          console.info('Dedicated GPU fail-closed preflight passed');
          NODE
