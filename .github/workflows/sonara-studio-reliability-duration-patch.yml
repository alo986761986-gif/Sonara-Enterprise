name: SONARA Studio Reliability Duration Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sonara-studio-reliability-duration-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply production reliability hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} marker missing')
              return text.replace(old, new, 1)

          # 1) Missing BPM must be neutral for stems, never interpreted as BPM 0.
          qp = Path('cloudflare/sonara-audio-quality-engine.mjs')
          q = qp.read_text()
          q = replace_once(q,
              "const db = value => value > 0 ? 20 * Math.log10(value) : -120;",
              """const db = value => value > 0 ? 20 * Math.log10(value) : -120;
          const optionalBpm = value => {
            if (value === null || value === undefined || String(value).trim() === '') return null;
            const number = Number(value);
            return Number.isFinite(number) && number >= BPM_MIN && number <= BPM_MAX ? number : null;
          };""",
              'optionalBpm')
          q = replace_once(q, 'const requested = Number(requestedBpm);', 'const requested = optionalBpm(requestedBpm);', 'detectBpm optional')
          q = replace_once(q,
              """  const requestedBpm = Number(requested.bpm);
            const bpmError = Number.isFinite(requestedBpm) && bpmReport.detectedBpm
              ? Math.abs(bpmReport.detectedBpm - requestedBpm)
              : null;
            const bpmTolerance = Number.isFinite(requestedBpm) ? Math.max(2, requestedBpm * 0.015) : 3;
            const bpmPassed = bpmError === null ? false : bpmError <= bpmTolerance;

            let bpmPoints = bpmError === null ? 8 : clamp(35 - bpmError * 3.5, 0, 35);
            if (bpmPassed) bpmPoints = Math.max(bpmPoints, 32);""",
              """  const requestedBpm = optionalBpm(requested.bpm);
            const hasRequestedBpm = requestedBpm !== null;
            const bpmError = hasRequestedBpm && bpmReport.detectedBpm
              ? Math.abs(bpmReport.detectedBpm - requestedBpm)
              : null;
            const bpmTolerance = hasRequestedBpm ? Math.max(2, requestedBpm * 0.015) : null;
            const bpmPassed = !hasRequestedBpm ? null : (bpmError !== null && bpmError <= bpmTolerance);

            let bpmPoints = !hasRequestedBpm ? 35 : bpmError === null ? 8 : clamp(35 - bpmError * 3.5, 0, 35);
            if (bpmPassed === true) bpmPoints = Math.max(bpmPoints, 32);""",
              'quality BPM score')
          q = replace_once(q,
              'const hardGate = bpmPassed && metrics.clippingRatio < 0.001 && metrics.silenceRatio < 0.18 && metrics.peak > 0.15 && metrics.rms > 0.01;',
              'const hardGate = bpmPassed !== false && metrics.clippingRatio < 0.001 && metrics.silenceRatio < 0.18 && metrics.peak > 0.15 && metrics.rms > 0.01;',
              'quality hardGate')
          q = replace_once(q, 'bpmTolerance: round(bpmTolerance, 1),', 'bpmTolerance: bpmTolerance === null ? null : round(bpmTolerance, 1),', 'bpmTolerance output')
          q = replace_once(q, "requestedBpm: Number.isFinite(Number(requested.bpm)) ? Number(requested.bpm) : null,", "requestedBpm: optionalBpm(requested.bpm),", 'requestedBpm output')
          qp.write_text(q)

          # 2) Studio jobs use the already-bound Durable Object, with cache fallback.
          rp = Path('cloudflare/sonara-studio-ai-router.mjs')
          r = rp.read_text()
          state_rx = re.compile(r"async function saveState\(jobId, state\) \{.*?\n\}\n\nasync function loadState\(jobId\) \{.*?\n\}\n", re.S)
          state_code = """function studioStateStub(env, jobId) {
            try {
              const ns = env?.SONARA_JOB_STATE;
              if (!ns || typeof ns.idFromName !== 'function' || typeof ns.get !== 'function') return null;
              return ns.get(ns.idFromName(`studio-ai:${jobId}`));
            } catch { return null; }
          }

          async function saveState(jobId, state, env) {
            const stub = studioStateStub(env, jobId);
            if (stub) {
              try {
                const response = await stub.fetch('https://sonara.internal/state', {
                  method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state)
                });
                if (response.ok) return;
              } catch {}
            }
            try {
              await caches.default.put(stateRequest(jobId), new Response(JSON.stringify(state), {
                headers: { 'content-type': 'application/json', 'cache-control': `public, max-age=${STATE_TTL}` }
              }));
            } catch {}
          }

          async function loadState(jobId, env) {
            const stub = studioStateStub(env, jobId);
            if (stub) {
              try {
                const response = await stub.fetch('https://sonara.internal/state', { method: 'GET' });
                if (response.ok) return await response.json();
              } catch {}
            }
            try {
              const response = await caches.default.match(stateRequest(jobId));
              return response ? await response.json() : null;
            } catch { return null; }
          }
          """
          r, n = state_rx.subn(state_code, r, count=1)
          if n != 1: raise SystemExit(f'state replacement count={n}')
          r = r.replace('await saveState(jobId, state);', 'await saveState(jobId, state, env);')
          r = replace_once(r, 'const state = await loadState(jobId);', 'const state = await loadState(jobId, env);', 'loadState env')
          if r.count('await saveState(jobId, state, env);') < 2: raise SystemExit('saveState env replacements incomplete')

          # 3) Extend gets a real target-length WAV canvas; ACE-Step completes the padded tail.
          anchor = '\nasync function createStudioJob(request, env, operation) {'
          if anchor not in r: raise SystemExit('createStudioJob anchor missing')
          helpers = """
          async function mapWithConcurrency(items, limit, mapper) {
            const source = Array.from(items || []);
            const results = new Array(source.length);
            let cursor = 0;
            const workers = Array.from({ length: Math.max(1, Math.min(Number(limit) || 1, source.length || 1)) }, async () => {
              while (true) {
                const index = cursor++;
                if (index >= source.length) return;
                results[index] = await mapper(source[index], index);
              }
            });
            await Promise.all(workers);
            return results;
          }

          async function padWavInputToDuration(input, targetDurationSec) {
            if (!input?.blob) return input;
            const targetSeconds = Number(targetDurationSec);
            if (!Number.isFinite(targetSeconds) || targetSeconds <= 0) return input;
            const buffer = await input.blob.arrayBuffer();
            if (buffer.byteLength < 44) return input;
            const bytes = new Uint8Array(buffer);
            const view = new DataView(buffer);
            const ascii = (offset, length) => String.fromCharCode(...bytes.slice(offset, offset + length));
            if (ascii(0, 4) !== 'RIFF' || ascii(8, 4) !== 'WAVE') return input;
            let offset = 12, sampleRate = 0, blockAlign = 0, dataHeader = -1, dataOffset = -1, dataSize = 0;
            while (offset + 8 <= view.byteLength) {
              const id = ascii(offset, 4), size = view.getUint32(offset + 4, true), payload = offset + 8;
              if (id === 'fmt ' && payload + 16 <= view.byteLength) {
                sampleRate = view.getUint32(payload + 4, true); blockAlign = view.getUint16(payload + 12, true);
              }
              if (id === 'data') { dataHeader = offset; dataOffset = payload; dataSize = Math.max(0, Math.min(size, view.byteLength - payload)); break; }
              offset = payload + size + (size % 2);
            }
            if (!sampleRate || !blockAlign || dataHeader < 0 || dataOffset < 0) return input;
            const currentFrames = Math.floor(dataSize / blockAlign);
            const targetFrames = Math.ceil(targetSeconds * sampleRate);
            if (targetFrames <= currentFrames + Math.ceil(sampleRate * 0.05)) return input;
            const targetDataSize = targetFrames * blockAlign;
            const outputSize = dataOffset + targetDataSize;
            if (outputSize > MAX_UPLOAD_BYTES) throw new Error('Audio Extend troppo grande dopo il padding di continuazione.');
            const output = new Uint8Array(outputSize);
            output.set(bytes.slice(0, dataOffset + dataSize), 0);
            const out = new DataView(output.buffer);
            out.setUint32(4, output.byteLength - 8, true);
            out.setUint32(dataHeader + 4, targetDataSize, true);
            return { ...input, blob: new Blob([output], { type: 'audio/wav' }), filename: 'sonara-extend-source.wav', type: 'audio/wav' };
          }
          """
          r = r.replace(anchor, helpers + anchor, 1)

          start = r.find("    } else if (operation === 'complete') {")
          end = r.find("    } else if (operation === 'extract') {", start)
          if start < 0 or end < 0: raise SystemExit('complete operation block missing')
          block = r[start:end]
          block = replace_once(block,
              "      if (!sourceInput) throw new Error('Seleziona il materiale audio da completare.');",
              """      if (!sourceInput) throw new Error('Seleziona il materiale audio da completare.');
                const targetDuration = clamp(body.durationSec ?? body.duration ?? body.audio_duration, 60, 5, 600);
                const continuationInput = await padWavInputToDuration(sourceInput, targetDuration);""",
              'complete target duration')
          block = replace_once(block, '...commonPayload(body, BASE_MODEL),', '...commonPayload({ ...body, durationSec: targetDuration }, BASE_MODEL),', 'complete payload duration')
          block = replace_once(block, 'submitTask(baseUrl, env, payload, sourceInput, referenceInput)', 'submitTask(baseUrl, env, payload, continuationInput, referenceInput)', 'complete continuation input')
          block = block.replace('Complete the source arrangement with ${labels.join(\', \')}.', 'Continue the source through the full ${round(targetDuration, 2)} seconds and fill the silent tail musically with ${labels.join(\', \')}.', 1)
          r = r[:start] + block + r[end:]

          # 4) Avoid 12 simultaneous WAV analyzers exhausting the Worker.
          r = replace_once(r,
              'const qualityReports = await Promise.all(outputs.slice(0, 12).map(async (output, index) => {',
              'const qualityReports = await mapWithConcurrency(outputs.slice(0, 12), 2, async (output, index) => {',
              'quality concurrency opening')
          qstart = r.find('const qualityReports = await mapWithConcurrency')
          qend = r.find('const ranked = rankQualityReports(qualityReports);', qstart)
          if qstart < 0 or qend < 0: raise SystemExit('quality block bounds missing')
          segment = r[qstart:qend]
          segment, n = re.subn(r'\}\)\);\s*$', '});\n\n    ', segment, count=1)
          if n != 1: raise SystemExit('quality concurrency closing missing')
          r = r[:qstart] + segment + r[qend:]
          rp.write_text(r)

          # 5) Make the production canary strict: WAV + release gate + 12 distinct stems.
          cp = Path('scripts/sonara-real-music-e2e.mjs')
          c = cp.read_text()
          format_end = "  return 'unknown';\n}\n"
          idx = c.find(format_end)
          if idx < 0: raise SystemExit('audioFormat function end missing')
          insert_at = idx + len(format_end)
          strict_helpers = """
          function requireWavOutputs(urls, label, exactCount = null) {
            const formats = urls.map(audioFormatFromUrl);
            if (exactCount !== null && urls.length !== exactCount) throw new Error(`${label}: attesi ${exactCount} WAV, ricevuti ${urls.length}.`);
            if (!formats.length || formats.some(format => format !== 'wav')) throw new Error(`${label}: output non interamente WAV (${formats.join(', ')}).`);
          }

          function requireReleasePass(label, summary) {
            const snapshot = report.quality[label] || {};
            if (snapshot.endpointMeasured !== true) throw new Error(`${label}: Quality 2.0 non ha misurato il WAV reale in produzione.`);
            if (Number(summary?.passed || 0) < 1) throw new Error(`${label}: release gate 88 non superato (${snapshot.bestScore ?? 'n/a'}/100).`);
          }
          """
          c = c[:insert_at] + strict_helpers + c[insert_at:]
          c = replace_once(c,
              "    const baseSummary = await quality2(base, 'base-generation', { bpm: 122, key: 'A Minor', durationSec: 30 });",
              """    requireWavOutputs(base, 'base-generation', 2);
                const baseSummary = await quality2(base, 'base-generation', { bpm: 122, key: 'A Minor', durationSec: 30 });
                requireReleasePass('base-generation', baseSummary);""",
              'base strict')
          c = replace_once(c,
              "    await quality2([replaced[0]], 'replace', { bpm: 122, key: 'A Minor', durationSec: 30 });",
              """    requireWavOutputs(replaced, 'replace');
                const replaceSummary = await quality2([replaced[0]], 'replace', { bpm: 122, key: 'A Minor', durationSec: 30 });
                requireReleasePass('replace', replaceSummary);""",
              'replace strict')
          c = replace_once(c,
              "    await quality2([extended[0]], 'extend', { bpm: 122, key: 'A Minor', durationSec: 45 });",
              """    requireWavOutputs(extended, 'extend');
                const extendSummary = await quality2([extended[0]], 'extend', { bpm: 122, key: 'A Minor', durationSec: 45 });
                requireReleasePass('extend', extendSummary);""",
              'extend strict')
          c = replace_once(c,
              "    if (stems.length < 2) report.diagnostics.push(`Stems Pro: ${stems.length} URL audio direttamente enumerabili; verificare eventuale bundle/metadata multi-stem.`);",
              """    requireWavOutputs(stems, 'Stems Pro', 12);
                const expectedStemLabels = ['Vocals','Drums','Bass','Guitar','Keys','Synth','Strings','Brass','Woodwinds','Percussion','Pads','FX'];
                const stemLabels = (report.outputs['stems-pro']?.qualityJudge?.reports || []).map(item => String(item?.label || '')).filter(Boolean);
                const missingLabels = expectedStemLabels.filter(label => !stemLabels.includes(label));
                if (missingLabels.length) throw new Error(`Stems Pro: stem distinti mancanti: ${missingLabels.join(', ')}.`);""",
              'stems strict')
          cp.write_text(c)
          PY

          node --check cloudflare/sonara-audio-quality-engine.mjs
          node --check cloudflare/sonara-studio-ai-router.mjs
          node --check scripts/sonara-real-music-e2e.mjs
          node --test cloudflare/sonara-studio-v2-contract.test.mjs
          git diff --check
          grep -q 'studioStateStub' cloudflare/sonara-studio-ai-router.mjs
          grep -q 'padWavInputToDuration' cloudflare/sonara-studio-ai-router.mjs
          grep -q 'mapWithConcurrency(outputs.slice(0, 12), 2' cloudflare/sonara-studio-ai-router.mjs
          grep -q 'const optionalBpm' cloudflare/sonara-audio-quality-engine.mjs
          grep -q "requireReleasePass('extend'" scripts/sonara-real-music-e2e.mjs
          grep -q "requireWavOutputs(stems, 'Stems Pro', 12)" scripts/sonara-real-music-e2e.mjs

      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'sonara-ci'
          git config user.email 'sonara-ci@users.noreply.github.com'
          git add cloudflare/sonara-audio-quality-engine.mjs cloudflare/sonara-studio-ai-router.mjs scripts/sonara-real-music-e2e.mjs
          git commit -m 'fix(studio): persist jobs and enforce real Extend duration'
          git push origin HEAD:main
