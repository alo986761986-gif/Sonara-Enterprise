name: Test SONARA BPM Octave Ambiguity

on:
  pull_request:
    paths:
      - "molab/sonara_bpm_verification.py"
      - "molab/test_sonara_bpm_verification.py"
      - ".github/workflows/test-sonara-bpm-octave.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: python3 -m py_compile molab/sonara_bpm_verification.py molab/test_sonara_bpm_verification.py
      - name: Verify synthetic pulse regressions
        run: python3 -m unittest discover -s molab -p 'test_sonara_bpm_verification.py' -v
