name: Validate SONARA XL SFT Secondary Local API
on:
  pull_request:
    branches: [main]
    paths:
      - "molab/sonara_xl_sft_secondary_api.py"
      - "molab/test_sonara_xl_sft_secondary_api.py"
      - ".github/workflows/validate-sonara-xl-sft-secondary.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile molab/sonara_xl_sft_secondary_api.py
      - run: python -m unittest discover -s molab -p test_sonara_xl_sft_secondary_api.py -v
