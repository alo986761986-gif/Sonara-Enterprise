name: Test SONARA Remix Pro Offline Audio Pipeline
on:
  pull_request:
    paths:
      - 'molab/sonara_remix_pro_toolkit.py'
      - 'molab/test_sonara_remix_pro_toolkit.py'
      - '.github/workflows/test-sonara-remix-pro-toolkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-science:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: molab/requirements-remix-pro.txt
      - name: Install isolated analysis dependencies (no model downloads)
        run: python -m pip install -r molab/requirements-remix-pro.txt
      - name: Verify Python source and isolated tests
        run: |
          python -m py_compile molab/sonara_remix_pro_toolkit.py
          python -m unittest discover -s molab -p 'test_sonara_remix_pro_toolkit.py' -v
      - name: Verify honest preflight
        run: python molab/sonara_remix_pro_toolkit.py preflight
