name: Grant One-Month Studio Gift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/studio-gift-trigger"

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SONARA_FIREBASE_PROJECT_ID: ${{ secrets.SONARA_FIREBASE_PROJECT_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Grant Studio gift
        run: node scripts/grant-one-month-studio-gift.cjs
