name: Deploy SONARA Engine Quality 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/sonara-quality-director-v2.mjs"
      - "cloudflare/sonara-next-studio-edge.mjs"
      - "cloudflare/sonara-native-auth-main.mjs"
      - "cloudflare/sonara-quality-director-v2.test.mjs"
      - ".github/workflows/deploy-sonara-quality-v2.yml"

permissions:
  contents: read

concurrency:
  group: sonara-quality-v2-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, deploy and verify Quality 2.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Test SONARA Engine Quality 2.0
        run: node --test cloudflare/sonara-quality-director-v2.test.mjs

      - name: Build current production app
        run: npm run build

      - name: Guard Quality 2.0 production source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sonara-engine-quality-2.0' cloudflare/sonara-quality-director-v2.mjs
          grep -q 'sonara-next-studio-edge-v1' cloudflare/sonara-next-studio-edge.mjs
          grep -q 'sonara-next-studio-edge.mjs' cloudflare/sonara-native-auth-main.mjs
          grep -q 'SONARA Sessions 2.0' cloudflare/sonara-next-studio-edge.mjs

      - name: Resolve Cloudflare account and zone
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
          zone_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.id || ''));
          NODE
          )"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${zone_id}"
          test -n "${account_id}"
          echo "::add-mask::${zone_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ZONE_ID=${zone_id}" >> "${GITHUB_ENV}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy SONARA Quality 2.0 to official Cloudflare Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Purge official site cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            > /tmp/purge.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/purge.json', 'utf8'));
          if (result.success !== true) {
            console.error(JSON.stringify(result.errors || result));
            process.exit(1);
          }
          console.log('Cloudflare cache purge completed.');
          NODE

      - name: Verify Quality 2.0 and Sessions 2.0 publicly
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            health="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?quality=${GITHUB_SHA}-${attempt}" || true)"
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?quality=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "${health}" | grep -q 'sonara-engine-quality-2.0' \
              && printf '%s' "${health}" | grep -q 'sonara-next-studio-edge-v1' \
              && printf '%s' "${page}" | grep -q 'sonara-sessions-2-0'; then
              echo "SONARA Engine Quality 2.0 and Sessions 2.0 are live on the official site."
              exit 0
            fi
            echo "Waiting for Quality 2.0 propagation (${attempt}/30)."
            sleep 4
          done
          echo "Public Quality 2.0 verification failed." >&2
          exit 1
