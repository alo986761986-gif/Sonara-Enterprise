name: Apply Music Cover A B V1
# trigger 2026-09-03 integrated audio + cover A/B

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-music-cover-ab-v1.py"
      - ".github/workflows/apply-music-cover-ab-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-music-cover-ab-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch-music-cover-ab-v1.py
      - run: npm install
      - run: npm run build
      - name: Guard cover integration
        run: |
          grep -Fq "'/api/music-cover/generate'" src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'SCARICA COVER' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'RIGENERA COPERTINA' src/components/generator/ElevenMusicGenerationControl.tsx
          grep -Fq 'primaryImageUrl' src/services/generatedAssetVault.ts
          grep -Fq 'coverUrl' src/components/player/SonaraProfessionalFixedPlayer.tsx
          grep -Fq 'OPENAI_IMAGES_URL' api/music-cover/generate.ts
      - name: Commit integrated cover feature
        run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/generator/ElevenMusicGenerationControl.tsx src/services/generatedAssetVault.ts src/components/player/SonaraProfessionalFixedPlayer.tsx src/components/player/SonaraUniversalPlayerBridge.tsx .github/workflows/deploy-sonara-music-director-v3.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cover): generate A B artwork with music"
          git push origin main
