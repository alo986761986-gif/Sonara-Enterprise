name: Repair Modal Proxy Auth - v17 Safe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/modal-proxy-repair-trigger"

permissions:
  contents: read

jobs:
  repair:
    name: Rotate Modal proxy token without audio rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAW_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      RAW_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      MODAL_ENDPOINT_URL: https://alo986761986-gif--sonara-acestep-serve-acestep.modal.run

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Normalize Modal API credentials safely
        shell: bash
        run: |
          python - <<'PY' > /tmp/modal-api-pair
          import os, re

          def clean(value: str) -> str:
              value = (value or '').strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                  value = value[1:-1].strip()
              return value

          raw_id = clean(os.environ.get('RAW_MODAL_TOKEN_ID', ''))
          raw_secret = clean(os.environ.get('RAW_MODAL_TOKEN_SECRET', ''))

          for name in ('MODAL_TOKEN_ID', 'MODAL_TOKEN_SECRET'):
              prefix = f'{name}='
              if raw_id.startswith(prefix):
                  raw_id = raw_id[len(prefix):].strip()
              if raw_secret.startswith(prefix):
                  raw_secret = raw_secret[len(prefix):].strip()

          def extract(prefix: str, *values: str) -> str:
              pattern = re.compile(re.escape(prefix) + r'[A-Za-z0-9_-]+')
              for value in values:
                  if value.startswith(prefix):
                      return value
                  match = pattern.search(value)
                  if match:
                      return match.group(0)
              return ''

          token_id = extract('ak-', raw_id, raw_secret)
          token_secret = extract('as-', raw_secret, raw_id)
          if not token_id or not token_secret:
              raise SystemExit('Valid Modal API credentials were not found in GitHub Actions secrets.')
          print(token_id)
          print(token_secret)
          PY
          mapfile -t modal_pair < /tmp/modal-api-pair
          modal_id="${modal_pair[0]}"
          modal_secret="${modal_pair[1]}"
          echo "::add-mask::${modal_id}"
          echo "::add-mask::${modal_secret}"
          echo "MODAL_TOKEN_ID=${modal_id}" >> "${GITHUB_ENV}"
          echo "MODAL_TOKEN_SECRET=${modal_secret}" >> "${GITHUB_ENV}"
          rm -f /tmp/modal-api-pair

      - name: Resolve Cloudflare account ID
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find((item) => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.4,<2'

      - name: Create validate and synchronize fresh Modal proxy token
        shell: bash
        run: |
          modal token info >/dev/null
          modal workspace proxy-tokens create --json > /tmp/modal-proxy.json
          node - <<'NODE' > /tmp/modal-proxy-pair
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/modal-proxy.json', 'utf8'));
          const values = [];
          const visit = (value) => {
            if (typeof value === 'string') values.push(value.trim());
            else if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === 'object') Object.values(value).forEach(visit);
          };
          visit(payload);
          const id = values.find((value) => /^wk-[A-Za-z0-9_-]+$/.test(value));
          const secret = values.find((value) => /^ws-[A-Za-z0-9_-]+$/.test(value));
          if (!id || !secret) process.exit(1);
          process.stdout.write(`${id}\n${secret}\n`);
          NODE
          mapfile -t proxy_pair < /tmp/modal-proxy-pair
          proxy_id="${proxy_pair[0]}"
          proxy_secret="${proxy_pair[1]}"
          echo "::add-mask::${proxy_id}"
          echo "::add-mask::${proxy_secret}"
          modal workspace proxy-tokens allow "${proxy_id}" main >/dev/null 2>&1 || true
          direct_status="$(curl -sS --max-time 240 -w '%{http_code}' -H "Modal-Key: ${proxy_id}" -H "Modal-Secret: ${proxy_secret}" -o /tmp/modal-direct-models.json "${MODAL_ENDPOINT_URL}/v1/models" || true)"
          test "${direct_status}" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/modal-direct-models.json', 'utf8'));
          const models = Array.isArray(payload?.data?.models) ? payload.data.models.map((item) => String(item?.name || '')).filter(Boolean) : [];
          if (!models.includes('acestep-v15-xl-turbo')) process.exit(1);
          NODE
          printf '%s' "${proxy_id}" | npx --yes wrangler@latest secret put MODAL_PROXY_KEY --config wrangler.jsonc >/dev/null
          printf '%s' "${proxy_secret}" | npx --yes wrangler@latest secret put MODAL_PROXY_SECRET --config wrangler.jsonc >/dev/null
          rm -f /tmp/modal-proxy.json /tmp/modal-proxy-pair /tmp/modal-direct-models.json

      - name: Verify Cloudflare to Modal with fresh proxy token
        shell: bash
        run: |
          status="$(curl -sS --max-time 180 -w '%{http_code}' -o /tmp/cloudflare-modal-check.json https://api.sonaraenterprise.com/api/diagnostics/modal-connectivity || true)"
          STATUS="${status}" node - <<'NODE'
          const fs = require('fs');
          const status = Number(process.env.STATUS || 0);
          const payload = JSON.parse(fs.readFileSync('/tmp/cloudflare-modal-check.json', 'utf8'));
          const models = Array.isArray(payload.models) ? payload.models : [];
          if (status !== 200 || !payload.ok || !models.includes('acestep-v15-xl-turbo')) process.exit(1);
          console.log('Cloudflare -> Modal -> ACE-Step XL-Turbo verified.');
          NODE

      - name: Guard against legacy audio rollback
        shell: bash
        run: |
          if grep -q "wrangler@latest deploy" .github/workflows/repair-modal-proxy-auth.yml; then
            echo "Legacy code deploy detected in Modal repair workflow." >&2
            exit 1
          fi
          grep -q 'cloudflare/sonara-web-v15-router.mjs' wrangler.jsonc
          echo "Modal credential repair is secret-only; SONARA audio code is not redeployed here."

      - name: Verify authoritative v17 remains live
        shell: bash
        run: |
          response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?modal-guard=${GITHUB_SHA}")"
          HEALTH="${response}" node - <<'NODE'
          const h = JSON.parse(process.env.HEALTH || '{}');
          const expected = {
            universalGenreLock: 'v15-authoritative-full-prompt',
            authoritativePromptLock: 'v15-authoritative-full-prompt',
            selectedSubgenreAuthoritative: true,
            kaggleProfile: 'kaggle-t4x2-extreme-fidelity-v16',
            kaggleInferenceSteps: 12,
            kaggleGuidanceScale: 1.15,
            kaggleThinking: true,
            kaggleInferMethod: 'adaptive-ode-sde',
            resultDecoder: 'recursive-v17',
            progressHeartbeat: true
          };
          for (const [key, value] of Object.entries(expected)) {
            if (h[key] !== value) {
              console.error(`v17 guard failed: ${key}=${JSON.stringify(h[key])}`);
              process.exit(1);
            }
          }
          console.log('Authoritative SONARA v17 preserved after Modal credential repair.');
          NODE
