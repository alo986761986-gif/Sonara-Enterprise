name: Configure SONARA MoLab XL Only

on:
  push:
    branches:
      - main
    paths:
      - ".github/molab-xl-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-molab-xl-only-config
  cancel-in-progress: true

jobs:
  configure:
    name: Bind MoLab XL-Turbo as the only SONARA music engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply QUALITY V11 and full instrumentation V12 router patches
        run: |
          python3 scripts/patch-quality-speed-v10.py
          python3 scripts/patch-quality-speed-v11-low-latency.py
          python3 scripts/patch-full-instrumentation-v12.py
          python3 scripts/patch-molab-530-recovery.py
          node --check cloudflare/sonara-molab-xl-router.mjs

      - name: Install production dependencies
        run: npm install

      - name: Build production assets
        run: npm run build

      - name: Load MoLab XL endpoint
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/molab-xl-trigger"
          test -f "${trigger}"
          url="$(sed -n 's/^SONARA_MOLAB_XL_URL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          model="$(sed -n 's/^MODEL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          if [ "${url%/}" != "https://molab.sonaraenterprise.com" ]; then
            [[ "${url}" =~ ^https://[A-Za-z0-9.-]+\.(trycloudflare\.com|gradio\.live)/?$ ]]
          fi
          test "${model}" = "acestep-v15-xl-turbo"
          test "${mode}" = "MOLAB_XL_ONLY"
          echo "MOLAB_XL_URL=${url%/}" >> "${GITHUB_ENV}"

      - name: Verify MoLab ACE-Step XL-Turbo
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            health="$(curl -fsS --connect-timeout 8 --max-time 15 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "${MOLAB_XL_URL}/health" || true)"
            health_ok=false
            model_ok=false
            if [[ -n "${health}" ]] && printf '%s' "${health}" | jq -e '
              (.code == 200) or
              (((.data.status // .status // "") | tostring | ascii_downcase) | IN("ok","ready","healthy")) or
              (((.data.service // .service // "") | tostring | ascii_downcase) | contains("ace-step"))
            ' >/dev/null 2>&1; then
              health_ok=true
            fi
            if [[ -n "${health}" ]] && printf '%s' "${health}" | jq -e '
              def d: (.data // .);
              (((d.loaded_model // d.default_model // d.model // "") | tostring) | contains("acestep-v15-xl-turbo")) and
              ((d.models_initialized // true) == true)
            ' >/dev/null 2>&1; then
              model_ok=true
            fi
            inventory=""
            if [[ "${model_ok}" != true ]]; then
              inventory="$(curl -fsS --connect-timeout 8 --max-time 12 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "${MOLAB_XL_URL}/v1/model_inventory" || true)"
              if [[ -z "${inventory}" ]]; then
                inventory="$(curl -fsS --connect-timeout 8 --max-time 12 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "${MOLAB_XL_URL}/v1/models" || true)"
              fi
              if [[ -n "${inventory}" ]] && printf '%s' "${inventory}" | jq -e '
                def d: (.data // .);
                def direct: [d.loaded_model, d.default_model, d.model] | map(select(. != null) | tostring);
                def rows: (d.models // []) | map(
                  select(type == "object") |
                  {name: ((.name // .model // "") | tostring), loaded: (.is_loaded // false), default: (.is_default // false)}
                );
                (direct | any(contains("acestep-v15-xl-turbo"))) or
                (rows | any((.name | contains("acestep-v15-xl-turbo")) and (.loaded or .default)))
              ' >/dev/null 2>&1; then
                model_ok=true
              fi
            fi
            if [[ "${health_ok}" == true && "${model_ok}" == true ]]; then
              echo "MoLab XL-Turbo healthy: ${MOLAB_XL_URL}"
              printf '%s\n' "${health}" | jq '.' || true
              if [[ -n "${inventory}" ]]; then printf '%s\n' "${inventory}" | jq '.' || true; fi
              exit 0
            fi
            echo "MoLab XL health attempt ${attempt}/8 failed (health=${health_ok}, model=${model_ok})"
            sleep 4
          done
          echo "MoLab endpoint is not reporting ACE-Step XL-Turbo ready: ${MOLAB_XL_URL}" >&2
          exit 1

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Bind MoLab XL URL
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${MOLAB_XL_URL}" | npx --yes wrangler@latest secret put SONARA_MOLAB_XL_URL --config wrangler.jsonc

      - name: Deploy MoLab-only music router
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production MoLab-only routing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?verify=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '
              .profile == "sonara-molab-xl-only-v1" and
              .provider == "molab" and
              .model == "acestep-v15-xl-turbo" and
              .kaggleEnabled == false and
              .ready == true and
              .inferenceSteps == 4 and
              .maxBatchSize == 2
            ' >/dev/null 2>&1; then
              printf '%s\n' "${response}" | jq '{ready, profile, engine, provider, model, inferenceSteps, maxBatchSize, kaggleEnabled}'
              echo "SONARA QUALITY V11 + FULL INSTRUMENTATION V12 routing verified."
              exit 0
            fi
            echo "Production QUALITY V11/V12 verification attempt ${attempt}/12 failed"
            sleep 5
          done
          echo "Production QUALITY V11/V12 router did not verify." >&2
          exit 1
