name: Configure SONARA MoLab XL Only

on:
  # External production hosting is blocked by default by MoLab's usage rules.
  # Never automatically deploy from a notebook session.
  workflow_dispatch:
    inputs:
      authorization_confirmed:
        description: "I confirm that MoLab has expressly authorized serving SONARA website traffic"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: sonara-molab-xl-only-config
  cancel-in-progress: true

jobs:
  configure:
    name: Bind MoLab XL-Turbo as the only SONARA music engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_ACESTEP_API_KEY: ${{ secrets.SONARA_ACESTEP_API_KEY }}
      MOLAB_EXTERNAL_ACCESS_AUTHORIZED: ${{ inputs.authorization_confirmed }}
      SONARA_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36

    steps:
      - name: Block deployment without written MoLab permission
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${MOLAB_EXTERNAL_ACCESS_AUTHORIZED}" != true ]]; then
            echo 'Deployment disabled: MoLab prohibits exposing its GPU to external websites and proxies. Written provider authorization required.' >&2
            exit 1
          fi

      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate current RTX 6000 routing
        run: |
          node --check cloudflare/sonara-molab-xl-router.mjs
          node --check cloudflare/sonara-speed-v4-edge.mjs
          node --check cloudflare/sonara-music-director-v3-entry.mjs
          node --check cloudflare/sonara-yue-router.mjs
          node scripts/verify-quality-latency-v14.mjs

      - name: Install production dependencies
        run: npm install

      - name: Build production assets
        run: npm run build

      - name: Load MoLab XL endpoint
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/molab-xl-trigger"
          test -f "${trigger}"
          url="$(sed -n 's/^SONARA_MOLAB_XL_URL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          model="$(sed -n 's/^MODEL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          mode="$(sed -n 's/^MODE=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          test "${url%/}" = "https://molab.sonaraenterprise.com"
          test "${model}" = "acestep-v15-xl-turbo"
          test "${mode}" = "MOLAB_XL_ONLY"
          echo "MOLAB_XL_URL=${url%/}" >> "${GITHUB_ENV}"

      - name: Verify MoLab XL Turbo + LM 4B (private HTTPS)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SONARA_ACESTEP_API_KEY}"
          for attempt in $(seq 1 12); do
            health="$(curl -fsS --connect-timeout 8 --max-time 20 \
              -H "Authorization: Bearer ${SONARA_ACESTEP_API_KEY}" \
              -H 'Cache-Control: no-cache' "${MOLAB_XL_URL}/health" || true)"
            if printf '%s' "${health}" | jq -e '
              def d: (.data // .);
              (d.models_initialized == true) and
              (d.llm_initialized == true) and
              ((d.loaded_model // "" | tostring) | contains("acestep-v15-xl-turbo")) and
              ((d.loaded_lm_model // "" | tostring) | contains("acestep-5Hz-lm-4B")) and
              ((d.status // "" | tostring | ascii_downcase) | IN("ok","ready","healthy"))
            ' >/dev/null 2>&1; then
              echo "MoLab XL Turbo + LM 4B ready."
              exit 0
            fi
            sleep 5
          done
          echo "MoLab is not ready; production unchanged." >&2
          exit 1

      - name: Reject missing or invalid MoLab credentials
        shell: bash
        run: |
          set -euo pipefail
          for mode in missing invalid; do
            headers=()
            if [[ "${mode}" == invalid ]]; then
              headers=(-H 'Authorization: Bearer intentionally-invalid-sonara-probe')
            fi
            status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              -X POST -H 'Content-Type: application/json' "${headers[@]}" \
              --data '{"task_id_list":["sonara-auth-probe"]}' "${MOLAB_XL_URL}/query_result")"
            if [[ "${status}" != 401 && "${status}" != 403 ]]; then
              echo "MoLab API unsafe: ${mode} credentials returned HTTP ${status}." >&2
              exit 1
            fi
          done

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Build private one-shot deployment secrets file
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const { join } = require('node:path');
          const file = join(process.env.RUNNER_TEMP, 'sonara-molab-deployment-secrets.json');
          if (!process.env.MOLAB_XL_URL || !process.env.SONARA_ACESTEP_API_KEY) {
            throw new Error('MoLab URL / private API key required');
          }
          fs.writeFileSync(file, JSON.stringify({
            SONARA_MOLAB_XL_URL: process.env.MOLAB_XL_URL,
            ACE_STEP_API_KEY: process.env.SONARA_ACESTEP_API_KEY
          }), { mode: 0o600 });
          NODE

      - name: Deploy MoLab-only Worker and BOTH secrets in one operation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc --secrets-file "${RUNNER_TEMP}/sonara-molab-deployment-secrets.json"

      - name: Destroy ephemeral deployment secrets file
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/sonara-molab-deployment-secrets.json"

      - name: Verify production MoLab-only routing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?verify=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '
              .profile == "sonara-molab-xl-only-v1" and
              .provider == "molab" and
              .model == "acestep-v15-xl-turbo" and
              .kaggleEnabled == false and
              .ready == true and
              .fidelityProfile == "sonara-fidelity-v15-ultra-speed-max-fast1-quality2-ultra2" and
              .defaultGenerationProfile == "quality" and
              .defaultInferenceSteps == 2 and
              .qualitySingleGpuBatch == true and
              .qualityCandidatesPerBatch == 2 and
              .qualityAutomaticRepair == false and
              .speedRevision == "sonara-v14-quality-single-batch-1" and
              .qualityInferenceSteps == 2 and
              .fastInferenceSteps == 1 and
              .ultraInferenceSteps == 2 and
              .maxBatchSize == 2
            ' >/dev/null 2>&1; then
              printf '%s\n' "${response}" | jq '{ready, profile, fidelityProfile, engine, provider, model, defaultGenerationProfile, defaultInferenceSteps, qualitySingleGpuBatch, qualityCandidatesPerBatch, qualityAutomaticRepair, speedRevision, fastInferenceSteps, qualityInferenceSteps, ultraInferenceSteps, maxBatchSize, kaggleEnabled}'
              echo "SONARA V15 RTX 6000 verified: FAST=1, QUALITY=2, ULTRA=2, one batch with 2 tracks."
              exit 0
            fi
            echo "Production V15 verification attempt ${attempt}/12 failed"
            printf '%s\n' "${response}" | jq -c '{ready, profile, fidelityProfile, provider, model, defaultGenerationProfile, defaultInferenceSteps, qualitySingleGpuBatch, qualityCandidatesPerBatch, qualityAutomaticRepair, speedRevision, fastInferenceSteps, qualityInferenceSteps, ultraInferenceSteps, maxBatchSize, healthError, reason}' 2>/dev/null || printf '%s\n' "${response}" | head -c 1200
            sleep 5
          done
          echo "Production V15 router did not verify. Last response:" >&2
          printf '%s\n' "${response}" | jq '.' 2>/dev/null || printf '%s\n' "${response}" | head -c 4000
          exit 1
