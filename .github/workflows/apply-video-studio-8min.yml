name: Apply SONARA Studio Video 8min

on:
  push:
    paths:
      - '.github/workflows/apply-video-studio-8min.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Studio duration patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, from, to, label) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`${path}: patch non trovata: ${label}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replaceExact(
            'src/billing/plans.ts',
            '    videoClipSeconds: 120,',
            '    videoClipSeconds: 480,',
            'Studio max duration 480s'
          );
          replaceExact(
            'src/billing/plans.ts',
            "      '60 crediti SONARA Video AI al mese · video fino a 2 minuti · fino a 4K',",
            "      '60 crediti SONARA Video AI al mese · video fino a 8 minuti · fino a 4K',",
            'Studio plan feature label'
          );
          replaceExact(
            'api/video/generate.ts',
            '    const durationSeconds = Number.isFinite(requestedDuration) ? Math.max(8, Math.min(120, Math.round(requestedDuration))) : 8;',
            '    const durationSeconds = Number.isFinite(requestedDuration) ? Math.max(8, Math.min(480, Math.round(requestedDuration))) : 8;',
            'server duration clamp 480s'
          );
          replaceExact(
            'api/video/generate.ts',
            "      if (code === 'VIDEO_DURATION_NOT_ALLOWED') return fail(res, 403, code, 'I video oltre 8 secondi sono disponibili esclusivamente con SONARA Studio.', { maxDurationSeconds: (cause as any).maxDurationSeconds });",
            "      if (code === 'VIDEO_DURATION_NOT_ALLOWED') return fail(res, 403, code, 'I video oltre 8 secondi e fino a 8 minuti sono disponibili esclusivamente con SONARA Studio.', { maxDurationSeconds: (cause as any).maxDurationSeconds });",
            'Studio duration error message'
          );
          replaceExact(
            'src/components/video/VideoAISectionControl.tsx',
            'STUDIO · FINO A 2 MINUTI',
            'STUDIO · DA 8 SEC A 8 MINUTI',
            'Studio UI duration badge'
          );
          replaceExact(
            'src/components/video/VideoAISectionControl.tsx',
            '<div className="mt-3 grid grid-cols-4 gap-2">{([8, 30, 60, 120] as const).map',
            '<div className="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5">{([8, 30, 60, 120, 180, 240, 300, 360, 420, 480] as const).map',
            'Studio UI duration choices'
          );

          console.log('SONARA Studio Video AI duration: 8s -> 8min patch applied.');
          NODE

      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit final implementation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/billing/plans.ts api/video/generate.ts src/components/video/VideoAISectionControl.tsx
          git rm .github/workflows/apply-video-studio-8min.yml
          git commit -m "feat(video): allow Studio videos up to 8 minutes"
          git push origin HEAD:main
