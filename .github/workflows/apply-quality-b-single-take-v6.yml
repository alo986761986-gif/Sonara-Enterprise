name: Apply QUALITY B Single Take V6

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-b-single-take-v6.py"
      - ".github/workflows/apply-quality-b-single-take-v6.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-quality-b-single-take-v6.py
      - run: node --check cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: node --check cloudflare/sonara-molab-xl-router.mjs
      - run: grep -Fq 'QUALITY B SAFE SINGLE TAKE' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'qualitySequentialSingleTakes' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'sonara_quality_safe_b_v6' cloudflare/sonara-molab-xl-router.mjs
      - run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-quality-ultra-stability-guard.mjs cloudflare/sonara-molab-xl-router.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quality): generate B as strict single take v6"
          git push origin HEAD:main
