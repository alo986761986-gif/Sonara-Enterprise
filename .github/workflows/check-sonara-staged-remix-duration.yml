name: SONARA Validate Staged Cloudflare Remix Duration Version
on:
  push:
    branches:
      - fix/remix-pro-duration-preserve-20261108
    paths:
      - '.github/workflows/check-sonara-staged-remix-duration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Verify staged Cloudflare version and preview, never deploy
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          if(!token){console.log('STAGED_READONLY',{tokenAvailable:false});process.exit(0);}
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          const api='https://api.cloudflare.com/client/v4';
          const fetchJson=async path=>{
            try{
              const r=await fetch(api+path,{headers,signal:AbortSignal.timeout(16000)});
              const p=await r.json().catch(()=>({}));
              return {status:r.status,result:p.result||{},success:p.success===true};
            }catch(e){return {status:0,error:e?.name||'Error',result:{}};}
          };
          const zones=await fetchJson('/zones?name=sonaraenterprise.com');
          const zone=zones.result?.find(z=>z.name==='sonaraenterprise.com');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||zone?.account?.id;
          if(!account){console.log('STAGED_READONLY',{accountAvailable:false});process.exit(0);}
          const base='/accounts/'+account+'/workers';
          const id='bb81a8de-8147-492f-b95b-0597b6378130';
          const version=await fetchJson(base+'/scripts/sonara-enterprise/versions/'+id);
          const deployments=await fetchJson(base+'/scripts/sonara-enterprise/deployments');
          const subdomain=await fetchJson(base+'/subdomain');
          const workerSub=await fetchJson(base+'/scripts/sonara-enterprise/subdomain');
          const active=deployments.result.deployments?.[0]?.versions?.[0]?.version_id;
          console.log('STAGED_READONLY',JSON.stringify({
            versionHttp:version.status,versionFound:version.success,
            activeVersion:active,stagedVersion:id,
            productionUnchanged:active==='bbedc676-8792-4421-85b3-913e74270686',
            accountSubdomainAvailable:!!subdomain.result?.subdomain,
            workerPreviewEnabled:workerSub.result?.previews_enabled===true
          }));
          const slug=subdomain.result?.subdomain;
          if(typeof slug!=='string'||!/^[a-z0-9-]+$/.test(slug))process.exit(0);
          if(workerSub.result?.previews_enabled!==true)process.exit(0);
          const url='https://'+id.slice(0,8)+'-sonara-enterprise.'+slug+'.workers.dev/';
          try {
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(15000),headers:{Accept:'text/html'}});
            const text=await r.text();
            console.log('STAGED_READONLY',JSON.stringify({
              kind:'versionUrl',http:r.status,
              contentType:r.headers.get('content-type'),
              durationScriptMarker:text.includes('sonara-remix-pro-duration-edge-v2'),
              durationHeader:r.headers.get('x-sonara-remix-pro-duration-lock')||null
            }));
          }catch(e){console.log('STAGED_READONLY',JSON.stringify({kind:'versionUrl',error:e?.name||'Error'}));}
          NODE
