name: SONARA Quality Two-Track Speed Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/sonara-quality-speed-e2e-trigger"
      - ".github/workflows/sonara-quality-speed-e2e.yml"
      - "scripts/sonara-quality-speed-e2e.mjs"
      - "cloudflare/sonara-real-music-v3-edge.mjs"
      - "cloudflare/sonara-speed-v4-edge.mjs"
      - "cloudflare/sonara-music-director-v3-entry.mjs"
      - "cloudflare/sonara-yue-router.mjs"
      - "cloudflare/sonara-molab-xl-router.mjs"

permissions:
  contents: read

concurrency:
  group: sonara-quality-two-track-speed
  cancel-in-progress: true

jobs:
  full-song-pair:
    name: Generate two complete Quality songs in one RTX batch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_ORIGIN: https://api.sonaraenterprise.com
      WEB_ORIGIN: https://sonaraenterprise.com
      SONARA_INTERNAL_PROXY_SECRET: ${{ secrets.SONARA_INTERNAL_PROXY_SECRET }}
      SONARA_EXPECTED_DURATION_SEC: "180"
      SONARA_MAX_LATENCY_MS: "120000"
      POLL_MS: "1000"
      READY_ATTEMPTS: "60"
      SONARA_SPEED_REPORT: sonara-quality-speed-e2e-report.json

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate speed canary
        run: node --check scripts/sonara-quality-speed-e2e.mjs

      - name: Generate and time two complete songs
        run: node scripts/sonara-quality-speed-e2e.mjs

      - name: Print speed result
        if: always()
        shell: bash
        run: |
          if [[ -f sonara-quality-speed-e2e-report.json ]]; then
            node -e "const r=require('./sonara-quality-speed-e2e-report.json'); console.log(JSON.stringify({ok:r.ok,jobId:r.jobId,latencyMs:r.latencyMs,requestedDurationSec:r.requestedDurationSec,measuredDurationsSec:r.measuredDurationsSec,outputCount:r.audioUrls?.length,error:r.error},null,2))"
          fi

      - name: Upload speed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonara-quality-speed-e2e-${{ github.run_id }}
          path: sonara-quality-speed-e2e-report.json
          if-no-files-found: warn
          retention-days: 14
