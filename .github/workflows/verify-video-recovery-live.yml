name: Verify SONARA Video Recovery Live

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-video-recovery-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Video AI JSON recovery is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            curl -sS -D /tmp/video.headers -o /tmp/video.json --max-time 20 "https://sonaraenterprise.com/api/video/status?verify=${GITHUB_SHA}-${attempt}" || true
            type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' /tmp/video.headers | tail -n1 | tr -d '\r')"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-sonara-video-recovery:/{print $2}' /tmp/video.headers | tail -n1 | tr -d '\r')"
            if [[ "${type}" == application/json* && "${marker}" == "cloudflare-video-json-v1" ]]; then
              node -e "JSON.parse(require('fs').readFileSync('/tmp/video.json','utf8'));"
              echo "VIDEO_RECOVERY_LIVE=1"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify v16 music health after propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 20 https://api.sonaraenterprise.com/api/health -o /tmp/music.json; then
              if node - <<'NODE'
          const h = JSON.parse(require('fs').readFileSync('/tmp/music.json','utf8'));
          const ok = h.universalGenreLock === 'v15-authoritative-full-prompt'
            && h.kaggleProfile === 'kaggle-t4x2-extreme-fidelity-v16'
            && h.kaggleInferenceSteps === 12
            && h.kaggleThinking === true
            && h.selectedSubgenreAuthoritative === true;
          if (!ok) {
            console.error(JSON.stringify({
              universalGenreLock: h.universalGenreLock,
              kaggleProfile: h.kaggleProfile,
              kaggleInferenceSteps: h.kaggleInferenceSteps,
              kaggleThinking: h.kaggleThinking,
              selectedSubgenreAuthoritative: h.selectedSubgenreAuthoritative
            }));
            process.exit(1);
          }
          console.log('MUSIC_V16_UNCHANGED=1');
          NODE
              then exit 0; fi
            fi
            sleep 5
          done
          echo "v16 health did not converge to expected state" >&2
          exit 1
