name: Deploy SONARA Relay Pairing
# trigger: 2026-10-30 ACE-Step LM8 realism production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-sonara-relay-pairing.yml"
      - "cloudflare/sonara-r2-https-relay.mjs"
      - "cloudflare/sonara-r2-tempo-report.test.mjs"
      - "cloudflare/sonara-audio-quality-engine.mjs"
      - "cloudflare/sonara-r2-generation-profile.mjs"
      - "cloudflare/sonara-mix-master-v1.mjs"
      - "cloudflare/sonara-r2-generation-profile.test.mjs"
      - "cloudflare/sonara-tonal-clarity.test.mjs"
      - "cloudflare/sonara-studio-ai-router.mjs"
      - "cloudflare/sonara-remix-r2.test.mjs"
      - "cloudflare/sonara-molab-xl-router.mjs"
      - "cloudflare/sonara-remix-precision-v1.mjs"
      - "cloudflare/sonara-remix-precision-v1.test.mjs"
      - "cloudflare/sonara-remix-instrument-definition-v2.mjs"
      - "cloudflare/sonara-remix-instrument-definition-v2.test.mjs"
      - "cloudflare/sonara-remix-pro-r2.mjs"
      - "cloudflare/sonara-remix-pro-v6-controls.mjs"
      - "cloudflare/sonara-remix-pro-v6-controls.test.mjs"
      - "molab/sonara_remix_pro_v5.py"
      - "molab/sonara_remix_pro_v6.py"
      - "cloudflare/sonara-remix-pro-r2.test.mjs"
      - "cloudflare/sonara-ab-player-visibility-edge.mjs"
      - "cloudflare/sonara-remix-pro-duration-edge.mjs"
      - "cloudflare/sonara-remix-pro-duration-edge.test.mjs"
      - "src/components/remix/SonaraRemixProPanel.tsx"
      - "molab/sonara_remix_pro_r2_agent.py"
      - "src/components/remix/SonaraRemixSection.tsx"
      - "molab/sonara_r2_pull_agent.py"
      - "molab/sonara_r2_install.py"
      - "cloudflare/sonara-five-pillars.test.mjs"

permissions:
  contents: read

concurrency:
  group: sonara-relay-pairing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate old and new notebook relay pairing before deployment
        run: node --test cloudflare/sonara-r2-https-relay.test.mjs

      - name: Validate Remix R2 owner, v6 GPU heartbeat and secure source download
        run: node --test cloudflare/sonara-remix-r2.test.mjs

      - name: Verify professional Remix source fidelity, duration and tempo locks
        run: node --test cloudflare/sonara-remix-precision-v1.test.mjs

      - name: Verify real Remix instrument definition and safe focus options
        run: node --test cloudflare/sonara-remix-instrument-definition-v2.test.mjs

      - name: Verify two-source Pro billing gate, R2 ownership and lease isolation
        run: node --test cloudflare/sonara-remix-pro-r2.test.mjs

      - name: Verify Creative DNA V6 controls with V5 fallback intact
        run: |
          node --test cloudflare/sonara-remix-pro-v6-controls.test.mjs
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_v6.py' -v
          python3 -m py_compile molab/sonara_remix_pro_v6.py molab/sonara_remix_pro_v5.py molab/sonara_remix_pro_r2_agent.py

      - name: Verify 8-minute duration bridge for existing Vercel UI
        run: node --test cloudflare/sonara-remix-pro-duration-edge.test.mjs

      - name: Verify exact BPM request contracts
        run: node --test cloudflare/sonara-r2-bpm-lock.test.mjs

      - name: Verify R2 per-track BPM status before production deployment
        run: node --test cloudflare/sonara-r2-tempo-report.test.mjs

      - name: Verify new A/B quality and Studio BPM truth before Worker deployment
        run: node --test cloudflare/sonara-five-pillars.test.mjs

      - name: Verify tonal-clarity guidance and original audio constraints
        run: node --test cloudflare/sonara-tonal-clarity.test.mjs

      - name: Verify measured WAV pulse independently
        run: python3 -m unittest discover -s molab -p 'test_sonara_bpm_verification.py' -v

      - name: Verify relay Python syntax
        run: python3 -m py_compile molab/sonara_r2_pull_agent.py molab/sonara_r2_install.py molab/sonara_bpm_verification.py

      - name: Verify ACE-Step R2 audio paths and installer pin hashes
        run: python3 -m unittest discover -s molab -p 'test_sonara_r2_source_paths.py' -v && python3 -m unittest discover -s molab -p 'test_sonara_r2_installer_pins.py' -v

      - name: Install dependencies
        run: npm install

      - name: Build SONARA assets
        run: npm run build

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc

      - name: Deploy current SONARA Worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public API
        run: curl -fsS --max-time 20 https://api.sonaraenterprise.com/api/health >/dev/null

      - name: Verify live Remix Pro availability after deploy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "https://api.sonaraenterprise.com/api/sonara-relay/pro-capabilities" -o /tmp/sonara-remix-pro-availability.json; then
              if node -e "const s=require('/tmp/sonara-remix-pro-availability.json');process.exit(s.available===true&&s.fusionAvailable===true&&s.expectedAgentRevision==='sonara-remix-pro-r2-agent-v3-dual-reference-fusion'?0:1)"; then
                echo "SONARA_REMIX_PRO_PRODUCTION_AVAILABLE=True"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Remix Pro production is not available; check the V3 MoLab GPU agent heartbeat, fusion readiness and deployed feature flags."
          exit 1
