name: Deploy Cloudflare SONARA Stable Audio v16

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/cloudflare-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Restore and deploy SONARA stable v16 audio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing Cloudflare API token." >&2
            exit 1
          fi
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find((item) => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id || ''));
          NODE
            )"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Build authoritative renderer then restore saved stable v16 behavior
        shell: bash
        run: |
          set -euo pipefail
          node scripts/activate-professional-music-taxonomy.cjs
          node cloudflare/sonara-engine-v15-authoritative-prompt.test.mjs
          node scripts/activate-extreme-fidelity-v16.cjs
          node cloudflare/extreme-fidelity-v16.test.mjs
          node scripts/restore-audio-stable-v16.cjs
          node --check cloudflare/sonara-engine-v9-dual-fast.mjs

      - name: Guard stable production audio profile
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cloudflare/sonara-web-v15-router.mjs' wrangler.jsonc
          grep -q "kaggle-t4x2-extreme-fidelity-v16" cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q "const KAGGLE_STEPS = 12;" cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q "const KAGGLE_GUIDANCE_SCALE = 1.15;" cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q "const resultItems = parseItems(item?.result)" cloudflare/sonara-engine-v9-dual-fast.mjs
          ! grep -q "resultDecoder: 'recursive-v17'" cloudflare/sonara-engine-v9-dual-fast.mjs
          ! grep -q "progressHeartbeat: true" cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q "selectedSubgenreAuthoritative: true" cloudflare/sonara-engine-v15-authoritative-prompt.mjs
          echo "SONARA stable v16 audio rollback verified before deploy."

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public SONARA stable v16 health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            if response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/health?stable=${GITHUB_SHA}-${attempt}" 2>/dev/null)"; then
              printf '%s' "${response}" > /tmp/health.json
              if node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const expected = {
            universalGenreLock: 'v15-authoritative-full-prompt',
            authoritativePromptLock: 'v15-authoritative-full-prompt',
            professionalPromptPreserved: true,
            creativeControlsPreserved: true,
            selectedSubgenreAuthoritative: true,
            legacyCaption500Bypassed: true,
            kaggleProfile: 'kaggle-t4x2-extreme-fidelity-v16',
            kaggleInferenceSteps: 12,
            kaggleGuidanceScale: 1.15,
            kaggleThinking: true,
            kaggleInferMethod: 'adaptive-ode-sde'
          };
          for (const [key, value] of Object.entries(expected)) {
            if (h[key] !== value) {
              console.error(`Health mismatch: ${key}=${JSON.stringify(h[key])}, expected ${JSON.stringify(value)}`);
              process.exit(1);
            }
          }
          if (h.resultDecoder === 'recursive-v17' || h.progressHeartbeat === true) {
            console.error('v17 audio behavior is still active');
            process.exit(1);
          }
          console.log(`SONARA stable v16 verified; ready workers=${h.aceStepWorkerCount ?? 'n/a'}.`);
          NODE
              then
                exit 0
              fi
            fi
            echo "Stable v16 health not ready yet (${attempt}/15)."
            sleep 4
          done
          echo "SONARA stable v16 public health verification failed." >&2
          exit 1
