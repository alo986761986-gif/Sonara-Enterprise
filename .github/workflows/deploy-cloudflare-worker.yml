name: Deploy Cloudflare Sonara Engine v9

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/cloudflare-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: cloudflare-sonara-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sonara Engine v9 to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN (or CF_API_TOKEN)." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID)." >&2
            exit 1
          fi
          echo "Cloudflare deployment credentials are configured."

      - name: Validate Sonara Worker v9 source
        shell: bash
        run: |
          test -f cloudflare/sonara-engine-v9-dual-fast.mjs
          grep -q 'cloudflare/sonara-engine-v9-dual-fast.mjs' wrangler.jsonc
          grep -q 'api.sonaraenterprise.com' wrangler.jsonc
          echo "Sonara Worker v9 configuration verified."

      - name: Deploy Worker to Cloudflare production
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify public Sonara API health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if response="$(curl -fsS --max-time 15 https://api.sonaraenterprise.com/api/health 2>/dev/null)"; then
              printf '%s' "$response" > /tmp/sonara-health.json
              node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/sonara-health.json', 'utf8'));
          const expected = {
            dualFast: true,
            dualFastProfile: 'single-job-native-batch-v9',
            dualFastModel: 'acestep-v15-xl-turbo',
            dualFastInferenceSteps: 6,
            dualFastCandidateCount: 2,
            dualFastAutoRegeneration: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (health[key] !== value) {
              console.error(`Health mismatch: ${key}=${JSON.stringify(health[key])}, expected ${JSON.stringify(value)}`);
              process.exit(1);
            }
          }
          console.log('SONARA Cloudflare v9 health verified.');
          NODE
              exit 0
            fi
            echo "Health endpoint not ready yet (attempt ${attempt}/12)."
            sleep 5
          done
          echo "api.sonaraenterprise.com did not become healthy after deployment." >&2
          exit 1
