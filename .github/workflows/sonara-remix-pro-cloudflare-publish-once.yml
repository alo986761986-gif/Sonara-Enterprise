name: SONARA Remix A+B - Publish Cloudflare only (no tests)

on:
  push:
    branches:
      - feature/multitrack-real-ab-fusion-20261108
    paths:
      - .github/sonara-remix-fusion-publish-now

permissions:
  contents: read
  statuses: write

concurrency:
  group: sonara-remix-fusion-direct-cloudflare-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'alo986761986-gif/Sonara-Enterprise' && github.ref == 'refs/heads/feature/multitrack-real-ab-fusion-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      WORKERS_CI: "1"
      VERCEL: "0"
    steps:
      - name: Checkout exact SONARA Fusion V3 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve existing Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_TOKEN_MISSING - publishing could not start" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            zone_response="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const data=JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone=Array.isArray(data.result) ? data.result.find(z=>z?.name==='sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id||''));
          NODE
            )"
            if [[ -z "${account_id}" ]]; then
              echo "CLOUDFLARE_ACCOUNT_ID_MISSING" >&2
              exit 1
            fi
            echo "::add-mask::${account_id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"
          fi
      - name: Install SONARA dependencies (no tests)
        run: npm ci --no-audit --no-fund
      - name: Build static frontend assets only (no tests, no Vercel)
        id: build
        run: |
          npm run build
          test -f dist/index.html
      - name: Publish Worker and frontend to Cloudflare production
        id: publish
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Record actual publication result on GitHub commit
        if: always()
        shell: bash
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          status=failure
          description="Cloudflare publication failed or not executed"
          if [[ "${DEPLOY_OUTCOME}" == "success" ]]; then
            status=success
            description="Cloudflare Wrangler published SONARA Fusion V3"
          fi
          export RELEASE_STATUS="${status}"
          export RELEASE_DESCRIPTION="${description}"
          payload="$(node - <<'NODE'
          const body={
            state:process.env.RELEASE_STATUS,
            context:'sonara/cloudflare-only-publish',
            description:process.env.RELEASE_DESCRIPTION,
            target_url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID
          };
          process.stdout.write(JSON.stringify(body));
          NODE
          )"
          curl -fsS --max-time 20 -X POST \
            -H "Authorization: Bearer ${GH_STATUS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" > /dev/null
          echo "SONARA_CLOUDFLARE_PUBLISH=${status}"
          echo "SONARA_VERCEL_USED=false"
          echo "SONARA_GPU_AGENT_NOT_MODIFIED=true"
