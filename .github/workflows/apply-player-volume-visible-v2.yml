name: Apply SONARA Visible Volume V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-player-volume-visible-v2.py"
      - ".github/workflows/apply-player-volume-visible-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-player-volume-visible-v2.py
      - run: npm install
      - run: npm run build
      - run: grep -Fq 'VOLUME {candidate.id}' src/components/generator/ElevenMusicGenerationControl.tsx
      - run: grep -Fq 'sonara-pro-volume-label' src/components/player/SonaraProfessionalFixedPlayer.tsx
      - run: grep -Fq 'npm run test:generation-prompt' .github/workflows/deploy-sonara-music-director-v3.yml
      - run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/generator/ElevenMusicGenerationControl.tsx src/components/player/SonaraProfessionalFixedPlayer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(player): make A B and universal volume controls visible"
          git push origin HEAD:main

# retry-v2-after-workflow-permission-fix
