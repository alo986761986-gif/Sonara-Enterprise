name: Deploy SONARA Real Music Speed Max V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activate-real-music-speed-max-v5.cjs"
      - "scripts/ace-step-real-music-v3-speed-supervisor-0904.py"
      - ".github/workflows/deploy-real-music-speed-max-v5.yml"

permissions:
  contents: read

concurrency:
  group: sonara-real-music-speed-max-v5-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Activate build deploy and verify Speed Max V5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36

    steps:
      - name: Checkout SONARA
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Activate Speed Max V5
        run: node scripts/activate-real-music-speed-max-v5.cjs

      - name: Validate accelerated production chain
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/sonara-speed-v4-edge.mjs
          node --check cloudflare/sonara-music-director-v3-entry.mjs
          grep -Fq 'const FAST_STEPS = 4;' cloudflare/sonara-speed-v4-edge.mjs
          grep -Fq "sonaraSpeedInferenceSteps: FAST_STEPS" cloudflare/sonara-speed-v4-edge.mjs
          grep -Fq "quality-director-single-batch" cloudflare/sonara-speed-v4-edge.mjs
          grep -Fq "internalCandidateTarget: profile === 'ultra' ? 4 : 2" cloudflare/sonara-speed-v4-edge.mjs
          grep -Fq "automaticSecondBatch: profile === 'ultra'" cloudflare/sonara-speed-v4-edge.mjs
          grep -Fq "profile: 'quality', internalBatches: 1, candidatesPerBatch: 2" cloudflare/sonara-music-director-v3-entry.mjs
          grep -Fq '"main": "cloudflare/sonara-real-music-v3-edge.mjs"' wrangler.jsonc
          echo 'SONARA_SPEED_MAX_V5_SOURCE=VERIFIED'

      - name: Build production app
        run: npm run build

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "::add-mask::${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy accelerated SONARA worker
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production runtime and MoLab binding
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            ready="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?speedv5=${GITHUB_SHA}-${attempt}" || true)"
            caps="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/real-music/v3/capabilities?speedv5=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${ready}" ]] && [[ -n "${caps}" ]] \
              && printf '%s' "${ready}" | jq -e '.ready == true and .provider == "molab" and .model == "acestep-v15-xl-turbo" and .kaggleEnabled == false' >/dev/null 2>&1 \
              && printf '%s' "${caps}" | jq -e '.version == "sonara-real-music-v3-auto-refine-1" and .turboModel == "acestep-v15-xl-turbo"' >/dev/null 2>&1; then
              printf '%s\n' "${ready}" | jq '{ready, profile, engine, provider, model, inferenceSteps, maxBatchSize, kaggleEnabled}'
              printf '%s\n' "${caps}" | jq '{version, turboModel, refinementModel, lmModel, qualityTarget, ultraTargetScore}'
              echo 'SONARA_SPEED_MAX_V5_PRODUCTION=READY'
              exit 0
            fi
            echo "Speed V5 verification attempt ${attempt}/12 failed"
            sleep 5
          done
          echo 'Speed Max V5 production verification failed.' >&2
          exit 1
