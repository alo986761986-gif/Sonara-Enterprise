name: Apply SONARA Vertex Project Failover

on:
  push:
    paths:
      - '.github/workflows/apply-vertex-project-failover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply separate Vertex project credentials
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, from, to, label) {
            let source = fs.readFileSync(path, 'utf8');
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`${path}: patch non trovata: ${label}`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          }

          replaceExact(
            'api/video/provider.ts',
            "import type { App } from 'firebase-admin/app';",
            "import { cert, type App } from 'firebase-admin/app';",
            'firebase-admin cert import'
          );

          replaceExact(
            'api/video/provider.ts',
            "function projectId(app: App) {\n  return String(process.env.SONARA_FIREBASE_PROJECT_ID || process.env.FIREBASE_PROJECT_ID || process.env.GCLOUD_PROJECT || app.options.projectId || '').trim();\n}\n\nasync function vertexAccessToken(app: App) {\n  const credential = app.options.credential;\n  if (!credential) throw new Error('Google service account credential non disponibile.');\n  const token = await credential.getAccessToken();\n  if (!token?.access_token) throw new Error('Impossibile ottenere un access token Google Cloud.');\n  return token.access_token;\n}",
            "function projectId(app: App) {\n  return String(process.env.SONARA_VERTEX_PROJECT_ID || process.env.SONARA_FIREBASE_PROJECT_ID || process.env.FIREBASE_PROJECT_ID || process.env.GCLOUD_PROJECT || app.options.projectId || '').trim();\n}\n\nfunction vertexCredential(app: App) {\n  const separateServiceAccount = String(process.env.SONARA_VERTEX_SERVICE_ACCOUNT_JSON || '').trim();\n  if (separateServiceAccount) return cert(JSON.parse(separateServiceAccount));\n  return app.options.credential;\n}\n\nfunction hasVertexCredential(app: App) {\n  return Boolean(String(process.env.SONARA_VERTEX_SERVICE_ACCOUNT_JSON || '').trim() || app.options.credential);\n}\n\nasync function vertexAccessToken(app: App) {\n  const credential = vertexCredential(app);\n  if (!credential) throw new Error('Google service account credential non disponibile.');\n  const token = await credential.getAccessToken();\n  if (!token?.access_token) throw new Error('Impossibile ottenere un access token Google Cloud.');\n  return token.access_token;\n}",
            'separate Vertex project and credential'
          );

          replaceExact(
            'api/video/provider.ts',
            "  if (projectId(app) && app.options.credential) return 'vertex';",
            "  if (projectId(app) && hasVertexCredential(app)) return 'vertex';",
            'Vertex readiness with separate credential'
          );

          replaceExact(
            '.env.example',
            "GEMINI_API_KEY=\n# Optional override. By default SONARA uses Veo 3.1 Lite for Free and Veo 3.1 Fast for Creator/Studio.\nSONARA_VIDEO_MODEL=",
            "GEMINI_API_KEY=\n# Optional failover: run Vertex AI on a Google Cloud project separate from Firebase.\nSONARA_VERTEX_PROJECT_ID=\nSONARA_VERTEX_SERVICE_ACCOUNT_JSON=\n# Optional override. By default SONARA uses Veo 3.1 Lite for Free and Veo 3.1 Fast for Creator/Studio.\nSONARA_VIDEO_MODEL=",
            'document Vertex failover env vars'
          );

          console.log('Separate SONARA Vertex project failover support applied.');
          NODE

      - name: Validate production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit implementation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/video/provider.ts .env.example
          git rm .github/workflows/apply-vertex-project-failover.yml
          git commit -m "feat(video): support separate Vertex failover project"
          git push origin HEAD:main
