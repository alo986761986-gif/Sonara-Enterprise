name: Deploy SONARA Quality 47 Rescue V1

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-47-rescue-v1.py"
      - "cloudflare/sonara-quality-47-rescue-v1.test.mjs"
      - "scripts/sonara-quality-47-rescue-e2e.mjs"
      - ".github/workflows/deploy-quality-47-rescue-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonara-quality-47-rescue-v1-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_BROWSER_UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36
      API_ORIGIN: https://api.sonaraenterprise.com
      WEB_ORIGIN: https://sonaraenterprise.com

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply Quality 47 rescue
        run: python scripts/patch-quality-47-rescue-v1.py

      - name: Validate rescue and existing contracts
        run: |
          node --check cloudflare/sonara-molab-xl-router.mjs
          node cloudflare/sonara-quality-47-rescue-v1.test.mjs
          node cloudflare/sonara-natural-tone-v14.test.mjs
          node cloudflare/sonara-rich-arrangement-v13.test.mjs
          node scripts/verify-quality-latency-v14.mjs

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Verify MoLab RTX endpoint
        shell: bash
        run: |
          set -euo pipefail
          trigger=".github/molab-xl-trigger"
          url="$(sed -n 's/^SONARA_MOLAB_XL_URL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          model="$(sed -n 's/^MODEL=//p' "${trigger}" | tail -n 1 | tr -d '\r')"
          test "${model}" = "acestep-v15-xl-turbo"
          echo "MOLAB_XL_URL=${url%/}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 8); do
            health="$(curl -fsS --connect-timeout 8 --max-time 15 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' "${url%/}/health" || true)"
            if [[ -n "${health}" ]] && printf '%s' "${health}" | jq -e 'def d: (.data // .); (((d.status // "") | tostring | ascii_downcase) | IN("ok","ready","healthy","online","success")) and ((d.models_initialized // true) == true)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          account_id="${CLOUDFLARE_ACCOUNT_ID}"
          if [[ -z "${account_id}" ]]; then
            zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
            account_id="$(printf '%s' "${zone_response}" | jq -r '.result[] | select(.name == "sonaraenterprise.com") | .account.id' | head -n 1)"
          fi
          test -n "${account_id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${MOLAB_XL_URL}" | npx --yes wrangler@latest secret put SONARA_MOLAB_XL_URL --config wrangler.jsonc
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify live readiness marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            response="$(curl -sS --max-time 30 -A "${SONARA_BROWSER_UA}" -H 'Accept: application/json' -H 'Cache-Control: no-cache' "https://api.sonaraenterprise.com/api/molab/ready?q47=${GITHUB_SHA}-${attempt}" || true)"
            if [[ -n "${response}" ]] && printf '%s' "${response}" | jq -e '.ready == true and .quality47RescueProfile == "sonara-quality-47-rescue-v1" and .naturalToneProfile == "sonara-natural-tone-v14" and .qualityInferenceSteps == 2 and .maxBatchSize == 2' >/dev/null 2>&1; then
              echo 'SONARA_QUALITY_47_RESCUE_READINESS=PASS'
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Run live Quality 47 rescue canary
        run: node --import ./scripts/sonara-e2e-browser-origin.mjs scripts/sonara-quality-47-rescue-e2e.mjs

      - name: Persist production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sonara-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-molab-xl-router.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: activate Quality 47.4 completion rescue"
          for attempt in 1 2; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
