name: SONARA Remix Pro Integration Safety
on:
  pull_request:
    paths:
      - 'cloudflare/sonara-remix-pro-r2.mjs'
      - 'cloudflare/sonara-remix-pro-audio-formats.mjs'
      - 'cloudflare/sonara-remix-pro-r2.test.mjs'
      - 'cloudflare/sonara-long-wav-upload.mjs'
      - 'cloudflare/sonara-long-wav-upload.test.mjs'
      - 'cloudflare/sonara-remix-pro-usage.test.mjs'
      - 'cloudflare/sonara-native-auth.mjs'
      - 'cloudflare/sonara-r2-https-relay.mjs'
      - 'cloudflare/sonara-ab-player-visibility-edge.mjs'
      - 'cloudflare/sonara-relay-gateway-entry.mjs'
      - 'cloudflare/sonara-remix-pro-duration-edge.mjs'
      - 'cloudflare/sonara-remix-pro-duration-edge.test.mjs'
      - 'src/components/remix/SonaraRemixProPanel.tsx'
      - 'src/components/remix/SonaraRemixSection.tsx'
      - 'molab/sonara_remix_pro_r2_agent.py'
      - 'molab/test_sonara_remix_pro_multiformat.py'
      - 'molab/test_sonara_remix_pro_import_path.py'
      - 'molab/test_sonara_remix_pro_r2_download.py'
      - 'molab/test_sonara_remix_pro_wavex.py'
      - 'molab/sonara_remix_pro_live_qa.py'
      - 'molab/test_sonara_remix_pro_live_qa.py'
      - '.github/workflows/test-sonara-remix-pro-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gated-pro-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pro billing and source ownership tests
        run: node --test cloudflare/sonara-remix-pro-r2.test.mjs
      - name: Durable Remix Pro native quota accounting tests
        run: node --test cloudflare/sonara-remix-pro-usage.test.mjs
      - name: Legacy Vercel 8-minute duration selector integration
        run: node --test cloudflare/sonara-remix-pro-duration-edge.test.mjs
      - name: Private long WAV multipart and nine-minute source validation
        run: node --test cloudflare/sonara-long-wav-upload.test.mjs
      - name: Legacy Remix R2 remains unchanged
        run: node --test cloudflare/sonara-remix-r2.test.mjs
      - name: MoLab Python syntax only (never downloads models)
        run: python3 -m py_compile molab/sonara_remix_pro_r2_agent.py
      - name: Install real FFmpeg audio decoder for non-skipped codec tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Private R2 ranged download and safe error regression tests
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_r2_download.py' -v
      - name: Real libsndfile WAVEX PCM and float regression tests
        run: |
          python3 -m pip install --user soundfile==0.13.1
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_wavex.py' -v
      - name: Real offline MP3 decoder and video rejection tests
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_multiformat.py' -v
      - name: Verify Marimo Python import path regression
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_import_path.py' -v
      - name: Verify isolated real two-WAV QA runner
        run: |
          python3 -m py_compile molab/sonara_remix_pro_live_qa.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_live_qa.py' -v
      - name: Build actual SONARA site
        run: |
          npm install
          npm run build
      - name: Read-only live Cloudflare duration and Pro revision probe
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const targets=[
            ['site','https://sonaraenterprise.com/'],
            ['apiHealth','https://api.sonaraenterprise.com/api/health'],
            ['proCapabilities','https://api.sonaraenterprise.com/api/sonara-relay/pro-capabilities']
          ];
          for(const [label,url] of targets){
            try {
              const response=await fetch(url,{
                redirect:'follow',
                signal:AbortSignal.timeout(12000),
                headers:{'accept':'text/html,application/json'}
              });
              const body=await response.text();
              const report={
                target:label,
                httpStatus:response.status,
                cloudflare:Boolean((response.headers.get('server')||'').includes('cloudflare')),
                durationBridgeInjected:label==='site'?body.includes('sonara-remix-pro-duration-edge-v1'):undefined,
                version:response.headers.get('x-sonara-ab-player-fix')||undefined
              };
              if(label==='proCapabilities'&&response.ok){
                const data=JSON.parse(body);
                report.available=data.available===true;
                report.expectedAgentRevision=typeof data.expectedAgentRevision==='string'
                  ?data.expectedAgentRevision.slice(0,100):null;
                report.gpuReady=data.gpuReady===true;
              }
              console.log('SONARA_LIVE_READONLY',JSON.stringify(report));
            } catch(err){
              console.log('SONARA_LIVE_READONLY',JSON.stringify({
                target:label,reachable:false,errorClass:err?.name||'UnknownError'
              }));
            }
          }
          NODE
      - name: Probe Cloudflare isolated Snippets availability (read-only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token){console.log('SONARA_SNIPPETS_PROBE',JSON.stringify({tokenConfigured:false}));process.exit(0);}
          const headers={Authorization:'Bearer '+token,Accept:'application/json'};
          const zones=await fetch('https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=20',{headers,signal:AbortSignal.timeout(15000)});
          const zoneBody=await zones.json().catch(()=>({}));
          const zone=zoneBody.result?.find(x=>x.name==='sonaraenterprise.com');
          if(!zone){console.log('SONARA_SNIPPETS_PROBE',JSON.stringify({tokenConfigured:true,zoneAccessible:false,zoneHttpStatus:zones.status}));process.exit(0);}
          for(const [name,path] of [
            ['snippet_rules','/zones/'+zone.id+'/snippets/snippet_rules'],
            ['snippets','/zones/'+zone.id+'/snippets']
          ]){
            try{
              const res=await fetch('https://api.cloudflare.com/client/v4'+path,{headers,signal:AbortSignal.timeout(15000)});
              const body=await res.json().catch(()=>({}));
              console.log('SONARA_SNIPPETS_PROBE',JSON.stringify({
                resource:name,httpStatus:res.status,success:body.success===true,
                count:Array.isArray(body.result)?body.result.length:null,
                errors:Array.isArray(body.errors)?body.errors.map(e=>e.code).slice(0,4):[]
              }));
            }catch(e){
              console.log('SONARA_SNIPPETS_PROBE',JSON.stringify({resource:name,errorClass:e?.name||'Error'}));
            }
          }
          NODE
