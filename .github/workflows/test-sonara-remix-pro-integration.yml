name: SONARA Remix Pro Integration Safety
on:
  pull_request:
    paths:
      - 'cloudflare/sonara-remix-pro-r2.mjs'
      - 'cloudflare/sonara-remix-pro-v6-controls.mjs'
      - 'cloudflare/sonara-remix-pro-v6-controls.test.mjs'
      - 'cloudflare/sonara-remix-pro-audio-formats.mjs'
      - 'cloudflare/sonara-remix-pro-r2.test.mjs'
      - 'cloudflare/sonara-long-wav-upload.mjs'
      - 'cloudflare/sonara-long-wav-upload.test.mjs'
      - 'cloudflare/sonara-remix-pro-usage.test.mjs'
      - 'cloudflare/sonara-native-auth.mjs'
      - 'cloudflare/sonara-r2-https-relay.mjs'
      - 'cloudflare/sonara-ab-player-visibility-edge.mjs'
      - 'cloudflare/sonara-remix-pro-duration-edge.mjs'
      - 'cloudflare/sonara-remix-pro-duration-edge.test.mjs'
      - 'src/components/remix/SonaraRemixProPanel.tsx'
      - 'src/components/remix/SonaraRemixSection.tsx'
      - 'molab/sonara_remix_pro_r2_agent.py'
      - 'molab/sonara_remix_pro_v5.py'
      - 'molab/sonara_remix_pro_v6.py'
      - 'molab/test_sonara_remix_pro_v6.py'
      - 'molab/test_sonara_remix_pro_v5.py'
      - 'molab/sonara_remix_pro_gpu_v5_handoff.py'
      - 'molab/test_sonara_remix_gpu_v5_handoff.py'
      - 'molab/sonara_remix_pro_ace_bridge.py'
      - 'molab/sonara_remix_pro_gpu_v41_hotfix.py'
      - 'molab/test_sonara_remix_gpu_v41_diagnostics.py'
      - 'molab/test_sonara_remix_gpu_v41_handoff.py'
      - 'molab/install_sonara_remix_quality_v4.py'
      - 'molab/test_sonara_remix_quality_v4_installer.py'
      - 'molab/activate_sonara_remix_pro_v4.py'
      - 'molab/test_activate_sonara_remix_pro_v4.py'
      - 'molab/sonara_remix_pro_v3_gpu_qa.py'
      - 'molab/test_sonara_remix_pro_v3_gpu_qa.py'
      - 'molab/sonara_remix_pro_fusion.py'
      - 'molab/test_sonara_remix_pro_fusion.py'
      - 'molab/test_sonara_remix_pro_multiformat.py'
      - 'molab/test_sonara_remix_pro_import_path.py'
      - 'molab/test_sonara_remix_pro_r2_download.py'
      - 'molab/test_sonara_remix_pro_wavex.py'
      - 'molab/sonara_remix_pro_live_qa.py'
      - 'molab/test_sonara_remix_pro_live_qa.py'
      - '.github/workflows/deploy-sonara-relay-pairing.yml'
      - '.github/workflows/test-sonara-remix-pro-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gated-pro-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only Cloudflare public status snapshot (non-blocking)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for (const [label, url] of [
            ["SONARA_PUBLIC_WEB", "https://sonaraenterprise.com/"],
            ["SONARA_PUBLIC_PRO", "https://api.sonaraenterprise.com/api/sonara-relay/pro-capabilities"]
          ]) {
            try {
              const response = await fetch(url, {
                headers: { "accept": "application/json,text/html", "cache-control": "no-cache",
                           "user-agent": "SONARA-Remix-Pro-ReadOnly-Health/1.0" },
                redirect: "manual",
                signal: AbortSignal.timeout(12000),
              });
              console.log(label + "_HTTP=" + response.status);
              if (label === "SONARA_PUBLIC_PRO" && response.ok) {
                const data = await response.json().catch(() => ({}));
                console.log("SONARA_PUBLIC_EXPECTED_V3=" +
                  String(data?.expectedAgentRevision === "sonara-remix-pro-r2-agent-v3-dual-reference-fusion"));
                console.log("SONARA_PUBLIC_PRO_AVAILABLE=" + String(data?.available === true));
                console.log("SONARA_PUBLIC_FUSION_AVAILABLE=" + String(data?.fusionAvailable === true));
              }
            } catch {
              console.log(label + "_REACHABLE=false");
            }
          }
          NODE
      - name: Guard Cloudflare release requires V3 fusion (no stale V2 gate)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const text = readFileSync('.github/workflows/deploy-sonara-relay-pairing.yml', 'utf8');
          const guard = text.split('Verify live Remix Pro availability after deploy')[1] || '';
          assert.match(guard, /s\.fusionAvailable===true/);
          assert.match(guard, /s\.expectedAgentRevision==='sonara-remix-pro-r2-agent-v3-dual-reference-fusion'/);
          assert.doesNotMatch(guard, /s\.expectedAgentRevision==='sonara-remix-pro-r2-agent-v2-longwav'/);
          console.log('SONARA_CLOUDFLARE_RELEASE_V3_FUSION_GUARD=PASS');
          NODE
      - name: Pro billing and source ownership tests
        run: node --test cloudflare/sonara-remix-pro-r2.test.mjs
      - name: V6 bounded DNA controls and safe V5 fallback
        run: node --test cloudflare/sonara-remix-pro-v6-controls.test.mjs
      - name: V6 offline creative composition and measured analysis
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_v6.py' -v
      - name: V6 GPU agent syntax (no GPU job generated)
        run: python3 -m py_compile molab/sonara_remix_pro_v6.py molab/sonara_remix_pro_v5.py molab/sonara_remix_pro_r2_agent.py
      - name: Durable Remix Pro native quota accounting tests
        run: node --test cloudflare/sonara-remix-pro-usage.test.mjs
      - name: Legacy Vercel 8-minute duration selector integration
        run: node --test cloudflare/sonara-remix-pro-duration-edge.test.mjs
      - name: Private long WAV multipart and nine-minute source validation
        run: node --test cloudflare/sonara-long-wav-upload.test.mjs
      - name: Legacy Remix R2 remains unchanged
        run: node --test cloudflare/sonara-remix-r2.test.mjs
      - name: Verify V3 dual-reference fusion module offline
        run: |
          python3 -m pip install --user numpy soundfile
          python3 -m py_compile molab/sonara_remix_pro_fusion.py molab/sonara_remix_pro_ace_bridge.py molab/sonara_remix_pro_r2_agent.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_fusion.py' -v
      - name: Verify pinned V4 installer without installing or contacting MoLab
        run: |
          python3 -m py_compile molab/install_sonara_remix_quality_v4.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_quality_v4_installer.py' -v
      - name: Validate read-only V3 GPU acceptance runner
        run: |
          python3 -m py_compile molab/sonara_remix_pro_v3_gpu_qa.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_v3_gpu_qa.py' -v
      - name: Verify guarded V3-to-V4 worker handoff without GPU or network
        run: |
          python3 -m py_compile molab/activate_sonara_remix_pro_v4.py
          python3 -m unittest discover -s molab -p 'test_activate_sonara_remix_pro_v4.py' -v
      - name: MoLab Python syntax only (never downloads models)
        run: python3 -m py_compile molab/sonara_remix_pro_r2_agent.py
      - name: Install real FFmpeg audio decoder for non-skipped codec tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Private R2 ranged download and safe error regression tests
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_r2_download.py' -v
      - name: Real libsndfile WAVEX PCM and float regression tests
        run: |
          python3 -m pip install --user soundfile==0.13.1
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_wavex.py' -v
      - name: Real offline MP3 decoder and video rejection tests
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_multiformat.py' -v
      - name: Verify Marimo Python import path regression
        run: python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_import_path.py' -v
      - name: Verify isolated real two-WAV QA runner
        run: |
          python3 -m py_compile molab/sonara_remix_pro_live_qa.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_live_qa.py' -v
      - name: Validate detailed V4.1 GPU errors and isolated hotfix without audio generation
        run: |
          python3 -m py_compile molab/sonara_remix_pro_gpu_v41_hotfix.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_gpu_v41_diagnostics.py' -v
          python3 -m unittest discover -s molab -p 'test_sonara_remix_gpu_v41_handoff.py' -v
      - name: Validate V4.2 quality gate false-rejection regression and pinned isolated handoff
        run: |
          python3 -m pip install --user scipy pyloudnorm
          python3 -m py_compile molab/sonara_remix_pro_quality.py molab/sonara_remix_pro_r2_agent.py molab/sonara_remix_pro_gpu_v42_quality_hotfix.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_gpu_v42_quality_handoff.py' -v
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_quality.py' -v
      - name: Validate Remix Pro V5 six pillars with real synthetic WAV
        run: |
          python3 -m pip install --user numpy soundfile scipy pyloudnorm librosa
          python3 -m py_compile molab/sonara_remix_pro_v5.py molab/sonara_remix_pro_r2_agent.py
          python3 -m unittest discover -s molab -p 'test_sonara_remix_pro_v5.py' -v
          python3 -m unittest discover -s molab -p 'test_sonara_remix_gpu_v5_handoff.py' -v
      - name: Build actual SONARA site
        run: |
          npm install
          npm run build
