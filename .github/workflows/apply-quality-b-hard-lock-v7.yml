name: Apply QUALITY B Hard Lock V7

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-b-hard-lock-v7.py"
      - ".github/workflows/apply-quality-b-hard-lock-v7.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-quality-b-hard-lock-v7.py
      - run: node --check cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: node --check cloudflare/sonara-molab-xl-router.mjs
      - run: grep -Fq 'QUALITY B HARD-LOCK V7' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'qualityPairCoherence' cloudflare/sonara-quality-ultra-stability-guard.mjs
      - run: grep -Fq 'sonara_quality_b_hard_lock_v7' cloudflare/sonara-molab-xl-router.mjs
      - run: |
          git config user.name "SONARA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare/sonara-quality-ultra-stability-guard.mjs cloudflare/sonara-molab-xl-router.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quality): hard-lock B to A prompt identity v7"
          git push origin HEAD:main

# trigger-v7: 2026-09-03
