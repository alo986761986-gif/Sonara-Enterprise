name: SONARA Fusion V3 - Cloudflare only (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "gateway: stage backward-compatible gateway; final: activate UI after V3 MoLab QA"
        required: true
        type: choice
        options:
          - gateway
          - final
      queue_drained:
        description: "Confirmed V2 Pro queue drained and no leased jobs"
        required: true
        type: boolean
        default: false
      rollback_saved:
        description: "Confirmed existing Cloudflare Worker version and assets saved for rollback"
        required: true
        type: boolean
        default: false
      gpu_qa_approved:
        description: "Two authorized WAVs were actually generated on MoLab V3 and reviewed by listening"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sonara-fusion-cloudflare-only-production
  cancel-in-progress: false

jobs:
  guarded-cloudflare-release:
    name: One authorized Cloudflare-only release
    if: ${{ inputs.queue_drained && inputs.rollback_saved && (inputs.stage == 'gateway' || inputs.gpu_qa_approved) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sonara-cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SONARA_FUSION_CLOUDFLARE_RELEASE: "yes"
      SONARA_RELEASE_STAGE: ${{ inputs.stage }}
      SONARA_PRO_QUEUE_DRAINED: ${{ inputs.queue_drained && 'yes' || 'no' }}
      SONARA_ROLLBACK_SAVED: ${{ inputs.rollback_saved && 'yes' || 'no' }}
      SONARA_FUSION_QA_APPROVED: ${{ inputs.gpu_qa_approved && 'yes' || 'no' }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require validated SONARA Remix Fusion release source
        shell: bash
        run: |
          set -euo pipefail
          test -f molab/sonara_remix_pro_fusion.py
          test -f molab/sonara_remix_pro_ace_bridge.py
          test -f scripts/deploy-remix-fusion-cloudflare.cjs
          grep -Fq 'sonara-remix-pro-r2-agent-v3-dual-reference-fusion' cloudflare/sonara-remix-pro-r2.mjs
          grep -Fq "fusionAvailable" cloudflare/sonara-remix-pro-r2.mjs
          node --check scripts/deploy-remix-fusion-cloudflare.cjs
          node --check cloudflare/sonara-remix-pro-r2.mjs
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies, no other host
        run: npm ci
      - name: Verify Remix Pro Cloudflare API safety tests
        run: node --test cloudflare/sonara-remix-pro-r2.test.mjs
      - name: Resolve Cloudflare account ID securely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            zone_response="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50")"
            account_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload=JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone=Array.isArray(payload.result) ? payload.result.find(z=>z?.name==='sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.account?.id||''));
          NODE
            )"
            test -n "${account_id}"
            echo "::add-mask::${account_id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"
          fi
      - name: Protected release to Cloudflare only
        run: node scripts/deploy-remix-fusion-cloudflare.cjs
      - name: Report protected deployment result
        run: |
          echo "SONARA_RELEASE_PLATFORM=CLOUDFLARE"
          echo "SONARA_FUSION_DEPLOY_STAGE=${SONARA_RELEASE_STAGE}"
