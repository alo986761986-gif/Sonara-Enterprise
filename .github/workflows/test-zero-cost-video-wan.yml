name: Test Zero Cost Video WAN

on:
  push:
    branches:
      - feature/zero-cost-video-wan21-kaggle
    paths:
      - "cloudflare/sonara-video-api-recovery.mjs"
      - "cloudflare/sonara-video-api-recovery.test.mjs"
      - "scripts/kaggle-sonara-wan21-video-worker.py"
      - ".github/workflows/test-zero-cost-video-wan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Cloudflare zero-cost video router
        run: node cloudflare/sonara-video-api-recovery.test.mjs
      - name: Compile Kaggle WAN worker bootstrap
        run: python -m py_compile scripts/kaggle-sonara-wan21-video-worker.py
      - name: Assert Google video is opt-in only
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SONARA_ENABLE_GEMINI_VIDEO" cloudflare/sonara-video-api-recovery.mjs
          grep -q "SONARA_ZERO_COST_VIDEO" cloudflare/sonara-video-api-recovery.mjs
          grep -q "SONARA_VIDEO_WORKER_URL" cloudflare/sonara-video-api-recovery.mjs
          grep -q "Wan-AI/Wan2.1-T2V-1.3B-Diffusers" scripts/kaggle-sonara-wan21-video-worker.py
          echo "Zero-cost video guard present."
      - name: Verify live WAN FAST profile
        shell: bash
        run: |
          set -euo pipefail
          gpu1="$(sed -n 's/^GPU1=//p' .github/kaggle-workers-trigger | tail -n1 | tr -d '\r')"
          test -n "${gpu1}"
          response="$(curl -fsS --connect-timeout 10 --max-time 30 "${gpu1%/}/health")"
          printf '%s' "$response" > /tmp/wan-fast-health.json
          node - <<'NODE'
          const h = JSON.parse(require('fs').readFileSync('/tmp/wan-fast-health.json','utf8'));
          if (h.status !== 'ok') throw new Error(`WAN unhealthy: ${JSON.stringify(h)}`);
          if (h.provider !== 'kaggle-wan21') throw new Error(`Unexpected provider: ${h.provider}`);
          if (h.profile !== 'fast-t4-v2' || h.fastMode !== true) throw new Error(`FAST profile not active: ${JSON.stringify(h)}`);
          if (Number(h.steps) !== 16) throw new Error(`Unexpected steps: ${h.steps}`);
          if (String(h.resolution) !== '768x432') throw new Error(`Unexpected resolution: ${h.resolution}`);
          if (Number(h.fps) !== 10 || Number(h.frames) !== 81) throw new Error(`Unexpected timing: ${JSON.stringify(h)}`);
          console.log('LIVE_WAN_FAST_OK', JSON.stringify(h));
          NODE
      - name: Verify SONARA zero-cost edge remains live
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/api/video/edge-health?verify_fast=${GITHUB_SHA}")"
          printf '%s' "$response" > /tmp/edge-health.json
          node - <<'NODE'
          const h = JSON.parse(require('fs').readFileSync('/tmp/edge-health.json','utf8'));
          if (h.valid !== true || h.provider !== 'kaggle-wan21') throw new Error(`WAN edge invalid: ${JSON.stringify(h)}`);
          if (h.zeroCost !== true || h.googleBillingRequired !== false || h.geminiEnabled !== false) throw new Error(`Cost guard invalid: ${JSON.stringify(h)}`);
          console.log('LIVE_ZERO_COST_EDGE_OK', JSON.stringify(h));
          NODE
