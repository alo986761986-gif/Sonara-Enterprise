name: Verify SONARA V7 Reconnect And Public Release

on:
  pull_request:
    branches: [main]
    paths:
      - "molab/sonara_v7_full_runtime_reconnect.py"
      - "molab/test_sonara_v7_full_runtime_reconnect.py"
      - ".github/workflows/verify-sonara-v7-live-recovery.yml"
  push:
    branches: [ops/sonara-v7-public-ready-reconnect-20261112]
    paths:
      - "molab/sonara_v7_full_runtime_reconnect.py"
      - "molab/test_sonara_v7_full_runtime_reconnect.py"
      - ".github/workflows/verify-sonara-v7-live-recovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile guarded reconnect and safety tests
        run: python -m py_compile molab/sonara_v7_full_runtime_reconnect.py molab/test_sonara_v7_full_runtime_reconnect.py
      - name: Test offline no-duplicate and revision guards
        run: python -m unittest discover -s molab -p 'test_sonara_v7_full_runtime_reconnect.py' -v
      - name: Verify latest SONARA V7 modes exist in public Git commit
        run: |
          set -euo pipefail
          grep -Fq 'v7CreativeModesAvailable' cloudflare/sonara-remix-pro-r2.mjs
          grep -Fq 'v7RhythmAvailable' cloudflare/sonara-remix-pro-r2.mjs
          grep -Fq 'MODALITÀ V7 DIFFERENZIATE ATTIVE' src/components/remix/SonaraRemixProPanel.tsx
          grep -Fq 'RHYTHM & TEMPO LOCK' src/components/remix/SonaraRemixProPanel.tsx
          grep -Fq 'V7_MODE_AUDIO_REVISION' molab/sonara_remix_pro_v7.py
