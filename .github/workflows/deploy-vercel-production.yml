name: Deploy SONARA Web to Vercel Production

# Production deployment is normally handled by Vercel's native Git integration.
# Keep this workflow manual-only as an emergency/retry path so each push does not
# create a second production deployment and exhaust Vercel's daily deployment quota.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and verify SONARA web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_d9jPexmsm0saAlZPAznj0TTy
      VERCEL_PROJECT_ID: prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout SONARA main
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Vercel deployment credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Missing GitHub Actions secret VERCEL_TOKEN." >&2
            exit 1
          fi
          echo "Vercel production credential is configured."

      - name: Report Professional Lyrics v2 source markers
        shell: bash
        run: |
          set -u
          missing=0
          check_marker() {
            local marker="$1"
            local file="$2"
            if [[ -f "$file" ]] && grep -q "$marker" "$file"; then
              echo "OK: $marker in $file"
            else
              echo "WARNING: optional marker '$marker' not found in $file"
              missing=$((missing + 1))
            fi
          }
          check_marker "buildProfessionalLyricsFallback" "src/professionalLyrics.ts"
          check_marker "smartRandom" "api/lyrics.ts"
          check_marker "INTELLIGENTE" "scripts/activate-universal-genres.cjs"
          check_marker "professionalLyrics.quality.test.ts" "scripts/build-dispatch.cjs"
          echo "Optional source marker check completed; missing=${missing}. Deployment will continue."

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link exact SONARA Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_d9jPexmsm0saAlZPAznj0TTy","projectId":"prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ"}' > .vercel/project.json

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build SONARA production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}" | tail -n 1 | tr -d '\r')"
          if [[ "${DEPLOY_URL}" != https://* ]]; then
            echo "Unexpected Vercel deployment output: ${DEPLOY_URL}" >&2
            exit 1
          fi
          echo "url=${DEPLOY_URL}" >> "${GITHUB_OUTPUT}"
          echo "SONARA production deployment: ${DEPLOY_URL}"

      - name: Verify intelligent lyrics API on deployment
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --max-time 30 -H 'Content-Type: application/json' -d '{"language":"it","languageName":"Italian","genreFamily":"Pop","genre":"Pop","subgenre":"Dance Pop","mood":"Uplifting","vocalMode":"female","variant":987654321,"durationSec":180,"bpm":118,"smartRandom":true}' "${DEPLOY_URL}/api/lyrics")"
          printf '%s' "${response}" > /tmp/lyrics-smart.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/lyrics-smart.json', 'utf8'));
          if (data.smartRandom !== true) throw new Error('smartRandom flag missing from deployed API');
          if (!String(data.lyrics || '').trim()) throw new Error('deployed intelligent lyrics are empty');
          if (!String(data.quality || '').includes('intelligent-random-v3')) throw new Error(`unexpected quality marker: ${data.quality}`);
          console.log(`Intelligent lyrics API verified: ${data.source}`);
          NODE

      - name: Verify INTELLIGENTE button in deployed bundle
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${DEPLOY_URL}/")"
          mapfile -t assets < <(printf '%s' "${html}" | grep -oE 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | sort -u)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No JavaScript assets found in deployed page." >&2
            exit 1
          fi
          found=0
          for asset in "${assets[@]}"; do
            if [[ "${asset}" == http* ]]; then url="${asset}"; else url="${DEPLOY_URL}${asset}"; fi
            if curl -fsS --max-time 30 "${url}" | grep -q 'INTELLIGENTE'; then
              found=1
              echo "INTELLIGENTE button marker found in ${asset}"
              break
            fi
          done
          if [[ ${found} -ne 1 ]]; then
            echo "INTELLIGENTE button marker not found in deployed JavaScript bundle." >&2
            exit 1
          fi

      - name: Purge Cloudflare web cache
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
          zone_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.id || ''));
          NODE
          )"
          if [[ -z "${zone_id}" ]]; then
            echo "Cloudflare zone not resolved; skipping purge." >&2
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data '{"purge_everything":true}' "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" > /tmp/cf-purge.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/cf-purge.json', 'utf8'));
          if (data.success !== true) throw new Error('Cloudflare purge failed');
          console.log('Cloudflare cache purged.');
          NODE

      - name: Verify public production site contains INTELLIGENTE
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            html="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?deploy=${GITHUB_SHA}-${attempt}" || true)"
            mapfile -t assets < <(printf '%s' "${html}" | grep -oE 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | sort -u)
            for asset in "${assets[@]}"; do
              if [[ "${asset}" == http* ]]; then url="${asset}"; else url="https://sonaraenterprise.com${asset}"; fi
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}" | grep -q 'INTELLIGENTE'; then
                echo "Public SONARA production verified with INTELLIGENTE button."
                exit 0
              fi
            done
            echo "Public bundle not refreshed yet (attempt ${attempt}/12)."
            sleep 5
          done
          echo "Public SONARA bundle does not expose INTELLIGENTE after production deployment." >&2
          exit 1
