name: Deploy SONARA Web to Vercel Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/vercel-release-trigger

permissions:
  contents: read

concurrency:
  group: sonara-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and verify SONARA web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_d9jPexmsm0saAlZPAznj0TTy
      VERCEL_PROJECT_ID: prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout SONARA main
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Creator Audio source
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/generator/SonaraCreatorAudioHub.tsx
          grep -Fq 'I miei brani' src/components/generator/SonaraCreatorAudioHub.tsx
          grep -Fq 'Carica audio' src/components/generator/SonaraCreatorAudioHub.tsx
          grep -Fq 'Registra voce' src/components/generator/SonaraCreatorAudioHub.tsx
          grep -Fq 'SonaraCreatorAudioHub' src/main.tsx
          echo 'Creator Audio source verified.'

      - name: Validate Vercel deployment credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Missing GitHub Actions secret VERCEL_TOKEN." >&2
            exit 1
          fi
          echo "Vercel production credential is configured."

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link exact SONARA Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_d9jPexmsm0saAlZPAznj0TTy","projectId":"prj_mbAUXtVS9ecRbl0yAZfeR3WA66TZ"}' > .vercel/project.json

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build SONARA production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Verify Creator Audio in built artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'I miei brani' .vercel/output/static/assets
          grep -R -Fq 'Carica audio' .vercel/output/static/assets
          grep -R -Fq 'Registra voce' .vercel/output/static/assets
          echo 'Creator Audio hub verified in built production artifact.'

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}" | tail -n 1 | tr -d '\r')"
          if [[ "${DEPLOY_URL}" != https://* ]]; then
            echo "Unexpected Vercel deployment output: ${DEPLOY_URL}" >&2
            exit 1
          fi
          echo "url=${DEPLOY_URL}" >> "${GITHUB_OUTPUT}"
          echo "SONARA production deployment: ${DEPLOY_URL}"

      - name: Verify Creator Audio hub in deployed bundle
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${DEPLOY_URL}/")"
          mapfile -t assets < <(printf '%s' "${html}" | grep -oE 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | sort -u)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No JavaScript assets found in deployed page." >&2
            exit 1
          fi
          found=0
          for asset in "${assets[@]}"; do
            if [[ "${asset}" == http* ]]; then url="${asset}"; else url="${DEPLOY_URL}${asset}"; fi
            curl -fsS --max-time 30 "${url}" -o /tmp/sonara-bundle.js
            if grep -Fq 'I miei brani' /tmp/sonara-bundle.js \
              && grep -Fq 'Carica audio' /tmp/sonara-bundle.js \
              && grep -Fq 'Registra voce' /tmp/sonara-bundle.js; then
              echo "Creator Audio hub verified in ${asset}."
              found=1
              break
            fi
          done
          if [[ "${found}" != "1" ]]; then
            echo "Creator Audio hub markers not found in deployed JavaScript bundle." >&2
            exit 1
          fi

      - name: Purge Cloudflare web cache
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          zone_response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=sonaraenterprise.com&per_page=50')"
          zone_id="$(CF_RESPONSE="${zone_response}" node - <<'NODE'
          const payload = JSON.parse(process.env.CF_RESPONSE || '{}');
          const zone = Array.isArray(payload.result) ? payload.result.find(item => item?.name === 'sonaraenterprise.com') : null;
          process.stdout.write(String(zone?.id || ''));
          NODE
          )"
          if [[ -z "${zone_id}" ]]; then
            echo "Cloudflare zone not resolved." >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" > /tmp/cf-purge.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/cf-purge.json', 'utf8'));
          if (data.success !== true) throw new Error('Cloudflare purge failed');
          console.log('Cloudflare cache purged.');
          NODE

      - name: Verify public production contains Creator Audio hub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            html="$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com/?creator_audio=${GITHUB_SHA}-${attempt}" || true)"
            mapfile -t assets < <(printf '%s' "${html}" | grep -oE 'src="[^"]+\.js"' | sed -E 's/^src="|"$//g' | sort -u)
            for asset in "${assets[@]}"; do
              if [[ "${asset}" == http* ]]; then url="${asset}"; else url="https://sonaraenterprise.com${asset}"; fi
              if curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${url}" -o /tmp/sonara-public-bundle.js; then
                if grep -Fq 'I miei brani' /tmp/sonara-public-bundle.js \
                  && grep -Fq 'Carica audio' /tmp/sonara-public-bundle.js \
                  && grep -Fq 'Registra voce' /tmp/sonara-public-bundle.js; then
                  echo "Public SONARA production verified with Creator Audio hub."
                  exit 0
                fi
              fi
            done
            echo "Public Creator Audio bundle not refreshed yet (attempt ${attempt}/18)."
            sleep 5
          done
          echo "Public SONARA bundle does not expose Creator Audio hub after production deployment." >&2
          exit 1
