name: Verify SONARA Video UI Production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-video-ui-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public production bundle
        shell: bash
        run: |
          set -euo pipefail
          root='https://sonaraenterprise.com/'
          for attempt in {1..12}; do
            code="$(curl -sS -L -o /tmp/sonara.html -D /tmp/sonara.headers -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "${root}?video_ui_check=${GITHUB_SHA}-${attempt}" || true)"
            asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/sonara.html | head -n1 || true)"
            echo "attempt=${attempt} HTTP=${code} ASSET=${asset}"
            if [ "${code}" = "200" ] && [ -n "${asset}" ]; then
              asset_code="$(curl -sS -L -o /tmp/sonara.js -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "https://sonaraenterprise.com${asset}?video_ui_check=${GITHUB_SHA}-${attempt}" || true)"
              echo "asset_HTTP=${asset_code}"
              if [ "${asset_code}" = "200" ] \
                && grep -q 'CANCELLA' /tmp/sonara.js \
                && grep -q 'RANDOM' /tmp/sonara.js \
                && grep -q 'INTELLIGENTE' /tmp/sonara.js \
                && grep -q '2 min' /tmp/sonara.js; then
                echo "PUBLIC_VIDEO_UI_PRODUCTION_OK=1"
                echo "PUBLIC_ASSET=${asset}"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "Public SONARA production bundle does not contain all Video AI controls." >&2
          exit 1
