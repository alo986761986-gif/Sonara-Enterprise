name: Apply SONARA Player Volume Sync V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-player-volume-sync-v1.py'
      - '.github/workflows/apply-player-volume-sync-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply volume patch
        run: python scripts/patch-player-volume-sync-v1.py

      - name: Validate TypeScript markers
        run: |
          grep -q "Volume brano" src/components/generator/ElevenMusicGenerationControl.tsx
          grep -q "sonara.globalPlayerVolume" src/components/player/SonaraProfessionalFixedPlayer.tsx
          grep -q "data-sonara-universal-volume" src/components/player/SonaraProfessionalFixedPlayer.tsx

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/generator/ElevenMusicGenerationControl.tsx src/components/player/SonaraProfessionalFixedPlayer.tsx
          git commit -m "feat(player): add volume controls to A B and universal player"
          git push origin main
