name: Apply Video AI real media composition

on:
  push:
    paths:
      - '.github/workflows/apply-video-ai-real-media-composition.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply media composition patch
        run: node -e "global.LOCATION='us-central1'; require('./scripts/patch-video-ai-real-media-composition.cjs')"

      - name: Validate TypeScript build
        run: |
          npm ci
          npm run build

      - name: Commit final implementation and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/video/job/'[id].ts' src/server/video/transcoder.ts
          git rm scripts/patch-video-ai-real-media-composition.cjs
          git rm .github/workflows/apply-video-ai-real-media-composition.yml
          git commit -m "feat(video): compose uploaded photo video and audio into output"
          git push origin HEAD:main
