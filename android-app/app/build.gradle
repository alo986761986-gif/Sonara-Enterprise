plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sonara.enterprise'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sonara.enterprise'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0-beta'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
